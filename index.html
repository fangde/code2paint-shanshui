<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code2Paint · 中国传统国画、敦煌壁画与古典抽象油画画集</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #e6dfd0;
      background-image: radial-gradient(circle at 50% 45%, rgba(255, 252, 244, 0.35), rgba(182, 168, 140, 0.2));
      color: #2c2b28;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", Georgia, serif;
      padding: 32px 18px;
    }

    .container {
      width: min(1260px, 95vw);
      background: #efe8d7;
      border: 1px solid #cdc3ad;
      box-shadow: 0 14px 40px rgba(32, 29, 24, 0.12), inset 0 0 0 1px rgba(255, 252, 245, 0.65);
      padding: 34px 30px;
    }

    header {
      text-align: center;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(92, 84, 70, 0.22);
    }

    h1 {
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 600;
      letter-spacing: 0.16em;
      color: #23221f;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #5b574f;
      letter-spacing: 0.08em;
      line-height: 1.7;
    }

    .controls-bar {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px dashed rgba(92, 84, 70, 0.2);
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .tab-btn {
      appearance: none;
      background: #f5efe2;
      color: #3a362e;
      border: 1px solid #bdb39d;
      padding: 6px 13px;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .tab-btn:hover {
      background: #ebe2cf;
      border-color: #6b6354;
    }

    .tab-btn.active {
      background: #7c382b;
      color: #faf4e8;
      border-color: #7c382b;
    }

    .tab-count {
      opacity: 0.8;
      font-size: 12px;
      margin-left: 3px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    #searchInput {
      width: min(260px, 70vw);
      padding: 7px 12px;
      background: #f8f3e8;
      border: 1px solid #bdb39d;
      color: #24221e;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.04em;
      outline: none;
    }

    #searchInput:focus {
      border-color: #7c382b;
      background: #fffcf5;
    }

    .count-label {
      font-size: 12px;
      color: #6b665c;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      background: #f5efe2;
      border: 1px solid #bdb39d;
      padding: 20px 18px;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      background: #f8f3e8;
      border-color: #5a5449;
      box-shadow: 0 8px 22px rgba(34, 31, 25, 0.1);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .seal {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: #7c382b;
      border: 1px solid rgba(124, 56, 43, 0.45);
      padding: 2px 8px;
    }

    .group-tag {
      font-size: 11px;
      color: #6f695e;
      letter-spacing: 0.06em;
    }

    .card h2 {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.09em;
      color: #1f1e1c;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 13px;
      line-height: 1.7;
      color: #4f4c45;
      margin-bottom: 15px;
    }

    .swatch-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
    }

    .swatch {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1px solid rgba(60, 56, 48, 0.25);
    }

    .enter {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: #2f2e2a;
      border-top: 1px solid rgba(92, 84, 70, 0.18);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: #6b665c;
      font-size: 15px;
      letter-spacing: 0.08em;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #6d6960;
      letter-spacing: 0.08em;
    }

    @media (max-width: 680px) {
      .container { padding: 22px 16px; }
      .search-wrap { width: 100%; justify-content: space-between; }
      #searchInput { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>中国传统国画、敦煌壁画与古典抽象油画画集</h1>
      <p class="subtitle">统一代码毛刷引擎与逐笔播放工作台 · 142 幅写意、工笔、敦煌、古典油画与抽象教程精品 · 支持单步步进、分层跳转与高清导出</p>
    </header>

    <section class="controls-bar" aria-label="画作分类筛选与搜索">
      <div class="filter-tabs" id="filterTabs"></div>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索画作名称、技法或印章…" aria-label="搜索画作">
        <span class="count-label" id="countLabel">加载画集中…</span>
      </div>
    </section>

    <section class="gallery" id="gallery"></section>

    <footer>
      打开任意画作即可观看逐笔绘制动画，全画集统一支持单步步进（退一步 / 进一步）、进度条拖拽回看、分层跳转与保存 PNG
    </footer>
  </main>

  <script src="./artworks/registry.js"></script>
  <script src="./artworks/gongbi-10.js"></script>
  <script src="./artworks/xieyi-flowers-25.js"></script>
  <script src="./artworks/xieyi-aquatic-10.js"></script>
  <script src="./artworks/xieyi-landscape-20.js"></script>
  <script src="./artworks/xieyi-figures-10.js"></script>
  <script src="./artworks/oil-figures-10.js"></script>
  <script src="./artworks/oil-still-landscape-15.js"></script>
  <script src="./artworks/oil-abstract-8.js"></script>
  <script src="./artworks/oil-tutorials-6.js"></script>
  <script src="./artworks/oil-tutorials-10.js"></script>
  <script>
  (() => {
    'use strict';

    const catalog = window.Code2PaintCatalog;
    const tabsEl = document.getElementById('filterTabs');
    const searchEl = document.getElementById('searchInput');
    const countEl = document.getElementById('countLabel');
    const galleryEl = document.getElementById('gallery');

    if (!catalog) {
      galleryEl.innerHTML = '<div class="empty-state">画集数据加载失败，请刷新重试。</div>';
      return;
    }

    const allWorks = catalog.getAll();
    const GROUPS = ['全部', '国画·工笔', '国画·花鸟', '国画·水族', '国画·山水', '国画·人物敦煌', '油画·人物', '油画·静物风景', '油画·抽象印象', '油画·经典教程'];
    let activeGroup = '全部';
    let query = '';

    function escHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderTabs() {
      const counts = { '全部': allWorks.length };
      for (const w of allWorks) {
        counts[w.group] = (counts[w.group] || 0) + 1;
      }
      tabsEl.innerHTML = GROUPS.map(g => {
        const isActive = g === activeGroup;
        const n = counts[g] || 0;
        return `<button class="tab-btn${isActive ? ' active' : ''}" type="button" data-group="${escHtml(g)}">${escHtml(g)}<span class="tab-count">(${n})</span></button>`;
      }).join('');

      tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeGroup = btn.dataset.group;
          renderTabs();
          renderGallery();
        });
      });
    }

    function renderGallery() {
      const q = query.trim().toLowerCase();
      const filtered = allWorks.filter(w => {
        if (activeGroup !== '全部' && w.group !== activeGroup) return false;
        if (!q) return true;
        const hay = `${w.title} ${w.seal} ${w.group} ${w.category || ''} ${w.desc || ''} ${w.subtitle || ''}`.toLowerCase();
        return hay.includes(q);
      });

      countEl.textContent = `显示 ${filtered.length} / ${allWorks.length} 幅作品`;

      if (!filtered.length) {
        galleryEl.innerHTML = '<div class="empty-state">没有找到匹配该关键词的作品，请尝试清空搜索或切换分类。</div>';
        return;
      }

      galleryEl.innerHTML = filtered.map(w => {
        const href = catalog.urlFor(w);
        const swatches = (w.swatches || []).slice(0, 5).map(c => `<span class="swatch" style="background: ${escHtml(c)};"></span>`).join('');
        const cta = w.url ? '进入逐笔赏析' : '进入分步临摹';
        return `
          <a class="card" href="${escHtml(href)}">
            <div>
              <div class="card-meta">
                <span class="seal">${escHtml(w.seal || w.category || '精品赏析')}</span>
                <span class="group-tag">${escHtml(w.group)}</span>
              </div>
              <h2>${escHtml(w.title)}</h2>
              <p>${escHtml(w.desc || w.subtitle || '')}</p>
              <div class="swatch-row">${swatches}</div>
            </div>
            <div class="enter">
              <span>${cta}</span>
              <span>&rarr;</span>
            </div>
          </a>
        `;
      }).join('');
    }

    searchEl.addEventListener('input', () => {
      query = searchEl.value;
      renderGallery();
    });

    renderTabs();
    renderGallery();
  })();
  </script>
</body>
</html>

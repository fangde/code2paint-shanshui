<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基础油画·光影红苹果</title>
</head>
<body>
<script src="./tutorial-engine.js"></script>
<script>
const LAYERS = [
  { id: 1, name: '一 · 熟褐有色底与投影' },
  { id: 2, name: '二 · 固有色与明暗交界' },
  { id: 3, name: '三 · 球体体积与反光塑形' },
  { id: 4, name: '四 · 印象笔触与高光点睛' }
];

window.Code2PaintTutorial.mount({
  title: '基础油画·光影红苹果',
  subtitle: '古典静物四步法（3D体积光影 + 5000笔方向性堆彩）：熟褐底与投影 → 固有色与交界线 → 环境反光与叶梗 → 窗影高光点睛',
  category: '古典油画',
  mode: 'oil',
  theme: 'gallery-dark',
  backdropColor: '#201611',
  width: 1000,
  height: 920,
  seed: 202609,
  fileName: '基础油画光影红苹果',
  layers: LAYERS,
  buildStrokes(api) {
    const M = window.Code2PaintOilMaster;
    const W = 1000, H = 920;
    const cx = 490, cy = 498, rx = 166, ry = 154;
    const scene = M.createScene(W, H, 202609);

    scene.shadeBackdropWallTable({
      horizonY: 584,
      lightX: 250,
      lightY: 190,
      wallLit: [62, 46, 33],
      wallMid: [30, 21, 15],
      wallDark: [12, 9, 7],
      tableType: 'wood',
      tableLit: [122, 84, 52],
      tableMid: [72, 47, 29],
      tableDark: [26, 17, 11],
      tableEdgeY: 855,
      castShadows: [
        { cx: cx + 78, cy: cy + 126, rx: 198, ry: 48, rot: 0.05, strength: 0.78, col: [14, 9, 7] },
        { cx: cx + 12, cy: cy + 144, rx: 105, ry: 22, rot: 0.02, strength: 0.88, col: [10, 6, 5] }
      ]
    });

    // Soft red reflected glow cast onto tabletop just under sunlit cheek
    scene.draw2D((ctx) => {
      const g = ctx.createRadialGradient(cx - 25, cy + 158, 10, cx - 10, cy + 158, 95);
      g.addColorStop(0, 'rgba(138, 46, 28, 0.34)');
      g.addColorStop(1, 'rgba(138, 46, 28, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(cx - 10, cy + 158, 95, 22, 0, 0, Math.PI * 2);
      ctx.fill();
    });

    // 3D Sculpted bi-color crimson & golden apple with top dimple cavity & studio specular
    scene.shadeFruit3D({
      cx, cy, rx, ry,
      kind: 'apple',
      colLit: [236, 134, 56],
      colMid: [188, 38, 28],
      colShadow: [44, 12, 14],
      colBlush: [242, 184, 82],
      bounceCol: [184, 92, 48],
      specCol: [255, 248, 232],
      lightDir: [-0.64, -0.58, 0.50],
      shininess: 38,
      specStrength: 0.86
    });

    // Woody curved stem & illuminated olive-green veined leaf emerging from cavity
    scene.draw2D((ctx) => {
      ctx.lineCap = 'round';
      // Stem cast shadow onto top shoulder
      ctx.strokeStyle = 'rgba(28, 12, 10, 0.55)';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(cx - 2, cy - 88);
      ctx.quadraticCurveTo(cx + 18, cy - 92, cx + 32, cy - 86);
      ctx.stroke();

      // Shaded woody stem
      const sg = ctx.createLinearGradient(cx - 12, cy - 180, cx + 22, cy - 86);
      sg.addColorStop(0, '#a67b4b');
      sg.addColorStop(0.5, '#684429');
      sg.addColorStop(1, '#321e13');
      ctx.strokeStyle = sg;
      ctx.lineWidth = 13;
      ctx.beginPath();
      ctx.moveTo(cx - 5, cy - 90);
      ctx.quadraticCurveTo(cx + 2, cy - 138, cx + 24, cy - 186);
      ctx.stroke();

      // Veined olive-green leaf curving right
      ctx.save();
      ctx.translate(cx + 12, cy - 154);
      ctx.rotate(-0.24);
      const lg = ctx.createLinearGradient(-10, -28, 115, 24);
      lg.addColorStop(0, '#78963c');
      lg.addColorStop(0.5, '#53722b');
      lg.addColorStop(1, '#2f4518');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(36, -34, 88, -28, 128, 4);
      ctx.bezierCurveTo(84, 28, 34, 24, 0, 0);
      ctx.fill();

      // Central golden-green midrib & lateral veins
      ctx.strokeStyle = '#a8be64';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(6, -1);
      ctx.quadraticCurveTo(64, -8, 118, 3);
      ctx.stroke();
      ctx.restore();
    });

    M.synthesize(api, scene, {
      style: 'classic',
      totalStrokes: 5000,
      seed: 202609,
      layers: LAYERS,
      roi: [
        { cx, cy, rx: 215, ry: 220, boost: 4.2 },
        { cx: cx - 58, cy: cy - 52, rx: 60, ry: 48, boost: 2.5 },
        { cx: cx + 45, cy: cy - 155, rx: 88, ry: 55, boost: 3.0 }
      ]
    });
  }
});
</script>
</body>
</html>

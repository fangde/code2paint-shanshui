<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>敦煌飞天 · 百笔白描工笔盛彩版（Canvas 2D）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #26211c;
      background-image: radial-gradient(circle at 50% 42%, #3a3128 0%, #1e1915 100%);
      color: #f0e4ce;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", Georgia, serif;
      padding: 20px 16px;
      user-select: none;
    }

    .mural-frame {
      background: #47392b;
      padding: 14px;
      border: 1px solid #765f47;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(247, 241, 227, 0.18);
      max-width: 100%;
    }

    #muralCanvas {
      display: block;
      width: min(1160px, 93vw);
      height: auto;
      aspect-ratio: 16 / 10;
      background: #f6eee0;
      border: 1px solid rgba(72, 54, 38, 0.45);
    }

    .progress-panel {
      margin-top: 12px;
      width: min(1188px, 93vw);
      padding: 10px 12px;
      background: rgba(58, 46, 36, 0.78);
      border: 1px solid #6b5642;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #progressSlider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: linear-gradient(90deg, #c24b32 0%, #dfb05d var(--pct, 0%), #352a20 var(--pct, 0%));
      border: 1px solid #755e47;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    #progressSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f0cf88;
      border: 2px solid #4a3728;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    #progressSlider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    #progressSlider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f0cf88;
      border: 2px solid #4a3728;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      cursor: pointer;
    }

    .progress-percent {
      min-width: 54px;
      text-align: right;
      font-size: 13px;
      color: #eedab2;
      font-variant-numeric: tabular-nums;
    }

    .layer-steps {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    button {
      appearance: none;
      background: #4a3a2c;
      color: #f4e7cf;
      border: 1px solid #8a7055;
      padding: 7px 16px;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #5c4837;
      border-color: #bfa07c;
    }

    button:active {
      transform: translateY(1px);
    }

    button.active {
      background: #b2452f;
      color: #fcf4e6;
      border-color: #db745b;
    }

    button.small-btn {
      padding: 6px 12px;
      font-size: 13px;
      letter-spacing: 0.06em;
    }

    button.download-btn {
      background: #1d6b80;
      border-color: #469cb3;
      color: #eef8fa;
    }

    button.download-btn:hover {
      background: #25819a;
      border-color: #6bc0d6;
    }

    .layer-chip {
      padding: 4px 10px;
      font-size: 12px;
      letter-spacing: 0.06em;
      background: #3a2e23;
      color: #bfa988;
      border: 1px solid #64503d;
    }

    .layer-chip.done {
      color: #f0dec0;
      border-color: #8a7055;
      background: #48392b;
    }

    .layer-chip.current {
      background: #9f432e;
      color: #fcf4e6;
      border-color: #d6765d;
    }

    .hint-text {
      margin-left: auto;
      font-size: 11px;
      color: #a89377;
      letter-spacing: 0.04em;
    }

    .toolbar {
      margin-top: 12px;
      width: min(1188px, 93vw);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 4px;
    }

    .status-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 14px;
      color: #ded0b8;
      letter-spacing: 0.06em;
    }

    .status-layer {
      font-weight: 600;
      color: #f7ead0;
    }

    .status-count {
      font-size: 13px;
      color: #c7b190;
      font-variant-numeric: tabular-nums;
    }

    .btn-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="mural-frame">
    <canvas id="muralCanvas" width="1280" height="800"></canvas>
  </div>

  <div class="progress-panel">
    <div class="progress-row">
      <input id="progressSlider" type="range" min="0" max="0" value="0" step="1" aria-label="作画进度条" />
      <span id="progressPercent" class="progress-percent">0.0%</span>
    </div>
    <div class="layer-steps" id="layerSteps">
      <button class="layer-chip" type="button" data-layer="1">一层·白描勾线</button>
      <button class="layer-chip" type="button" data-layer="2">二层·平涂设色</button>
      <button class="layer-chip" type="button" data-layer="3">三层·凹凸分染</button>
      <button class="layer-chip" type="button" data-layer="4">四层·开脸复勾</button>
      <button class="layer-chip" type="button" data-layer="5">五层·提白描金</button>
      <span class="hint-text">支持逐笔看：退一步 / 进一步 / ← → 单笔微调（Shift ±10 笔 · 空格暂停）</span>
    </div>
  </div>

  <div class="toolbar">
    <div class="status-group">
      <span id="layerStatus" class="status-layer">铺设新白粉地仗…</span>
      <span id="strokeStatus" class="status-count">0 / 0 笔</span>
    </div>
    <div class="btn-group">
      <button id="playPauseBtn" class="small-btn" type="button">暂停</button>
      <button id="stepBackBtn" class="small-btn" type="button">退一步</button>
      <button id="stepForwardBtn" class="small-btn" type="button">进一步</button>
      <button id="redrawBtn" type="button">重新绘制</button>
      <button id="speedBtn" type="button">加速</button>
      <button id="downloadBtn" class="download-btn" type="button">下载 PNG</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // 顶部常量、新白粉地仗、十八描矿物颜料与播放参数配置区
    // =========================================================================
    const CONFIG = {
      CANVAS_WIDTH: 1280,
      CANVAS_HEIGHT: 800,

      // 新刷白粉壁面（温润明净、无裂纹黑斑，还原初绘唐代盛彩质感）
      WALL: {
        BASE_COLOR: '#f6eee0',
        EDGE_VIGNETTE: 'rgba(216, 200, 172, 0.24)',
        NOISE_INTENSITY: 3,
        FIBER_COUNT: 220
      },

      // 传统十八描线型与敦煌不退色矿彩色板
      PALETTE: {
        INK_FACE:      '#6a4f3f', // 淡赭墨：开脸五官（游丝描，柔而不死）
        INK_LINE:      '#423026', // 古松烟墨：发髻、衣纹、飘带勾线
        INK_DARK:      '#231a15', // 焦墨：点睛与关键复勾
        INK_CINNABAR:  '#c8462c', // 朱砂线：腰带、唇缝、流云蔓茎
        SKIN_LIGHT:    '#f5e6d7', // 温润粉肉底色（明净肤色）
        SKIN_BLUSH:    '#e5957b', // 桃花红颊晕染
        SKIN_SHADE:    '#c99672', // 西域凹凸淡赭分染
        HAIR_INK:      '#2b2421', // 乌墨发髻
        CROWN_GREEN:   '#276d5b', // 冠结石绿
        GOLD_OCHRE:    '#d4983a', // 泥金暖赭（箜篌、项圈、腕钏）
        GOLD_BRIGHT:   '#f1c456', // 亮煌泥金提亮
        VERMILION:     '#d93c28', // 饱满朱砂
        VERMILION_DEEP:'#a82b1d', // 暗部重朱砂
        MALACHITE:     '#24916a', // 饱满石绿（长裙）
        MALACHITE_DEEP:'#166147', // 深石绿分染
        LAPIS_BRIGHT:  '#158cb8', // 饱满孔雀石青（天衣飘带）
        LAPIS_DEEP:    '#0f5f8c', // 深石青分染
        ROSETTE_INK:   '#252c2b', // 宝相花三瓣黛墨珠
        CLAM_WHITE:    '#fcf8ef'  // 蛤粉三白高光
      },

      // 动画速度档位（约 200 笔完整手绘笔顺，每笔均可见起收运笔过程）
      SPEED_LEVELS: [
        { label: '加速',    rate: 1 },
        { label: '加速 ×2', rate: 2 },
        { label: '加速 ×4', rate: 4 },
        { label: '加速 ×8', rate: 8 }
      ],

      // 每按一次“进一步/退一步”精确步进 1 笔
      STEP_DELTA: 1,

      LAYER_NAMES: [
        '',
        '一层·白描勾线',
        '二层·平涂设色',
        '三层·凹凸分染',
        '四层·开脸复勾',
        '五层·提白描金'
      ]
    };

    // DOM 引用
    const canvas = document.getElementById('muralCanvas');
    const ctx = canvas.getContext('2d');
    const layerStatusEl = document.getElementById('layerStatus');
    const strokeStatusEl = document.getElementById('strokeStatus');
    const progressSlider = document.getElementById('progressSlider');
    const progressPercentEl = document.getElementById('progressPercent');
    const layerChips = Array.from(document.querySelectorAll('.layer-chip'));
    const playPauseBtn = document.getElementById('playPauseBtn');
    const stepBackBtn = document.getElementById('stepBackBtn');
    const stepForwardBtn = document.getElementById('stepForwardBtn');
    const redrawBtn = document.getElementById('redrawBtn');
    const speedBtn = document.getElementById('speedBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let wallCanvas = null;
    let baseCanvas = null;
    let baseCtx = null;
    const brushTipCache = new Map();
    let mineralGrainCanvas = null;

    let strokeQueue = [];
    let layerEndIndices = [0, 0, 0, 0, 0, 0];
    let completedCount = 0;
    let activeT = 0;
    let speedIndex = 0;
    let animFrameId = null;
    let isPaused = false;
    let pendingSeek = null;
    let seekRafId = null;

    function clamp(v, min, max) {
      return v < min ? min : (v > max ? max : v);
    }

    function createPRNG(seed) {
      let s = seed >>> 0;
      return function () {
        s += 0x6D2B79F5;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // =========================================================================
    // 1. 新刷白粉壁面地仗生成
    // =========================================================================
    function buildFreshChalkWall() {
      const off = document.createElement('canvas');
      off.width = CONFIG.CANVAS_WIDTH;
      off.height = CONFIG.CANVAS_HEIGHT;
      const wctx = off.getContext('2d');

      wctx.fillStyle = CONFIG.WALL.BASE_COLOR;
      wctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

      const rand = createPRNG(28505);

      // 刷白粉泥底水平暗扫笔意
      for (let i = 0; i < 42; i++) {
        const y = rand() * CONFIG.CANVAS_HEIGHT;
        const h = 28 + rand() * 75;
        wctx.fillStyle = i % 2 === 0
          ? 'rgba(255, 252, 244, 0.10)'
          : 'rgba(222, 206, 178, 0.08)';
        wctx.fillRect(0, y, CONFIG.CANVAS_WIDTH, h);
      }

      // 细腻矿砂纸壁肌理（轻柔微粒，不留脏污黑点）
      const imgData = wctx.getImageData(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      const data = imgData.data;
      const amp = CONFIG.WALL.NOISE_INTENSITY;
      for (let i = 0; i < data.length; i += 4) {
        const n = (rand() + rand() - 1) * amp;
        data[i] = clamp(data[i] + n, 0, 255);
        data[i + 1] = clamp(data[i + 1] + n * 0.95, 0, 255);
        data[i + 2] = clamp(data[i + 2] + n * 0.85, 0, 255);
      }
      wctx.putImageData(imgData, 0, 0);

      // 细麻筋隐纹
      wctx.lineCap = 'round';
      for (let i = 0; i < CONFIG.WALL.FIBER_COUNT; i++) {
        const x = rand() * CONFIG.CANVAS_WIDTH;
        const y = rand() * CONFIG.CANVAS_HEIGHT;
        const len = 6 + rand() * 14;
        const ang = (rand() - 0.5) * 0.9;
        wctx.strokeStyle = rand() > 0.5
          ? 'rgba(255, 252, 246, 0.24)'
          : 'rgba(196, 178, 148, 0.14)';
        wctx.lineWidth = 0.65;
        wctx.beginPath();
        wctx.moveTo(x, y);
        wctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        wctx.stroke();
      }

      // 四周柔和聚光晕边
      const vignette = wctx.createRadialGradient(
        CONFIG.CANVAS_WIDTH * 0.56, CONFIG.CANVAS_HEIGHT * 0.45, CONFIG.CANVAS_WIDTH * 0.28,
        CONFIG.CANVAS_WIDTH * 0.52, CONFIG.CANVAS_HEIGHT * 0.50, CONFIG.CANVAS_WIDTH * 0.78
      );
      vignette.addColorStop(0, 'rgba(255, 252, 245, 0)');
      vignette.addColorStop(1, CONFIG.WALL.EDGE_VIGNETTE);
      wctx.fillStyle = vignette;
      wctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

      return off;
    }

    // =========================================================================
    // 2. 传统十八描几何细分与水墨毛笔/羊毫渲染引擎
    // =========================================================================
    function hexToRgb(hex) {
      const clean = (hex || '#423026').replace('#', '');
      const full = clean.length === 3
        ? clean[0] + clean[0] + clean[1] + clean[1] + clean[2] + clean[2]
        : clean;
      const n = parseInt(full, 16) || 0;
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function rgbaStr(rgb, a) {
      return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${clamp(a, 0, 1).toFixed(3)})`;
    }

    // 缓存毛笔笔锋多毫印章贴图（中心饱满、四周含细微笔毫参差与水墨柔边）
    function getBrushTipSprite(color) {
      if (brushTipCache.has(color)) return brushTipCache.get(color);
      const size = 32;
      const tipCanvas = document.createElement('canvas');
      tipCanvas.width = size;
      tipCanvas.height = size;
      const tctx = tipCanvas.getContext('2d');
      const rgb = hexToRgb(color);
      const rand = createPRNG(rgb[0] * 65537 + rgb[1] * 257 + rgb[2] + 911);

      // 外围极轻水墨晕染底
      const halo = tctx.createRadialGradient(16, 16, 1, 16, 16, 15);
      halo.addColorStop(0, rgbaStr(rgb, 0.34));
      halo.addColorStop(0.55, rgbaStr(rgb, 0.16));
      halo.addColorStop(1, rgbaStr(rgb, 0));
      tctx.fillStyle = halo;
      tctx.beginPath();
      tctx.arc(16, 16, 15, 0, Math.PI * 2);
      tctx.fill();

      // 8 束狼毫聚锋微斑，构成非正圆自然毛笔截面
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2 + (rand() - 0.5) * 0.45;
        const dist = (i === 0) ? 0.5 : (2.2 + rand() * 4.2);
        const cx = 16 + Math.cos(ang) * dist * 0.9;
        const cy = 16 + Math.sin(ang) * dist * 1.1;
        const r = i === 0 ? 9.5 : (5.0 + rand() * 4.2);
        const g = tctx.createRadialGradient(cx, cy, 0.4, cx, cy, r);
        g.addColorStop(0, rgbaStr(rgb, i === 0 ? 0.65 : 0.48));
        g.addColorStop(0.6, rgbaStr(rgb, 0.20));
        g.addColorStop(1, rgbaStr(rgb, 0));
        tctx.fillStyle = g;
        tctx.beginPath();
        tctx.arc(cx, cy, r, 0, Math.PI * 2);
        tctx.fill();
      }

      brushTipCache.set(color, tipCanvas);
      return tipCanvas;
    }

    // 矿彩颗粒与生宣丝理叠加质感图元
    function getMineralGrainCanvas() {
      if (mineralGrainCanvas) return mineralGrainCanvas;
      const size = 128;
      const gCanvas = document.createElement('canvas');
      gCanvas.width = size;
      gCanvas.height = size;
      const gctx = gCanvas.getContext('2d');
      const rand = createPRNG(51829);

      gctx.clearRect(0, 0, size, size);
      // 细微矿物沉淀斑与纸纹
      for (let i = 0; i < 420; i++) {
        const x = rand() * size;
        const y = rand() * size;
        const r = 0.6 + rand() * 1.9;
        const warm = rand() > 0.42;
        gctx.fillStyle = warm
          ? `rgba(110, 88, 62, ${(0.06 + rand() * 0.12).toFixed(3)})`
          : `rgba(255, 250, 240, ${(0.10 + rand() * 0.18).toFixed(3)})`;
        gctx.beginPath();
        gctx.arc(x, y, r, 0, Math.PI * 2);
        gctx.fill();
      }

      gctx.lineCap = 'round';
      for (let i = 0; i < 48; i++) {
        const x = rand() * size;
        const y = rand() * size;
        const ang = (rand() - 0.5) * 1.1;
        const len = 8 + rand() * 20;
        gctx.strokeStyle = `rgba(90, 72, 52, ${(0.05 + rand() * 0.08).toFixed(3)})`;
        gctx.lineWidth = 0.7;
        gctx.beginPath();
        gctx.moveTo(x, y);
        gctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        gctx.stroke();
      }

      mineralGrainCanvas = gCanvas;
      return mineralGrainCanvas;
    }

    function catmullRomSpline(points, samplesPerSeg = 14, closed = false) {
      if (!points || points.length < 2) return points ? points.slice() : [];
      const n = points.length;
      const out = [];
      const segCount = closed ? n : n - 1;

      const getPt = (idx) => {
        if (closed) return points[(idx + n) % n];
        if (idx < 0) {
          return [
            points[0][0] * 2 - points[1][0],
            points[0][1] * 2 - points[1][1]
          ];
        }
        if (idx >= n) {
          return [
            points[n - 1][0] * 2 - points[n - 2][0],
            points[n - 1][1] * 2 - points[n - 2][1]
          ];
        }
        return points[idx];
      };

      for (let i = 0; i < segCount; i++) {
        const p0 = getPt(i - 1);
        const p1 = getPt(i);
        const p2 = getPt(i + 1);
        const p3 = getPt(i + 2);
        const steps = i === segCount - 1 && !closed ? samplesPerSeg : samplesPerSeg;
        for (let k = 0; k < steps; k++) {
          const t = k / samplesPerSeg;
          const t2 = t * t;
          const t3 = t2 * t;
          const x = 0.5 * (
            (2 * p1[0]) +
            (-p0[0] + p2[0]) * t +
            (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
            (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3
          );
          const y = 0.5 * (
            (2 * p1[1]) +
            (-p0[1] + p2[1]) * t +
            (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
            (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3
          );
          out.push([x, y]);
        }
      }
      if (!closed) {
        out.push([points[n - 1][0], points[n - 1][1]]);
      }
      return out;
    }

    function computeCurveLengths(pts) {
      const cum = [0];
      let total = 0;
      for (let i = 1; i < pts.length; i++) {
        const dx = pts[i][0] - pts[i - 1][0];
        const dy = pts[i][1] - pts[i - 1][1];
        total += Math.hypot(dx, dy);
        cum.push(total);
      }
      return { cum, total };
    }

    function sliceCurveByFraction(pts, cum, total, frac) {
      if (frac >= 0.9999) return { pts, cum, segLen: total };
      if (pts.length < 2 || frac <= 0) return { pts: [], cum: [], segLen: 0 };
      const targetLen = total * clamp(frac, 0, 1);
      if (targetLen < 0.5) return { pts: [], cum: [], segLen: 0 };

      const outPts = [pts[0]];
      const outCum = [0];
      for (let i = 1; i < pts.length; i++) {
        if (cum[i] <= targetLen) {
          outPts.push(pts[i]);
          outCum.push(cum[i]);
        } else {
          const prevLen = cum[i - 1];
          const seg = cum[i] - prevLen;
          const r = seg > 1e-5 ? (targetLen - prevLen) / seg : 0;
          const x = pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * r;
          const y = pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * r;
          outPts.push([x, y]);
          outCum.push(targetLen);
          break;
        }
      }
      return { pts: outPts, cum: outCum, segLen: targetLen };
    }

    // 十八描笔锋粗细调制函数（强化提按、入笔藏锋与出锋锐尖节奏）
    function brushProfileWidth(u, baseW, style, seed, bendFactor = 0) {
      const wave = 1 + 0.10 * Math.sin(seed * 3.1 + u * 23.0) + 0.06 * Math.cos(seed * 7.7 + u * 47.0);
      const turnPress = 1 + bendFactor * 0.38;

      if (style === 'yousi') {
        // 高古游丝描：细劲含蓄，起笔微顿，收笔轻提
        const entry = u < 0.07 ? (1.18 - 0.18 * (u / 0.07)) : 1.0;
        const tail = u > 0.88 ? Math.max(0.28, (1 - u) / 0.12) : 1.0;
        const cap = Math.min(1, u / 0.025);
        return baseW * (0.42 + 0.62 * cap) * entry * tail * (1 + 0.05 * Math.sin(seed + u * 26)) * (1 + bendFactor * 0.18);
      }
      if (style === 'tiexian') {
        // 铁线描：藏锋起笔、中段骨力沉稳、转折顿挫、收笔回锋
        const press = (u < 0.07 || u > 0.93) ? 1.24 : 1.02;
        const cap = Math.min(1, u / 0.02, (1 - u) / 0.02);
        return baseW * 1.15 * press * (0.38 + 0.62 * cap) * turnPress * wave;
      }
      if (style === 'lanye') {
        // 兰叶描：尖毫入纸，行中按笔饱满丰润，收尾如兰叶出锋
        const belly = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.68);
        return baseW * 1.32 * (0.18 + 1.48 * belly) * turnPress * wave;
      }
      if (style === 'xingyun') {
        // 行云流水描：开合顿挫分明，顺风纤细、转折沉厚
        const env = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.40);
        const pulse = 0.72 + 0.44 * Math.sin(seed + u * Math.PI * 3.8);
        return baseW * 1.28 * (0.16 + 1.18 * env * pulse) * turnPress * wave;
      }
      if (style === 'dingtou') {
        // 钉头鼠尾描：入笔重按作“钉头”，行笔渐提作锐细“鼠尾”
        if (u < 0.08) {
          return baseW * 1.30 * (0.65 + 1.10 * Math.sin((u / 0.08) * Math.PI * 0.5));
        }
        const tail = Math.pow(clamp((1 - u) / 0.92, 0, 1), 0.85);
        return baseW * 1.30 * (0.14 + 1.56 * tail) * turnPress * wave;
      }
      // 柔和晕染宽度
      const env = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.55);
      return baseW * (0.3 + 0.85 * env);
    }

    function drawCalligraphicPath(targetCtx, pts, cum, totalLen, opts, tFrac) {
      if (pts.length < 2 || totalLen < 0.5) return;
      const baseW = opts.width || 2.2;
      const style = opts.style || 'yousi';
      const seed = opts.seed || 1;
      const alpha = opts.alpha !== undefined ? opts.alpha : 0.92;
      const isDrawingTip = tFrac < 0.999;

      // 层 3 渐变水墨退晕保持柔和光滑笔痕
      if (style === 'soft') {
        const leftPts = [];
        const rightPts = [];
        for (let i = 0; i < pts.length; i++) {
          const prev = i === 0 ? pts[0] : pts[i - 1];
          const next = i === pts.length - 1 ? pts[pts.length - 1] : pts[i + 1];
          let tx = next[0] - prev[0];
          let ty = next[1] - prev[1];
          const mag = Math.hypot(tx, ty) || 1;
          tx /= mag;
          ty /= mag;
          const uFull = totalLen > 0 ? cum[i] / totalLen : 0;
          const w = brushProfileWidth(uFull, baseW, 'soft', seed, 0);
          const hw = w * 0.5;
          leftPts.push([pts[i][0] - ty * hw, pts[i][1] + tx * hw]);
          rightPts.push([pts[i][0] + ty * hw, pts[i][1] - tx * hw]);
        }
        targetCtx.save();
        targetCtx.globalCompositeOperation = opts.blend || 'multiply';
        targetCtx.globalAlpha = alpha;
        targetCtx.fillStyle = opts.color;
        targetCtx.beginPath();
        targetCtx.moveTo(leftPts[0][0], leftPts[0][1]);
        for (let i = 1; i < leftPts.length; i++) targetCtx.lineTo(leftPts[i][0], leftPts[i][1]);
        for (let i = rightPts.length - 1; i >= 0; i--) targetCtx.lineTo(rightPts[i][0], rightPts[i][1]);
        targetCtx.closePath();
        targetCtx.fill();
        targetCtx.restore();
        return;
      }

      // 预计算切线、法线、转折曲率（转折按笔聚墨）及沿线采样毛笔状态
      const samples = [];
      for (let i = 0; i < pts.length; i++) {
        const prev2 = pts[Math.max(0, i - 2)];
        const prev = pts[Math.max(0, i - 1)];
        const cur = pts[i];
        const next = pts[Math.min(pts.length - 1, i + 1)];
        const next2 = pts[Math.min(pts.length - 1, i + 2)];

        let tx = next[0] - prev[0];
        let ty = next[1] - prev[1];
        const mag = Math.hypot(tx, ty) || 1;
        tx /= mag;
        ty /= mag;

        // 局部转向角估计转折顿挫
        let vx1 = cur[0] - prev2[0], vy1 = cur[1] - prev2[1];
        let vx2 = next2[0] - cur[0], vy2 = next2[1] - cur[1];
        const m1 = Math.hypot(vx1, vy1) || 1;
        const m2 = Math.hypot(vx2, vy2) || 1;
        const dot = clamp((vx1 * vx2 + vy1 * vy2) / (m1 * m2), -1, 1);
        const bendFactor = clamp((1 - dot) * 0.9, 0, 1);

        const uFull = totalLen > 0 ? cum[i] / totalLen : 0;
        let w = brushProfileWidth(uFull, baseW, style, seed, bendFactor);
        if (isDrawingTip && i >= pts.length - 4) {
          const tipFade = clamp((pts.length - 1 - i) / 3, 0.16, 1);
          w *= tipFade;
        }

        // 沿长笔墨色自然浓淡变化（饱满入笔 → 转折蓄墨 → 尾锋稍淡）
        const longStrokeDry = totalLen > 120
          ? clamp(1.04 - 0.24 * Math.pow(uFull, 1.35) + 0.14 * bendFactor, 0.68, 1.08)
          : 1.0;

        samples.push({
          x: cur[0],
          y: cur[1],
          nx: -ty,
          ny: tx,
          ang: Math.atan2(ty, tx),
          w,
          u: uFull,
          s: cum[i],
          bend: bendFactor,
          inkRichness: longStrokeDry
        });
      }

      const rgb = hexToRgb(opts.color);
      const tipSprite = getBrushTipSprite(opts.color);

      targetCtx.save();
      targetCtx.globalCompositeOperation = opts.blend || 'source-over';

      // 第一遍：宣纸/白粉壁水墨渗化晕边（较宽且柔淡，消除矢量生硬感）
      targetCtx.beginPath();
      for (let i = 0; i < samples.length; i++) {
        const sp = samples[i];
        const hw = sp.w * 0.92;
        const px = sp.x + sp.nx * hw;
        const py = sp.y + sp.ny * hw;
        if (i === 0) targetCtx.moveTo(px, py);
        else targetCtx.lineTo(px, py);
      }
      for (let i = samples.length - 1; i >= 0; i--) {
        const sp = samples[i];
        const hw = sp.w * 0.92;
        targetCtx.lineTo(sp.x - sp.nx * hw, sp.y - sp.ny * hw);
      }
      targetCtx.closePath();
      targetCtx.globalAlpha = alpha * 0.13;
      targetCtx.fillStyle = opts.color;
      targetCtx.fill();

      // 第二遍：沿弧长连续点印旋转毛笔笔毫贴图 + 微颤，形成真实毛笔肚腹与浓淡墨韵
      let nextStampS = 0;
      for (let i = 0; i < samples.length - 1; i++) {
        const a = samples[i];
        const b = samples[i + 1];
        const segLen = b.s - a.s;
        if (segLen <= 0.05) continue;

        while (nextStampS <= b.s) {
          const r = clamp((nextStampS - a.s) / segLen, 0, 1);
          const x = a.x + (b.x - a.x) * r;
          const y = a.y + (b.y - a.y) * r;
          const nx = a.nx + (b.nx - a.nx) * r;
          const ny = a.ny + (b.ny - a.ny) * r;
          const w = a.w + (b.w - a.w) * r;
          const u = a.u + (b.u - a.u) * r;
          const ink = a.inkRichness + (b.inkRichness - a.inkRichness) * r;

          // 运笔微颤与纸纹跳过（长线条尾部出现自然轻微飞白）
          const dryWave = Math.sin(seed * 7.3 + nextStampS * 0.43) + 0.5 * Math.cos(seed * 2.9 + nextStampS * 0.97);
          const allowFlyingWhite = (style !== 'yousi') && totalLen > 125 && u > 0.62;
          const dryCut = allowFlyingWhite && dryWave > 0.98 - (u - 0.62) * 0.6;

          if (!dryCut) {
            const wobble = 0.22 * Math.sin(seed * 5.1 + nextStampS * 0.33);
            const dabW = Math.max(1.1, w * 1.48);
            const dabH = Math.max(1.1, w * 1.24);
            targetCtx.save();
            targetCtx.translate(x + nx * wobble, y + ny * wobble);
            targetCtx.rotate(a.ang);
            targetCtx.globalAlpha = clamp(alpha * 0.44 * ink, 0.08, 0.72);
            targetCtx.drawImage(tipSprite, -dabW * 0.5, -dabH * 0.5, dabW, dabH);
            targetCtx.restore();
          }
          nextStampS += Math.max(0.85, w * 0.34);
        }
      }

      // 第三遍：狼毫分丝与飞白笔筋（主锋 + 侧锋 3~4 股丝缕，内段用 butt 消除接缝圆斑）
      const bristleOffsets = (baseW >= 1.7 && style !== 'yousi')
        ? [
            { off: -0.34, wRatio: 0.28, aRatio: 0.46, breakBias: 0.55 },
            { off: -0.06, wRatio: 0.44, aRatio: 0.78, breakBias: 1.05 },
            { off: 0.14,  wRatio: 0.34, aRatio: 0.62, breakBias: 0.85 },
            { off: 0.36,  wRatio: 0.24, aRatio: 0.42, breakBias: 0.45 }
          ]
        : [
            { off: 0.0,   wRatio: 0.52, aRatio: 0.80, breakBias: 99 },
            { off: 0.24,  wRatio: 0.24, aRatio: 0.36, breakBias: 99 }
          ];

      targetCtx.lineCap = 'butt';
      targetCtx.lineJoin = 'round';
      targetCtx.strokeStyle = rgbaStr(rgb, 1);

      for (let bIdx = 0; bIdx < bristleOffsets.length; bIdx++) {
        const br = bristleOffsets[bIdx];
        for (let i = 0; i < samples.length - 1; i++) {
          const p1 = samples[i];
          const p2 = samples[i + 1];
          // 长笔末尾侧毫自然断开形成毛笔飞白丝理
          if (style !== 'yousi' && totalLen > 110 && p1.u > 0.54) {
            const gapSignal = Math.sin(seed * (bIdx + 3.1) + p1.s * 0.48) + 0.5 * Math.cos(seed * 11.7 + p1.s * 0.83);
            if (gapSignal > br.breakBias - (p1.u - 0.54) * 0.75) continue;
          }
          const shift1 = p1.w * br.off;
          const shift2 = p2.w * br.off;
          const segW = Math.max(0.45, ((p1.w + p2.w) * 0.5) * br.wRatio);
          targetCtx.globalAlpha = clamp(alpha * br.aRatio * p1.inkRichness, 0.08, 0.92);
          targetCtx.lineWidth = segW;
          targetCtx.beginPath();
          targetCtx.moveTo(p1.x + p1.nx * shift1, p1.y + p1.ny * shift1);
          targetCtx.lineTo(p2.x + p2.nx * shift2, p2.y + p2.ny * shift2);
          targetCtx.stroke();
        }
      }

      targetCtx.restore();
    }

    // 计算闭合多边形包围盒与主轴方向（供羊毫渐层刷染与扫刷动画使用）
    function getPolygonGeometry(pts) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      let cx = 0, cy = 0;
      for (let i = 0; i < pts.length; i++) {
        const x = pts[i][0], y = pts[i][1];
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        cx += x;
        cy += y;
      }
      cx /= Math.max(1, pts.length);
      cy /= Math.max(1, pts.length);

      // 主轴估计（找离中心最远点确立刷笔主导走向）
      let farPt = pts[0] || [cx, cy];
      let maxD2 = -1;
      for (let i = 0; i < pts.length; i++) {
        const d2 = (pts[i][0] - cx) ** 2 + (pts[i][1] - cy) ** 2;
        if (d2 > maxD2) {
          maxD2 = d2;
          farPt = pts[i];
        }
      }
      const dx = farPt[0] - cx;
      const dy = farPt[1] - cy;
      const axisAng = Math.atan2(dy, dx);
      return {
        minX, minY, maxX, maxY,
        w: Math.max(1, maxX - minX),
        h: Math.max(1, maxY - minY),
        cx, cy,
        axisAng,
        radius: Math.max(8, Math.sqrt(maxD2))
      };
    }

    function drawMineralFillPolygon(targetCtx, smoothedPts, opts, tFrac) {
      if (smoothedPts.length < 3 || tFrac <= 0.01) return;
      const geom = getPolygonGeometry(smoothedPts);
      const seed = opts.seed || 7;
      const easeAlpha = opts.alpha * clamp(Math.pow(tFrac, 0.72), 0, 1);
      const rgb = hexToRgb(opts.color);

      targetCtx.save();
      targetCtx.globalCompositeOperation = opts.blend || 'multiply';

      // 手绘微颤闭合边缘路径
      const tracePolygon = () => {
        targetCtx.beginPath();
        for (let i = 0; i < smoothedPts.length; i++) {
          const p = smoothedPts[i];
          const jx = 0.45 * Math.sin(seed * 3.1 + i * 0.75);
          const jy = 0.45 * Math.cos(seed * 2.3 + i * 0.85);
          if (i === 0) targetCtx.moveTo(p[0] + jx, p[1] + jy);
          else targetCtx.lineTo(p[0] + jx, p[1] + jy);
        }
        targetCtx.closePath();
      };

      // 裁切入色块轮廓内，施以羊毫刷染与矿粉沉淀质感
      tracePolygon();
      targetCtx.clip();

      // 动画扫刷渐进蒙版（tFrac < 1 时模拟扁头羊毫从一端扫涂上色）
      if (tFrac < 0.999) {
        const cosA = Math.cos(geom.axisAng);
        const sinA = Math.sin(geom.axisAng);
        const sweepSpan = geom.radius * 2.25;
        const progX = -geom.radius * 1.15 + sweepSpan * clamp(tFrac, 0, 1);
        targetCtx.save();
        targetCtx.translate(geom.cx, geom.cy);
        targetCtx.rotate(geom.axisAng);
        targetCtx.beginPath();
        targetCtx.rect(-geom.radius * 1.3, -geom.radius * 1.3, (progX + geom.radius * 1.3), geom.radius * 2.6);
        targetCtx.restore();
        targetCtx.clip();
        void cosA; void sinA;
      }

      // 1) 方向性水墨矿彩渐变铺底（入笔略浓，行笔透亮匀净）
      const gx0 = geom.cx - Math.cos(geom.axisAng) * geom.radius * 0.88;
      const gy0 = geom.cy - Math.sin(geom.axisAng) * geom.radius * 0.88;
      const gx1 = geom.cx + Math.cos(geom.axisAng) * geom.radius * 0.88;
      const gy1 = geom.cy + Math.sin(geom.axisAng) * geom.radius * 0.88;
      const washGrad = targetCtx.createLinearGradient(gx0, gy0, gx1, gy1);
      washGrad.addColorStop(0, rgbaStr(rgb, easeAlpha * 0.92));
      washGrad.addColorStop(0.55, rgbaStr(rgb, easeAlpha * 0.82));
      washGrad.addColorStop(1, rgbaStr(rgb, easeAlpha * 0.72));
      targetCtx.fillStyle = washGrad;
      targetCtx.fillRect(geom.minX - 6, geom.minY - 6, geom.w + 12, geom.h + 12);

      // 2) 叠扫 6 道半透明羊毫宽刷痕（呈现手工设色排刷笔意）
      const sweepCount = 6;
      targetCtx.save();
      targetCtx.translate(geom.cx, geom.cy);
      targetCtx.rotate(geom.axisAng);
      for (let s = 0; s < sweepCount; s++) {
        const frac = (s / (sweepCount - 1)) - 0.5;
        const offsetPerp = frac * Math.min(geom.w, geom.h) * 0.72;
        const swWidth = Math.max(8, Math.min(geom.w, geom.h) * (0.28 + 0.14 * Math.sin(seed + s * 2.1)));
        targetCtx.globalAlpha = easeAlpha * (0.09 + 0.06 * ((s + 1) % 2));
        targetCtx.strokeStyle = opts.color;
        targetCtx.lineWidth = swWidth;
        targetCtx.lineCap = 'round';
        targetCtx.beginPath();
        targetCtx.moveTo(-geom.radius * 1.15, offsetPerp + 3 * Math.sin(seed + s));
        targetCtx.quadraticCurveTo(0, offsetPerp - 5 * Math.cos(seed + s), geom.radius * 1.15, offsetPerp + 4 * Math.sin(seed + s * 1.7));
        targetCtx.stroke();
      }
      targetCtx.restore();

      // 3) 矿物颜料纸纹粒子沉淀叠加
      const grainCanvas = getMineralGrainCanvas();
      const pat = targetCtx.createPattern(grainCanvas, 'repeat');
      if (pat) {
        targetCtx.save();
        targetCtx.globalCompositeOperation = 'multiply';
        targetCtx.globalAlpha = clamp(easeAlpha * 0.24, 0, 0.35);
        targetCtx.fillStyle = pat;
        targetCtx.fillRect(geom.minX - 4, geom.minY - 4, geom.w + 8, geom.h + 8);
        targetCtx.restore();
      }

      // 4) 湿画水渍聚边（边缘微微浓聚，真实还原水墨矿彩干后水线）
      tracePolygon();
      targetCtx.globalAlpha = easeAlpha * 0.24;
      targetCtx.strokeStyle = opts.color;
      targetCtx.lineWidth = (opts.feather || 1.8) + 1.1;
      targetCtx.lineJoin = 'round';
      targetCtx.stroke();

      targetCtx.restore();
    }

    function drawRadialWash(targetCtx, cx, cy, rx, ry, rot, color, alpha, blend, tFrac) {
      if (tFrac <= 0.01) return;
      const scaleT = 0.65 + 0.35 * clamp(tFrac, 0, 1);
      targetCtx.save();
      targetCtx.globalCompositeOperation = blend || 'multiply';
      targetCtx.globalAlpha = alpha * clamp(tFrac, 0, 1);
      targetCtx.translate(cx, cy);
      if (rot) targetCtx.rotate(rot);
      targetCtx.scale(rx * scaleT, ry * scaleT);
      const grad = targetCtx.createRadialGradient(0, 0, 0.08, 0, 0, 1.0);
      grad.addColorStop(0, color);
      grad.addColorStop(0.55, color);
      grad.addColorStop(1, 'rgba(246, 238, 224, 0)');
      targetCtx.fillStyle = grad;
      targetCtx.beginPath();
      targetCtx.arc(0, 0, 1.0, 0, Math.PI * 2);
      targetCtx.fill();
      targetCtx.restore();
    }

    function drawFeatherRibbonWash(targetCtx, pts, cum, totalLen, opts, tFrac) {
      if (pts.length < 2 || tFrac <= 0.01) return;
      const { pts: sliced, cum: sCum } = sliceCurveByFraction(pts, cum, totalLen, tFrac);
      if (sliced.length < 2) return;
      const maxW = opts.width || 24;
      const baseAlpha = opts.alpha || 0.32;
      const steps = 3;
      // 三层同心柔边叠染，模拟水笔退晕“凹凸法”
      for (let k = steps; k >= 1; k--) {
        const wFactor = (k / steps);
        const subAlpha = (baseAlpha / steps) * 1.35 * (1.25 - 0.2 * wFactor);
        drawCalligraphicPath(targetCtx, sliced, sCum, totalLen, {
          color: opts.color,
          width: maxW * wFactor,
          style: 'soft',
          alpha: subAlpha,
          blend: opts.blend || 'multiply',
          seed: opts.seed || 1
        }, tFrac);
      }
    }

    function drawCalligraphicDot(targetCtx, x, y, rx, ry, rot, opts, tFrac) {
      if (tFrac <= 0.01) return;
      const s = 0.5 + 0.5 * clamp(tFrac, 0, 1);
      targetCtx.save();
      targetCtx.globalCompositeOperation = opts.blend || 'source-over';
      targetCtx.globalAlpha = (opts.alpha !== undefined ? opts.alpha : 0.92) * clamp(tFrac, 0, 1);
      targetCtx.fillStyle = opts.color;
      targetCtx.beginPath();
      targetCtx.ellipse(x, y, rx * s, (ry || rx) * s, rot || 0, 0, Math.PI * 2);
      targetCtx.fill();
      targetCtx.restore();
    }

    function executeStrokeAction(targetCtx, stroke, tFrac = 1) {
      if (stroke.type === 'line') {
        const sliced = sliceCurveByFraction(stroke.curve, stroke.cum, stroke.totalLen, tFrac);
        drawCalligraphicPath(targetCtx, sliced.pts, sliced.cum, stroke.totalLen, stroke, tFrac);
      } else if (stroke.type === 'fill') {
        drawMineralFillPolygon(targetCtx, stroke.curve, stroke, tFrac);
      } else if (stroke.type === 'wash') {
        drawRadialWash(
          targetCtx, stroke.x, stroke.y, stroke.rx, stroke.ry,
          stroke.rot || 0, stroke.color, stroke.alpha, stroke.blend, tFrac
        );
      } else if (stroke.type === 'shade') {
        drawFeatherRibbonWash(targetCtx, stroke.curve, stroke.cum, stroke.totalLen, stroke, tFrac);
      } else if (stroke.type === 'dot') {
        drawCalligraphicDot(
          targetCtx, stroke.x, stroke.y, stroke.rx, stroke.ry, stroke.rot, stroke, tFrac
        );
      }
    }

    // =========================================================================
    // 3. 莫高窟第 285 窟箜篌飞天 · 传统百笔法度队列构建
    // =========================================================================
    function buildTraditionalFeitianQueue() {
      strokeQueue = [];
      let autoSeed = 1;
      const P = CONFIG.PALETTE;
      const speedMul = CONFIG.SPEED_LEVELS[speedIndex].rate;

      function addLine(layer, label, pts, {
        color = P.INK_LINE,
        width = 2.1,
        style = 'yousi',
        alpha = 0.90,
        blend = 'source-over',
        samples = 14,
        closed = false
      } = {}) {
        const curve = catmullRomSpline(pts, samples, closed);
        if (closed && curve.length > 0) curve.push(curve[0]);
        const { cum, total } = computeCurveLengths(curve);
        const durFrames = clamp(Math.round(total / 22), 5, 24);
        strokeQueue.push({
          layer,
          type: 'line',
          label,
          curve,
          cum,
          totalLen: total,
          color,
          width,
          style,
          alpha,
          blend,
          seed: (autoSeed++) * 1.37,
          durFrames
        });
      }

      function addFill(layer, label, pts, {
        color,
        alpha = 0.88,
        blend = 'multiply',
        feather = 1.8,
        samples = 12,
        closed = true
      }) {
        const curve = catmullRomSpline(pts, samples, closed);
        strokeQueue.push({
          layer,
          type: 'fill',
          label,
          curve,
          color,
          alpha,
          blend,
          feather,
          seed: (autoSeed++) * 1.91,
          durFrames: 10
        });
      }

      function addWash(layer, label, x, y, rx, ry, {
        color,
        alpha = 0.45,
        blend = 'multiply',
        rot = 0
      }) {
        strokeQueue.push({
          layer,
          type: 'wash',
          label,
          x, y, rx, ry, rot,
          color,
          alpha,
          blend,
          durFrames: 9
        });
      }

      function addShade(layer, label, pts, {
        color,
        width = 24,
        alpha = 0.36,
        blend = 'multiply',
        samples = 12
      }) {
        const curve = catmullRomSpline(pts, samples, false);
        const { cum, total } = computeCurveLengths(curve);
        strokeQueue.push({
          layer,
          type: 'shade',
          label,
          curve,
          cum,
          totalLen: total,
          color,
          width,
          alpha,
          blend,
          seed: (autoSeed++) * 1.13,
          durFrames: clamp(Math.round(total / 34), 6, 16)
        });
      }

      function addDot(layer, label, x, y, rx, {
        ry = rx,
        rot = 0,
        color,
        alpha = 0.92,
        blend = 'source-over'
      }) {
        strokeQueue.push({

      // 记录每层结束索引
      layerEndIndices = [0, 0, 0, 0, 0, 0];
      for (let i = 0; i < strokeQueue.length; i++) {
        layerEndIndices[strokeQueue[i].layer] = i + 1;
      }
      for (let l = 1; l <= 5; l++) {
        if (layerEndIndices[l] === 0) layerEndIndices[l] = layerEndIndices[l - 1];
      }
      void speedMul;
    }

    // =========================================================================
    // 4. 逐笔播放、拖拽定位与单笔步进控制
    // =========================================================================
    function getActiveLayerAt(count) {
      if (count <= 0) return 1;
      const idx = clamp(count - 1, 0, Math.max(0, strokeQueue.length - 1));
      return strokeQueue[idx] ? strokeQueue[idx].layer : 1;
    }

    function updateStatusUI(done = false) {
      const total = strokeQueue.length;
      const isIdleBetweenStrokes = activeT <= 0.001 && completedCount > 0 && completedCount < total;

      if (completedCount === 0 && activeT <= 0.001) {
        layerStatusEl.textContent = '新白粉壁面就绪（等待起笔开脸）';
      } else if (done || (total > 0 && completedCount >= total)) {
        layerStatusEl.textContent = `敦煌飞天百笔工笔版绘制完成（共 ${total} 笔）`;
      } else {
        const displayIdx = isIdleBetweenStrokes ? completedCount - 1 : clamp(completedCount, 0, total - 1);
        const curStroke = strokeQueue[displayIdx];
        const lName = CONFIG.LAYER_NAMES[curStroke.layer] || '';
        layerStatusEl.textContent = `${lName} ｜ ${curStroke.label}`;
      }

      const shownCount = clamp(completedCount, 0, total);
      strokeStatusEl.textContent = `${shownCount} / ${total} 笔`;

      progressSlider.max = String(total);
      progressSlider.value = String(shownCount);
      const pct = total > 0 ? (shownCount / total) * 100 : 0;
      progressSlider.style.setProperty('--pct', `${pct.toFixed(2)}%`);
      progressPercentEl.textContent = `${pct.toFixed(1)}%`;

      const curLayer = shownCount >= total && total > 0
        ? 5
        : (isIdleBetweenStrokes
          ? getActiveLayerAt(shownCount)
          : getActiveLayerAt(Math.min(shownCount + 1, total)));
      layerChips.forEach((chip) => {
        const l = Number(chip.dataset.layer);
        const prevEnd = layerEndIndices[l - 1] || 0;
        const thisEnd = layerEndIndices[l] || 0;
        const isDone = total > 0 && shownCount >= thisEnd && thisEnd > prevEnd;
        const isCurrent = !done && shownCount > 0 && shownCount < total && l === curLayer;
        chip.classList.toggle('done', isDone && !isCurrent);
        chip.classList.toggle('current', isCurrent);
      });
    }

    function rebuildCanvasToCount(targetCount) {
      const total = strokeQueue.length;
      const clamped = clamp(Math.round(targetCount), 0, total);
      completedCount = clamped;
      activeT = 0;

      baseCtx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      baseCtx.drawImage(wallCanvas, 0, 0);
      for (let i = 0; i < completedCount; i++) {
        executeStrokeAction(baseCtx, strokeQueue[i], 1);
      }

      ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      ctx.drawImage(baseCanvas, 0, 0);
      updateStatusUI(completedCount >= total && total > 0);
    }

    function seekToStroke(targetCount) {
      rebuildCanvasToCount(targetCount);
      if (completedCount >= strokeQueue.length && strokeQueue.length > 0) {
        playPauseBtn.textContent = '重播';
      } else if (isPaused) {
        playPauseBtn.textContent = '继续';
      }
    }

    function pausePlayback() {
      if (animFrameId !== null) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      isPaused = true;
      playPauseBtn.textContent = completedCount >= strokeQueue.length ? '重播' : '继续';
    }

    function resumePlayback() {
      if (completedCount >= strokeQueue.length) {
        seekToStroke(0);
      }
      isPaused = false;
      playPauseBtn.textContent = '暂停';
      if (animFrameId === null) {
        animFrameId = requestAnimationFrame(renderLoop);
      }
    }

    function renderLoop() {
      if (isPaused) {
        animFrameId = null;
        return;
      }

      const total = strokeQueue.length;
      if (completedCount >= total) {
        animFrameId = null;
        isPaused = true;
        playPauseBtn.textContent = '重播';
        updateStatusUI(true);
        return;
      }

      const rate = CONFIG.SPEED_LEVELS[speedIndex].rate;
      let budget = rate;

      // 在高倍速下可能一帧跨越数笔；1x 速度时一笔分多帧顺滑运笔展开
      while (budget > 0 && completedCount < total) {
        const stroke = strokeQueue[completedCount];
        const stepT = 1 / Math.max(2, stroke.durFrames);
        const nextT = activeT + stepT * budget;
        if (nextT >= 1) {
          const used = (1 - activeT) / stepT;
          budget -= used;
          executeStrokeAction(baseCtx, stroke, 1);
          completedCount++;
          activeT = 0;
        } else {
          activeT = nextT;
          budget = 0;
        }
      }

      ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      ctx.drawImage(baseCanvas, 0, 0);
      if (completedCount < total && activeT > 0) {
        executeStrokeAction(ctx, strokeQueue[completedCount], activeT);
      }

      if (completedCount >= total) {
        animFrameId = null;
        isPaused = true;
        playPauseBtn.textContent = '重播';
        updateStatusUI(true);
      } else {
        updateStatusUI(false);
        animFrameId = requestAnimationFrame(renderLoop);
      }
    }

    function downloadCanvasPNG() {
      try {
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
        link.download = `敦煌飞天百笔工笔版_${stamp}.png`;
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.warn('下载 PNG 失败：', err);
      }
    }

    function startPainting() {
      if (animFrameId !== null) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      if (seekRafId !== null) {
        cancelAnimationFrame(seekRafId);
        seekRafId = null;
      }

      isPaused = false;
      completedCount = 0;
      activeT = 0;
      playPauseBtn.textContent = '暂停';

      wallCanvas = buildFreshChalkWall();
      if (!baseCanvas) {
        baseCanvas = document.createElement('canvas');
        baseCanvas.width = CONFIG.CANVAS_WIDTH;
        baseCanvas.height = CONFIG.CANVAS_HEIGHT;
        baseCtx = baseCanvas.getContext('2d');
      }
      baseCtx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      baseCtx.drawImage(wallCanvas, 0, 0);

      ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      ctx.drawImage(baseCanvas, 0, 0);

      buildTraditionalFeitianQueue();
      updateStatusUI(false);
      animFrameId = requestAnimationFrame(renderLoop);
    }

    // 交互绑定
    progressSlider.addEventListener('input', () => {
      pausePlayback();
      pendingSeek = Number(progressSlider.value);
      if (seekRafId === null) {
        seekRafId = requestAnimationFrame(() => {
          seekRafId = null;
          if (pendingSeek !== null) {
            const v = pendingSeek;
            pendingSeek = null;
            seekToStroke(v);
          }
        });
      }
    });

    layerChips.forEach((chip) => {
      chip.addEventListener('click', () => {
        const l = Number(chip.dataset.layer);
        pausePlayback();
        seekToStroke(layerEndIndices[l] || 0);
      });
    });

    playPauseBtn.addEventListener('click', () => {
      if (isPaused) resumePlayback();
      else pausePlayback();
    });

    stepBackBtn.addEventListener('click', () => {
      pausePlayback();
      seekToStroke(completedCount - CONFIG.STEP_DELTA);
    });

    stepForwardBtn.addEventListener('click', () => {
      pausePlayback();
      seekToStroke(completedCount + CONFIG.STEP_DELTA);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        pausePlayback();
        seekToStroke(completedCount - (e.shiftKey ? 10 : 1));
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        pausePlayback();
        seekToStroke(completedCount + (e.shiftKey ? 10 : 1));
      } else if (e.code === 'Space' && document.activeElement?.tagName !== 'BUTTON') {
        e.preventDefault();
        if (isPaused) resumePlayback();
        else pausePlayback();
      }
    });

    redrawBtn.addEventListener('click', () => {
      startPainting();
    });

    speedBtn.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % CONFIG.SPEED_LEVELS.length;
      const level = CONFIG.SPEED_LEVELS[speedIndex];
      speedBtn.textContent = level.label;
      speedBtn.classList.toggle('active', speedIndex > 0);
    });

    downloadBtn.addEventListener('click', () => {
      downloadCanvasPNG();
    });

    startPainting();
  </script>

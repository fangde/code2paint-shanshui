<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>敦煌飞天 · 水墨写意临摹版（285窟盛彩百笔 · Canvas 2D）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #26211c;
      background-image: radial-gradient(circle at 50% 42%, #3a3128 0%, #1e1915 100%);
      color: #f0e4ce;

      user-select: none;

    .mural-frame {
      background: #47392b;
      padding: 14px;
      border: 1px solid #765f47;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(247, 241, 227, 0.18);

    }

    .progress-panel {

      padding: 10px 12px;
      background: rgba(58, 46, 36, 0.78);

      display: flex;
      align-items: center;
      gap: 12px;

    #progressSlider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: linear-gradient(90deg, #c24b32 0%, #dfb05d var(--pct, 0%), #352a20 var(--pct, 0%));
      border: 1px solid #755e47;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    #progressSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f0cf88;
      border: 2px solid #4a3728;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    #progressSlider::-webkit-slider-thumb:hover {

    }

    #progressSlider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;

      border: 2px solid #4a3728;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);

    .progress-percent {

    }

    .layer-steps {

    }

    button {

    button:hover {

    button:active {

    button.small-btn {

<body>
  <div class="mural-frame">
    <canvas id="muralCanvas" width="1280" height="800"></canvas>
  </div>

  <div class="progress-panel">
    <div class="progress-row">
      <input id="progressSlider" type="range" min="0" max="0" value="0" step="1" aria-label="作画进度条" />
      <span id="progressPercent" class="progress-percent">0.0%</span>
    </div>
    <div class="layer-steps" id="layerSteps">
      <button class="layer-chip" type="button" data-layer="1">一层·白描勾线</button>
      <button class="layer-chip" type="button" data-layer="2">二层·水墨设色</button>
      <button class="layer-chip" type="button" data-layer="3">三层·凹凸晕染</button>
      <button class="layer-chip" type="button" data-layer="4">四层·开脸复勾</button>
      <button class="layer-chip" type="button" data-layer="5">五层·提白描金</button>
      <span class="hint-text">支持逐笔看：退一步 / 进一步 / ← → 单笔微调（Shift ±10 笔 · 空格暂停）</span>
    </div>
  </div>

  <div class="toolbar">
    <div class="status-group">
      <span id="layerStatus" class="status-layer">铺设生宣暖泥底…</span>
      <span id="strokeStatus" class="status-count">0 / 0 笔</span>
    </div>
    <div class="btn-group">
      <button id="playPauseBtn" class="small-btn" type="button">暂停</button>
      <button id="stepBackBtn" class="small-btn" type="button">退一步</button>
      <button id="stepForwardBtn" class="small-btn" type="button">进一步</button>
      <button id="redrawBtn" type="button">重新绘制</button>
      <button id="speedBtn" type="button">加速</button>
      <button id="downloadBtn" class="download-btn" type="button">下载 PNG</button>
      <a class="home-link" href="./index.html">← 回画廊首页</a>
    </div>
  </div>

  <script>
    // =========================================================================
    // 顶部常量、生宣暖壁基底、水墨毛笔动力学与第 285 窟矿彩色板配置
    // =========================================================================
    const CONFIG = {
      CANVAS_WIDTH: 1280,
      CANVAS_HEIGHT: 800,

      // 生宣/浅白粉壁底参数（取 285 窟明净暖底，含宣纸纤维肌理）
      PAPER: {
        BASE_COLOR: '#f1e8d4',
        EDGE_VIGNETTE: 'rgba(186, 170, 138, 0.22)',
        NOISE_INTENSITY: 6,
        FIBER_COUNT: 420,
        FIBER_ALPHA_MIN: 0.024,
        FIBER_ALPHA_MAX: 0.064
      },

      // 沿用《写意水墨山水》毛笔径向软边、生宣洇染与 5 毫枯笔飞白参数
      BRUSH: {
        SOFTNESS: 0.55,
        BLEED_SCALE: 1.55,
        BLEED_ALPHA_RATIO: 0.30,
        DRY_BRISTLES: 5,
        DRY_SKIP_BASE: 0.42,
        PRESSURE_JITTER: 0.14
      },

      // 莫高窟第 285 窟盛彩还原色板（水墨淡赭底蕴 + 饱和而不俗艳的原画矿彩）
      PALETTE: {
        INK_FACE:         '#6c503f', // 淡赭墨：开脸五官
        INK_LINE:         '#3d2e25', // 松烟古墨：衣纹飘带与发髻骨架
        INK_DARK:         '#1e1815', // 焦墨：点睛与关键顿挫复勾
        INK_CINNABAR:     '#c4462b', // 朱砂墨：腰带、唇缝与“3”字流云线
        SKIN_LIGHT:       '#efe4d6', // 温润粉白玉肌
        SKIN_BLUSH:       '#dd8a6e', // 桃花颊暖晕
        SKIN_SHADE:       '#c18d69', // 淡赭凹凸分染
        HAIR_INK:         '#25201e', // 乌墨发髻
        CROWN_GREEN:      '#286452', // 冠结石绿
        CROWN_RUSSET:     '#ba5132', // 冠饰飞翅朱赭
        GOLD_OCHRE:       '#cf9642', // 箜篌与项圈暖金赭
        GOLD_BRIGHT:      '#ecc058', // 泥金高光
        VERMILION:        '#c8462a', // 原画矿彩朱砂
        VERMILION_DEEP:   '#992b1a', // 重朱砂
        MALACHITE:        '#2f8264', // 原画矿绿石绿（雅致饱和）
        MALACHITE_DEEP:   '#1b5842', // 深石绿重染
        OCHRE_TERRACOTTA: '#c47e4c', // 原画裙腰/膝摆暖赭红彩
        LAPIS_BRIGHT:     '#0f8db2', // 285 窟招牌孔雀石青
        LAPIS_PALE:       '#70bad0', // 云蒂渐淡天青
        LAPIS_DEEP:       '#0c5b80', // 深石青凹凸
        ROSETTE_INK:      '#212926', // 宝相花三瓣黛墨核
        CLAM_WHITE:       '#fbf6ea'  // 蛤粉三白高光
      },

      SPEED_LEVELS: [
        { label: '加速',    rate: 1 },
        { label: '加速 ×2', rate: 2 },
        { label: '加速 ×4', rate: 4 },
        { label: '加速 ×8', rate: 8 }
      ],

      CHECKPOINT_INTERVAL: 20,
      STEP_DELTA: 1,

      LAYER_NAMES: [
        '',
        '一层·白描勾线',
        '二层·水墨设色',
        '三层·凹凸晕染',
        '四层·开脸复勾',
        '五层·提白描金'
      ]
    };

    const canvas = document.getElementById('muralCanvas');
    const ctx = canvas.getContext('2d');
    const layerStatusEl = document.getElementById('layerStatus');
    const strokeStatusEl = document.getElementById('strokeStatus');
    const progressSlider = document.getElementById('progressSlider');
    const progressPercentEl = document.getElementById('progressPercent');
    const layerChips = Array.from(document.querySelectorAll('.layer-chip'));
    const playPauseBtn = document.getElementById('playPauseBtn');
    const stepBackBtn = document.getElementById('stepBackBtn');
    const stepForwardBtn = document.getElementById('stepForwardBtn');
    const redrawBtn = document.getElementById('redrawBtn');
    const speedBtn = document.getElementById('speedBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let wallCanvas = null;
    let baseCanvas = null;
    let baseCtx = null;
    const checkpoints = new Map();

    let strokeQueue = [];
    let layerEndIndices = [0, 0, 0, 0, 0, 0];
    let completedCount = 0;
    let activeT = 0;
    let speedIndex = 0;
    let animFrameId = null;
    let isPaused = false;
    let pendingSeek = null;
    let seekRafId = null;
    let rng = Math.random;

    function clamp(v, min, max) {
      return v < min ? min : (v > max ? max : v);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function createPRNG(seed) {
      let s = seed >>> 0;
      return function () {
        s += 0x6D2B79F5;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hexToRgb(hex) {
      const clean = (hex || '#3d2e25').replace('#', '');
      const full = clean.length === 3
        ? clean[0] + clean[0] + clean[1] + clean[1] + clean[2] + clean[2]
        : clean;
      const n = parseInt(full, 16) || 0;
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function lerpRgb(rgbA, rgbB, t) {
      const k = clamp(t, 0, 1);
      return [
        Math.round(rgbA[0] + (rgbB[0] - rgbA[0]) * k),
        Math.round(rgbA[1] + (rgbB[1] - rgbA[1]) * k),
        Math.round(rgbA[2] + (rgbB[2] - rgbA[2]) * k)
      ];
    }

    // =========================================================================
    // 1. 生宣暖壁基底生成（移植自《写意水墨山水》buildXuanPaper）
    // =========================================================================
    function buildFreshChalkWall() {
      const off = document.createElement('canvas');
      off.width = CONFIG.CANVAS_WIDTH;
      off.height = CONFIG.CANVAS_HEIGHT;
      const octx = off.getContext('2d');
      const w = off.width;
      const h = off.height;
      const paperRand = createPRNG(28511);

      octx.fillStyle = CONFIG.PAPER.BASE_COLOR;
      octx.fillRect(0, 0, w, h);

      const vignette = octx.createRadialGradient(
        w * 0.54, h * 0.45, w * 0.22,
        w * 0.52, h * 0.50, w * 0.78
      );
      vignette.addColorStop(0, 'rgba(255, 251, 242, 0.22)');
      vignette.addColorStop(1, CONFIG.PAPER.EDGE_VIGNETTE);
      octx.fillStyle = vignette;
      octx.fillRect(0, 0, w, h);

      // 生宣颗粒肌理（温润明净，无裂纹黑斑）
      const imgData = octx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const amp = CONFIG.PAPER.NOISE_INTENSITY;
      for (let i = 0; i < data.length; i += 4) {
        const delta = (paperRand() - 0.5) * 2 * amp;
        data[i]     = clamp(data[i] + delta, 0, 255);
        data[i + 1] = clamp(data[i + 1] + delta * 0.96, 0, 255);
        data[i + 2] = clamp(data[i + 2] + delta * 0.88, 0, 255);
      }
      octx.putImageData(imgData, 0, 0);

      // 弯曲生宣纤维丝（420 根）
      octx.save();
      octx.lineCap = 'round';
      for (let i = 0; i < CONFIG.PAPER.FIBER_COUNT; i++) {
        const fx = paperRand() * w;
        const fy = paperRand() * h;
        const len = 8 + paperRand() * 26;
        const ang = (paperRand() - 0.5) * Math.PI * 2;
        const bend = (paperRand() - 0.5) * 11;
        const alpha = lerp(CONFIG.PAPER.FIBER_ALPHA_MIN, CONFIG.PAPER.FIBER_ALPHA_MAX, paperRand());
        const tone = paperRand() > 0.45 ? '156, 142, 118' : '255, 252, 245';

        octx.strokeStyle = `rgba(${tone}, ${alpha.toFixed(4)})`;
        octx.lineWidth = 0.4 + paperRand() * 0.7;
        octx.beginPath();
        octx.moveTo(fx, fy);
        octx.quadraticCurveTo(
          fx + Math.cos(ang) * len * 0.5 + bend,
          fy + Math.sin(ang) * len * 0.5 - bend,
          fx + Math.cos(ang) * len,
          fy + Math.sin(ang) * len
        );
        octx.stroke();
      }
      octx.restore();

      return off;
    }

    // =========================================================================
    // 2. 水墨毛笔渲染引擎（直接移植自 shuimo-shanshui.html 的软边渐变 + 洇染 + 5毫飞白）
    // =========================================================================
    function drawSoftRadialDab(targetCtx, x, y, radius, rgb, alpha, angle, aspect, softness) {
      if (radius <= 0.3 || alpha <= 0.002) return;
      targetCtx.save();
      targetCtx.translate(x, y);
      if (angle) targetCtx.rotate(angle);
      if (aspect && aspect !== 1) targetCtx.scale(aspect, 1);

      const grad = targetCtx.createRadialGradient(0, 0, 0, 0, 0, radius);
      const [r, g, b] = rgb;
      const midStop = clamp(softness, 0.15, 0.82);

      grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha.toFixed(4)})`);
      grad.addColorStop(midStop, `rgba(${r}, ${g}, ${b}, ${(alpha * 0.62).toFixed(4)})`);
      grad.addColorStop(lerp(midStop, 1, 0.55), `rgba(${r}, ${g}, ${b}, ${(alpha * 0.18).toFixed(4)})`);
      grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

      targetCtx.fillStyle = grad;
      targetCtx.beginPath();
      targetCtx.arc(0, 0, radius, 0, Math.PI * 2);
      targetCtx.fill();
      targetCtx.restore();
    }

    function executeInkDab(targetCtx, dab) {
      const rgb = dab.rgb;
      const alpha = clamp(dab.alpha, 0.004, 0.96);
      const radius = Math.max(0.55, dab.r);
      const angle = dab.angle || 0;
      const aspect = dab.aspect || 1;
      const bleed = dab.bleed || 0;
      const dryness = dab.dryness || 0;
      const softness = dab.softness ?? CONFIG.BRUSH.SOFTNESS;
      const blend = dab.blend || 'source-over';

      targetCtx.save();
      targetCtx.globalCompositeOperation = blend;

      // 生宣洇染外晕：先铺一层更宽、更虚的水墨晕边
      if (bleed > 0.02) {
        const bleedR = radius * (1 + (CONFIG.BRUSH.BLEED_SCALE - 1) * bleed);
        const bleedAlpha = alpha * CONFIG.BRUSH.BLEED_ALPHA_RATIO * bleed;
        drawSoftRadialDab(
          targetCtx,
          dab.x + (dab.bx || 0),
          dab.y + (dab.by || 0),
          bleedR,
          rgb,
          bleedAlpha,
          angle,
          aspect * 1.06,
          0.32
        );
      }

      // 枯笔飞白效果：5 股笔毫分叉并按确定性哈希留白，露出宣纸底色
      if (dryness > 0.15) {
        const bristles = CONFIG.BRUSH.DRY_BRISTLES;
        const perpX = -Math.sin(angle);
        const perpY = Math.cos(angle);
        const seedHash = Math.abs(Math.sin(dab.x * 12.9898 + dab.y * 78.233) * 43758.5453);

        for (let i = 0; i < bristles; i++) {
          const h = (seedHash * (i + 1.37)) % 1;
          if (h < dryness * (CONFIG.BRUSH.DRY_SKIP_BASE + 0.35)) continue;

          const offsetRatio = (i / (bristles - 1) - 0.5) * 1.45;
          const ox = perpX * radius * offsetRatio;
          const oy = perpY * radius * offsetRatio;
          const subR = Math.max(0.65, radius * (0.30 + 0.16 * (1 - Math.abs(offsetRatio))));
          const subAlpha = alpha * (0.55 + 0.45 * (1 - dryness * 0.45));

          drawSoftRadialDab(
            targetCtx,
            dab.x + ox,
            dab.y + oy,
            subR,
            rgb,
            subAlpha,
            angle,
            Math.max(1.25, aspect * 1.35),
            0.48
          );
        }
        targetCtx.restore();
        return;
      }

      // 常规湿润软边水墨笔触
      drawSoftRadialDab(targetCtx, dab.x, dab.y, radius, rgb, alpha, angle, aspect, softness);
      targetCtx.restore();
    }

    // -------------------------------------------------------------------------
    // 曲线插值、十八描粗细调制及几何点在多边形内判定工具
    // -------------------------------------------------------------------------
    function catmullRomSpline(points, samplesPerSeg = 12, closed = false) {
      if (!points || points.length < 2) return points ? points.slice() : [];
      const n = points.length;
      const out = [];
      const segCount = closed ? n : n - 1;

      const getPt = (idx) => {
        if (closed) return points[(idx + n) % n];
        if (idx < 0) return [points[0][0] * 2 - points[1][0], points[0][1] * 2 - points[1][1]];
        if (idx >= n) return [points[n - 1][0] * 2 - points[n - 2][0], points[n - 1][1] * 2 - points[n - 2][1]];
        return points[idx];
      };

      for (let i = 0; i < segCount; i++) {
        const p0 = getPt(i - 1);
        const p1 = getPt(i);
        const p2 = getPt(i + 1);
        const p3 = getPt(i + 2);
        for (let k = 0; k < samplesPerSeg; k++) {
          const t = k / samplesPerSeg;
          const t2 = t * t;
          const t3 = t2 * t;
          const x = 0.5 * (
            (2 * p1[0]) +
            (-p0[0] + p2[0]) * t +
            (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
            (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3
          );
          const y = 0.5 * (
            (2 * p1[1]) +
            (-p0[1] + p2[1]) * t +
            (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
            (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3
          );
          out.push([x, y]);
        }
      }
      if (!closed) {
        out.push([points[n - 1][0], points[n - 1][1]]);
      }
      return out;
    }

    function computeCurveLengths(pts) {
      const cum = [0];
      let total = 0;
      for (let i = 1; i < pts.length; i++) {
        total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        cum.push(total);
      }
      return { cum, total };
    }

    function brushProfileWidth(u, baseW, style, seed, bendFactor) {
      const wave = 1 + 0.08 * Math.sin(seed * 3.1 + u * 21.0);
      const turnPress = 1 + bendFactor * 0.34;
      if (style === 'yousi') {
        const entry = u < 0.07 ? (1.14 - 0.14 * (u / 0.07)) : 1.0;
        const tail = u > 0.88 ? Math.max(0.32, (1 - u) / 0.12) : 1.0;
        const cap = Math.min(1, u / 0.03);
        return baseW * (0.48 + 0.54 * cap) * entry * tail * (1 + bendFactor * 0.16);
      }
      if (style === 'tiexian') {
        const press = (u < 0.07 || u > 0.93) ? 1.20 : 1.02;
        const cap = Math.min(1, u / 0.025, (1 - u) / 0.025);
        return baseW * 1.08 * press * (0.42 + 0.58 * cap) * turnPress * wave;
      }
      if (style === 'lanye') {
        const belly = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.68);
        return baseW * 1.18 * (0.24 + 1.28 * belly) * turnPress * wave;
      }
      if (style === 'xingyun') {
        const env = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.42);
        const pulse = 0.74 + 0.38 * Math.sin(seed + u * Math.PI * 3.6);
        return baseW * 1.16 * (0.22 + 1.08 * env * pulse) * turnPress * wave;
      }
      if (style === 'dingtou') {
        if (u < 0.08) return baseW * 1.20 * (0.65 + 0.95 * Math.sin((u / 0.08) * Math.PI * 0.5));
        const tail = Math.pow(clamp((1 - u) / 0.92, 0, 1), 0.84);
        return baseW * 1.20 * (0.18 + 1.38 * tail) * turnPress * wave;
      }
      const env = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.55);
      return baseW * (0.35 + 0.85 * env);
    }

    function buildLineDabs(curve, cum, totalLen, opts) {
      const dabs = [];
      if (curve.length < 2 || totalLen < 0.5) return dabs;

      const rgb = hexToRgb(opts.color);
      const baseW = opts.width || 2.1;
      const style = opts.style || 'yousi';
      const seed = opts.seed || 1;
      const strokeAlpha = opts.alpha !== undefined ? opts.alpha : 0.90;
      const blend = opts.blend || 'source-over';

      const stylePreset = {
        yousi:   { spacing: 0.36, dabAlpha: 0.48, bleed: 0.24, dryness: 0.00, softness: 0.56, aspect: 1.18, jitter: 0.16 },
        tiexian: { spacing: 0.38, dabAlpha: 0.52, bleed: 0.35, dryness: 0.05, softness: 0.54, aspect: 1.24, jitter: 0.24 },
        lanye:   { spacing: 0.40, dabAlpha: 0.54, bleed: 0.48, dryness: 0.10, softness: 0.48, aspect: 1.32, jitter: 0.36 },
        xingyun: { spacing: 0.42, dabAlpha: 0.54, bleed: 0.52, dryness: 0.08, softness: 0.46, aspect: 1.36, jitter: 0.40 },
        dingtou: { spacing: 0.40, dabAlpha: 0.56, bleed: 0.55, dryness: 0.06, softness: 0.48, aspect: 1.34, jitter: 0.35 },
        soft:    { spacing: 0.42, dabAlpha: 0.38, bleed: 0.42, dryness: 0.00, softness: 0.36, aspect: 1.30, jitter: 0.65 }
      }[style] || { spacing: 0.40, dabAlpha: 0.50, bleed: 0.40, dryness: 0.08, softness: 0.50, aspect: 1.25, jitter: 0.30 };

      // 预计算各顶点切线与曲率转折顿挫
      const nodes = [];
      for (let i = 0; i < curve.length; i++) {
        const prev2 = curve[Math.max(0, i - 2)];
        const prev = curve[Math.max(0, i - 1)];
        const cur = curve[i];
        const next = curve[Math.min(curve.length - 1, i + 1)];
        const next2 = curve[Math.min(curve.length - 1, i + 2)];

        let tx = next[0] - prev[0], ty = next[1] - prev[1];
        const mag = Math.hypot(tx, ty) || 1;
        tx /= mag; ty /= mag;

        const vx1 = cur[0] - prev2[0], vy1 = cur[1] - prev2[1];
        const vx2 = next2[0] - cur[0], vy2 = next2[1] - cur[1];
        const m1 = Math.hypot(vx1, vy1) || 1, m2 = Math.hypot(vx2, vy2) || 1;
        const dot = clamp((vx1 * vx2 + vy1 * vy2) / (m1 * m2), -1, 1);
        const bend = clamp((1 - dot) * 0.9, 0, 1);

        const u = totalLen > 0 ? cum[i] / totalLen : 0;
        const w = brushProfileWidth(u, baseW, style, seed, bend);
        nodes.push({ x: cur[0], y: cur[1], s: cum[i], u, w, bend, ang: Math.atan2(ty, tx) });
      }

      let sCur = 0;
      for (let i = 0; i < nodes.length - 1; i++) {
        const a = nodes[i];
        const b = nodes[i + 1];
        const segLen = b.s - a.s;
        if (segLen <= 0.04) continue;

        while (sCur <= b.s + 1e-4) {
          const frac = clamp((sCur - a.s) / segLen, 0, 1);
          const x = lerp(a.x, b.x, frac);
          const y = lerp(a.y, b.y, frac);
          const u = lerp(a.u, b.u, frac);
          const w = lerp(a.w, b.w, frac);
          const bend = lerp(a.bend, b.bend, frac);

          const r = Math.max(0.75, w * 0.72);
          const pressure = clamp(1 + (rng() - 0.5) * 2 * CONFIG.BRUSH.PRESSURE_JITTER + bend * 0.18, 0.72, 1.32);
          const inkDepletion = totalLen > 105 ? (1 - u * 0.24) : 1.0;

          // 长线条尾端增加枯笔飞白，发丝开脸保持润泽不断裂
          let localDry = stylePreset.dryness;
          if ((style === 'lanye' || style === 'xingyun' || style === 'dingtou') && totalLen > 100 && u > 0.56) {
            localDry = clamp(stylePreset.dryness + ((u - 0.56) / 0.44) * 0.48, 0, 0.62);
          }

          dabs.push({
            x: x + (rng() - 0.5) * stylePreset.jitter,
            y: y + (rng() - 0.5) * stylePreset.jitter,
            r: r * (0.85 + 0.15 * pressure),
            rgb,
            alpha: clamp(strokeAlpha * stylePreset.dabAlpha * inkDepletion * (0.9 + 0.1 * pressure), 0.04, 0.92),
            angle: a.ang,
            aspect: stylePreset.aspect,
            bleed: stylePreset.bleed,
            dryness: localDry,
            softness: stylePreset.softness,
            bx: (rng() - 0.5) * r * 0.42,
            by: (rng() - 0.5) * r * 0.42,
            blend
          });

          const step = Math.max(1.15, r * stylePreset.spacing);
          sCur += step;
        }
      }
      return dabs;
    }

    function pointInPolygon(x, y, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1];
        const xj = poly[j][0], yj = poly[j][1];
        const intersect = ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function distToPolygonEdge(x, y, poly) {
      let minD2 = Infinity;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const ax = poly[j][0], ay = poly[j][1];
        const bx = poly[i][0], by = poly[i][1];
        const dx = bx - ax, dy = by - ay;
        const len2 = dx * dx + dy * dy;
        const t = len2 > 1e-6 ? clamp(((x - ax) * dx + (y - ay) * dy) / len2, 0, 1) : 0;
        const px = ax + t * dx, py = ay + t * dy;
        const d2 = (x - px) * (x - px) + (y - py) * (y - py);
        if (d2 < minD2) minD2 = d2;
      }
      return Math.sqrt(minD2);
    }

    function buildWashDabsForPolygon(curve, opts) {
      const dabs = [];
      if (!curve || curve.length < 3) return dabs;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      let cx = 0, cy = 0, signedArea = 0;
      for (let i = 0; i < curve.length; i++) {
        const p0 = curve[i];
        const p1 = curve[(i + 1) % curve.length];
        if (p0[0] < minX) minX = p0[0];
        if (p0[0] > maxX) maxX = p0[0];
        if (p0[1] < minY) minY = p0[1];
        if (p0[1] > maxY) maxY = p0[1];
        cx += p0[0]; cy += p0[1];
        signedArea += p0[0] * p1[1] - p1[0] * p0[1];
      }
      cx /= curve.length;
      cy /= curve.length;
      const area = Math.max(100, Math.abs(signedArea) * 0.5);

      let farPt = curve[0], maxD2 = -1;
      for (let i = 0; i < curve.length; i++) {
        const d2 = (curve[i][0] - cx) ** 2 + (curve[i][1] - cy) ** 2;
        if (d2 > maxD2) { maxD2 = d2; farPt = curve[i]; }
      }
      const axisAng = opts.axisAngle !== undefined ? opts.axisAngle : Math.atan2(farPt[1] - cy, farPt[0] - cx);
      const cosA = Math.cos(axisAng), sinA = Math.sin(axisAng);
      const radBound = Math.max(16, Math.sqrt(maxD2) + 8);

      const isOpaque = (opts.blend === 'source-over');
      const maxR = opts.dabRadius || clamp(Math.sqrt(area) * 0.115, 7.5, 22);
      const step = clamp(isOpaque ? maxR * 0.42 : maxR * 0.48, 3.6, 10.5);

      const rgbA = hexToRgb(opts.color);
      const rgbB = opts.color2 ? hexToRgb(opts.color2) : rgbA;
      const baseDabAlpha = isOpaque
        ? clamp(opts.alpha * 0.58, 0.30, 0.64)
        : clamp(opts.alpha * 0.38, 0.16, 0.46);

      // 投影范围用于渐变双色插值（如云蒂由浓石青向浅天青退晕）
      let minProj = Infinity, maxProj = -Infinity;
      for (let i = 0; i < curve.length; i++) {
        const p = (curve[i][0] - cx) * cosA + (curve[i][1] - cy) * sinA;
        if (p < minProj) minProj = p;
        if (p > maxProj) maxProj = p;
      }
      const projSpan = Math.max(1, maxProj - minProj);

      // 1) 主轴旋转均匀水墨网格采样
      for (let u = -radBound; u <= radBound; u += step) {
        for (let v = -radBound; v <= radBound; v += step) {
          const ju = u + (rng() - 0.5) * step * 0.40;
          const jv = v + (rng() - 0.5) * step * 0.40;
          const x = cx + cosA * ju - sinA * jv;
          const y = cy + sinA * ju + cosA * jv;
          if (x < minX - 2 || x > maxX + 2 || y < minY - 2 || y > maxY + 2) continue;
          if (!pointInPolygon(x, y, curve)) continue;

          const dEdge = distToPolygonEdge(x, y, curve);
          const r = clamp(Math.min(maxR, dEdge * 1.18), 2.8, maxR);
          const projT = clamp(((x - cx) * cosA + (y - cy) * sinA - minProj) / projSpan, 0, 1);
          const col = opts.color2 ? lerpRgb(rgbA, rgbB, projT) : rgbA;
          const dryBias = (!isOpaque && dEdge < maxR * 0.5) ? 0.08 : 0;

          dabs.push({
            x, y, r,
            proj: ju,
            rgb: col,
            alpha: baseDabAlpha * (0.86 + 0.24 * rng()) * (opts.fadeTail ? (1 - 0.38 * projT) : 1),
            angle: axisAng + (rng() - 0.5) * 0.25,
            aspect: 1.32,
            bleed: isOpaque ? 0.22 : 0.38,
            dryness: dryBias,
            softness: isOpaque ? 0.48 : 0.42,
            bx: (rng() - 0.5) * r * 0.32,
            by: (rng() - 0.5) * r * 0.32,
            blend: opts.blend || 'multiply'
          });
        }
      }

      // 2) 窄细尖角补充采样（沿着多边形边缘略向内移，确保窄飘带与指尖绝不漏色）
      const perimStep = Math.max(3.5, step * 0.9);
      const areaSign = signedArea >= 0 ? 1 : -1;
      for (let i = 0; i < curve.length; i++) {
        const p0 = curve[i];
        const p1 = curve[(i + 1) % curve.length];
        const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
        const len = Math.hypot(dx, dy);
        if (len < 1) continue;
        // 指向多边形内部的法向（CW/CCW 自适应）
        const nx = (dy / len) * areaSign;
        const ny = (-dx / len) * areaSign;
        const steps = Math.max(1, Math.ceil(len / perimStep));
        for (let k = 0; k < steps; k++) {
          const frac = (k + 0.5) / steps;
          const bx = lerp(p0[0], p1[0], frac);
          const by = lerp(p0[1], p1[1], frac);
          for (const distIn of [1.8, 3.8, 6.2]) {
            const tx = bx + nx * distIn;
            const ty = by + ny * distIn;
            if (!pointInPolygon(tx, ty, curve)) continue;
            const dEdge = distToPolygonEdge(tx, ty, curve);
            if (dEdge < 1.8) continue;
            const r = clamp(Math.min(maxR * 0.72, dEdge * 1.15), 2.5, maxR * 0.72);
            const ju = (tx - cx) * cosA + (ty - cy) * sinA;
            const projT = clamp((ju - minProj) / projSpan, 0, 1);
            const col = opts.color2 ? lerpRgb(rgbA, rgbB, projT) : rgbA;
            dabs.push({
              x: tx, y: ty, r,
              proj: ju,
              rgb: col,
              alpha: baseDabAlpha * 0.78 * (opts.fadeTail ? (1 - 0.38 * projT) : 1),
              angle: Math.atan2(dy, dx),
              aspect: 1.28,
              bleed: isOpaque ? 0.16 : 0.30,
              dryness: 0,
              softness: 0.45,
              bx: 0, by: 0,
              blend: opts.blend || 'multiply'
            });
            break;
          }
        }
      }

      // 按羊毫从一端扫刷至另一端的顺次排序，播放时呈现出平扫晕染过程
      dabs.sort((a, b) => a.proj - b.proj);
      return dabs;
    }

    function executeStrokeAction(targetCtx, stroke, tFrac = 1) {
      if (tFrac <= 0.001 || !stroke.dabs || stroke.dabs.length === 0) return;
      const totalDabs = stroke.dabs.length;
      const limit = tFrac >= 0.9999 ? totalDabs : Math.max(1, Math.ceil(totalDabs * clamp(tFrac, 0, 1)));
      for (let i = 0; i < limit; i++) {
        executeInkDab(targetCtx, stroke.dabs[i]);
      }
    }

    // =========================================================================
    // 3. 莫高窟第 285 窟箜篌飞天 · 接近原画的水墨白描工笔队列
    // =========================================================================
    function buildTraditionalFeitianQueue() {
      strokeQueue = [];
      rng = createPRNG(2852026);
      let autoSeed = 1;
      const P = CONFIG.PALETTE;

      function addLine(layer, label, pts, {
        color = P.INK_LINE,
        width = 2.1,
        style = 'yousi',
        alpha = 0.90,
        blend = 'source-over',
        samples = 12,
        closed = false
      } = {}) {
        const curve = catmullRomSpline(pts, samples, closed);
        if (closed && curve.length > 0) curve.push(curve[0]);
        const { cum, total } = computeCurveLengths(curve);
        const seed = (autoSeed++) * 1.37;
        const dabs = buildLineDabs(curve, cum, total, { color, width, style, alpha, blend, seed });
        const durFrames = clamp(Math.round(total / 24), 5, 22);
        strokeQueue.push({ layer, type: 'line', label, dabs, durFrames });
      }

      function addFill(layer, label, pts, {
        color,
        color2 = null,
        fadeTail = false,
        alpha = 0.88,
        blend = 'multiply',
        dabRadius = null,
        axisAngle = undefined,
        samples = 6,
        closed = true
      }) {
        const curve = catmullRomSpline(pts, samples, closed);
        const dabs = buildWashDabsForPolygon(curve, {
          color, color2, fadeTail, alpha, blend, dabRadius, axisAngle
        });
        const durFrames = clamp(Math.round(dabs.length / 10), 7, 16);
        strokeQueue.push({ layer, type: 'fill', label, dabs, durFrames });
      }

      function addWash(layer, label, x, y, rx, ry, {
        color,
        alpha = 0.42,
        blend = 'multiply',
        rot = 0
      }) {
        const rgb = hexToRgb(color);
        const aspect = clamp(rx / Math.max(1, ry), 0.4, 2.8);
        const r = Math.max(rx, ry);
        const dabs = [
          { x, y, r: r * 1.05, rgb, alpha: alpha * 0.72, angle: rot, aspect, bleed: 0.45, dryness: 0, softness: 0.34, bx: 0, by: 0, blend },
          { x: x + (rng() - 0.5) * 3, y: y + (rng() - 0.5) * 3, r: r * 0.72, rgb, alpha: alpha * 0.55, angle: rot, aspect, bleed: 0.25, dryness: 0, softness: 0.48, bx: 0, by: 0, blend }
        ];
        strokeQueue.push({ layer, type: 'wash', label, dabs, durFrames: 8 });
      }

      function addShade(layer, label, pts, {
        color,
        width = 24,
        alpha = 0.36,
        blend = 'multiply',
        samples = 10
      }) {
        const curve = catmullRomSpline(pts, samples, false);
        const { cum, total } = computeCurveLengths(curve);
        const seed = (autoSeed++) * 1.13;
        const dabs = buildLineDabs(curve, cum, total, {
          color, width, style: 'soft', alpha, blend, seed
        });
        strokeQueue.push({
          layer, type: 'shade', label, dabs,
          durFrames: clamp(Math.round(total / 34), 6, 15)
        });
      }

      function addDot(layer, label, x, y, rx, {
        ry = rx,
        rot = 0,
        color,
        alpha = 0.92,
        blend = 'source-over'
      }) {
        const rgb = hexToRgb(color);
        const aspect = clamp(rx / Math.max(0.5, ry || rx), 0.5, 2.5);
        const dabs = [{
          x, y, r: Math.max(rx, ry || rx),
          rgb, alpha, angle: rot, aspect,
          bleed: 0.20, dryness: 0, softness: 0.58, bx: 0, by: 0, blend
        }];
        strokeQueue.push({ layer, type: 'dot', label, dabs, durFrames: 5 });
      }

      // 原画宝相花湿润水墨黛珠（外晕石绿水彩 + 多笔湿墨中心，取代呆板几何黑圆）
      function addInkBoss(layer, label, cx, cy, rad) {
        const dabs = [];
        const inkRgb = hexToRgb(P.ROSETTE_INK);
        const haloRgb = hexToRgb(P.MALACHITE);
        // Outer soft mineral halo
        for (let k = 0; k < 6; k++) {
          const ang = (k / 6) * Math.PI * 2 + rng() * 0.5;
          dabs.push({
            x: cx + Math.cos(ang) * rad * 0.36,
            y: cy + Math.sin(ang) * rad * 0.36,
            r: rad * 0.72,
            rgb: haloRgb, alpha: 0.16, angle: ang, aspect: 1.15,
            bleed: 0.5, dryness: 0, softness: 0.32, bx: 0, by: 0, blend: 'multiply'
          });
        }
        // Organic irregular ink-wash body
        for (let i = 0; i < 18; i++) {
          const ang = (i / 18) * Math.PI * 2 + (rng() - 0.5) * 0.4;
          const dist = Math.sqrt(rng()) * rad * 0.62;
          const r = rad * (0.40 + 0.22 * rng());
          dabs.push({
            x: cx + Math.cos(ang) * dist,
            y: cy + Math.sin(ang) * dist,
            r,
            rgb: inkRgb,
            alpha: 0.34 + 0.16 * (1 - dist / Math.max(1, rad)),
            angle: ang, aspect: 1.14,
            bleed: 0.48, dryness: 0.08, softness: 0.44,
            bx: (rng() - 0.5) * 3, by: (rng() - 0.5) * 3,
            blend: 'multiply'
          });
        }
        // Inner dark ink pupil
        dabs.push({
          x: cx, y: cy, r: rad * 0.66,
          rgb: inkRgb, alpha: 0.42, angle: 0, aspect: 1.06,
          bleed: 0.35, dryness: 0, softness: 0.46, bx: 0, by: 0, blend: 'multiply'
        });
        strokeQueue.push({ layer, type: 'wash', label, dabs, durFrames: 9 });
      }

      // -----------------------------------------------------------------------
      // 第一层：白描勾线（114 笔 · 严格遵照传统“开脸18笔 + 衣服飘带少而长”）
      // -----------------------------------------------------------------------

      // 【1. 开脸（18 笔）：淡赭墨水墨游丝描】
      addLine(1, '开脸·左颊至圆润下巴', [
        [934, 106], [935, 134], [938, 152], [944, 180], [954, 212], [968, 227], [990, 224]
      ], { color: P.INK_FACE, width: 2.0, style: 'yousi', alpha: 0.90 });

      addLine(1, '开脸·右颊至下颌合拢', [
        [1029, 128], [1032, 162], [1029, 194], [1014, 216], [990, 224]
      ], { color: P.INK_FACE, width: 1.9, style: 'yousi', alpha: 0.88 });

      addLine(1, '开脸·额前发际线', [
        [932, 105], [966, 98], [1004, 102], [1022, 114], [1030, 130]
      ], { color: P.INK_FACE, width: 1.8, style: 'yousi', alpha: 0.86 });

      addLine(1, '开脸·右耳外廓', [
        [1031, 136], [1045, 132], [1049, 154], [1044, 178], [1032, 188]
      ], { color: P.INK_FACE, width: 1.85, style: 'yousi' });

      addLine(1, '开脸·右耳内轮', [
        [1035, 148], [1041, 158], [1036, 172]
      ], { color: P.INK_FACE, width: 1.4, style: 'yousi', alpha: 0.82 });

      addLine(1, '开脸·右眉（观者左侧）', [
        [937, 136], [947, 131], [957, 132]
      ], { color: P.INK_LINE, width: 2.0, style: 'lanye' });

      addLine(1, '开脸·左眉（观者右侧春山弯眉）', [
        [975, 134], [992, 126], [1010, 126]
      ], { color: P.INK_LINE, width: 2.1, style: 'lanye' });

      addLine(1, '开脸·右眼上眼睑（实笔）', [
        [936, 155], [945, 157], [955, 155]

      addDot(5, '点睛·左眼微小眼神光', 984, 154, 1.15, { color: P.CLAM_WHITE, alpha: 0.95 });

      addDot(5, '描金·腕钏泥金亮斑', 982, 366, 6.2, { ry: 4.5, rot: -0.4, color: P.GOLD_BRIGHT, alpha: 0.74 });

      addLine(5, '描金·箜篌琴脊煌金提光', [
        [784, 72], [852, 114], [924, 190], [984, 282]
      ], { color: P.GOLD_BRIGHT, width: 2.9, style: 'lanye', alpha: 0.68 });

      addLine(5, '提白·宝相花与珠弧高光', [
        [284, 422], [306, 412], [326, 426]
      ], { color: P.CLAM_WHITE, width: 2.8, style: 'lanye', alpha: 0.68 });

      addDot(5, '提白·三瓣宝相花金蕊中心点', 306, 444, 5.5, { color: P.GOLD_BRIGHT, alpha: 0.86 });

      addLine(5, '提白·青飘带迎风亮缘', [
        [120, 212], [320, 186], [520, 178], [636, 194]
      ], { color: P.CLAM_WHITE, width: 2.2, style: 'xingyun', alpha: 0.54 });

      addLine(5, '提白·左上流云白粉提亮', [
        [152, 118], [176, 98], [186, 74]
      ], { color: P.CLAM_WHITE, width: 2.8, style: 'lanye', alpha: 0.60 });

      addLine(5, '提白·中右流云白粉提亮', [
        [528, 410], [552, 376], [568, 344]
      ], { color: P.CLAM_WHITE, width: 2.8, style: 'lanye', alpha: 0.60 });

      addLine(5, '提白·长裙迎风亮棱', [
        [980, 498], [898, 550], [776, 594]
      ], { color: P.CLAM_WHITE, width: 2.0, style: 'xingyun', alpha: 0.50 });

      // 记录每层结束索引
      layerEndIndices = [0, 0, 0, 0, 0, 0];
      for (let i = 0; i < strokeQueue.length; i++) {
        layerEndIndices[strokeQueue[i].layer] = i + 1;
      }
      for (let l = 1; l <= 5; l++) {
        if (layerEndIndices[l] === 0) layerEndIndices[l] = layerEndIndices[l - 1];
      }
    }

    // =========================================================================
    // 4. 快照缓存、逐笔播放、拖拽定位与单笔步进控制
    // =========================================================================
    function shouldCacheAt(idx) {
      return idx > 0 && idx % CONFIG.CHECKPOINT_INTERVAL === 0;
    }

    function saveCheckpoint(idx) {
      if (checkpoints.has(idx)) return;
      const snap = document.createElement('canvas');
      snap.width = CONFIG.CANVAS_WIDTH;
      snap.height = CONFIG.CANVAS_HEIGHT;
      const sctx = snap.getContext('2d');
      sctx.drawImage(baseCanvas, 0, 0);
      checkpoints.set(idx, snap);
    }

    function getActiveLayerAt(count) {
      if (count <= 0) return 1;
      const idx = clamp(count - 1, 0, Math.max(0, strokeQueue.length - 1));
      return strokeQueue[idx] ? strokeQueue[idx].layer : 1;
    }

    function updateStatusUI(done = false) {
      const total = strokeQueue.length;
      const isIdleBetweenStrokes = activeT <= 0.001 && completedCount > 0 && completedCount < total;

      if (completedCount === 0 && activeT <= 0.001) {
        layerStatusEl.textContent = '生宣暖壁就绪（等待起笔开脸）';
      } else if (done || (total > 0 && completedCount >= total)) {
        layerStatusEl.textContent = `敦煌飞天 · 水墨白描工笔版完成（共 ${total} 笔）`;
      } else {
        const displayIdx = isIdleBetweenStrokes ? completedCount - 1 : clamp(completedCount, 0, total - 1);
        const curStroke = strokeQueue[displayIdx];
        const lName = CONFIG.LAYER_NAMES[curStroke.layer] || '';
        layerStatusEl.textContent = `${lName} ｜ ${curStroke.label}`;
      }

      const shownCount = clamp(completedCount, 0, total);
      strokeStatusEl.textContent = `${shownCount} / ${total} 笔`;

      progressSlider.max = String(total);
      progressSlider.value = String(shownCount);
      const pct = total > 0 ? (shownCount / total) * 100 : 0;
      progressSlider.style.setProperty('--pct', `${pct.toFixed(2)}%`);
      progressPercentEl.textContent = `${pct.toFixed(1)}%`;

      const curLayer = shownCount >= total && total > 0
        ? 5
        : (isIdleBetweenStrokes
          ? getActiveLayerAt(shownCount)
          : getActiveLayerAt(Math.min(shownCount + 1, total)));
      layerChips.forEach((chip) => {
        const l = Number(chip.dataset.layer);
        const prevEnd = layerEndIndices[l - 1] || 0;
        const thisEnd = layerEndIndices[l] || 0;
        const isDone = total > 0 && shownCount >= thisEnd && thisEnd > prevEnd;
        const isCurrent = !done && shownCount > 0 && shownCount < total && l === curLayer;
        chip.classList.toggle('done', isDone && !isCurrent);
        chip.classList.toggle('current', isCurrent);
      });
    }

    function rebuildCanvasToCount(targetCount) {
      const total = strokeQueue.length;
      const clamped = clamp(Math.round(targetCount), 0, total);
      activeT = 0;

      if (clamped >= completedCount && clamped - completedCount <= 8) {
        // 向前小步进：直接在当前 baseCanvas 增量续画，零重绘开销
        for (let i = completedCount; i < clamped; i++) {
          executeStrokeAction(baseCtx, strokeQueue[i], 1);
          if (shouldCacheAt(i + 1)) saveCheckpoint(i + 1);
        }
        completedCount = clamped;
      } else {
        // 查找 <= clamped 的最近离屏快照还原，加速倒带与滑块拖拽
        let bestIdx = 0;
        for (const key of checkpoints.keys()) {
          if (key <= clamped && key > bestIdx) bestIdx = key;
        }
        baseCtx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
        if (bestIdx === 0) {
          baseCtx.drawImage(wallCanvas, 0, 0);
        } else {
          baseCtx.drawImage(checkpoints.get(bestIdx), 0, 0);
        }
        for (let i = bestIdx; i < clamped; i++) {
          executeStrokeAction(baseCtx, strokeQueue[i], 1);
          if (shouldCacheAt(i + 1)) saveCheckpoint(i + 1);
        }
        completedCount = clamped;
      }

      ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      ctx.drawImage(baseCanvas, 0, 0);
      updateStatusUI(completedCount >= total && total > 0);
    }

    function seekToStroke(targetCount) {
      rebuildCanvasToCount(targetCount);
      if (completedCount >= strokeQueue.length && strokeQueue.length > 0) {
        playPauseBtn.textContent = '重播';
      } else if (isPaused) {
        playPauseBtn.textContent = '继续';
      }
    }

    function pausePlayback() {
      if (animFrameId !== null) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      isPaused = true;
      playPauseBtn.textContent = completedCount >= strokeQueue.length ? '重播' : '继续';
    }

    function resumePlayback() {
      if (completedCount >= strokeQueue.length) {
        seekToStroke(0);
      }
      isPaused = false;
      playPauseBtn.textContent = '暂停';
      if (animFrameId === null) {
        animFrameId = requestAnimationFrame(renderLoop);
      }
    }

    function renderLoop() {
      if (isPaused) {
        animFrameId = null;
        return;
      }

      const total = strokeQueue.length;
      if (completedCount >= total) {
        animFrameId = null;
        isPaused = true;
        playPauseBtn.textContent = '重播';
        updateStatusUI(true);
        return;
      }

      const rate = CONFIG.SPEED_LEVELS[speedIndex].rate;
      let budget = rate;

      while (budget > 0 && completedCount < total) {
        const stroke = strokeQueue[completedCount];
        const stepT = 1 / Math.max(2, stroke.durFrames);
        const nextT = activeT + stepT * budget;
        if (nextT >= 1) {
          const used = (1 - activeT) / stepT;
          budget -= used;
          executeStrokeAction(baseCtx, stroke, 1);
          completedCount++;
          activeT = 0;
          if (shouldCacheAt(completedCount)) saveCheckpoint(completedCount);
        } else {
          activeT = nextT;
          budget = 0;
        }
      }

      ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      ctx.drawImage(baseCanvas, 0, 0);
      if (completedCount < total && activeT > 0) {
        executeStrokeAction(ctx, strokeQueue[completedCount], activeT);
      }

      if (completedCount >= total) {
        animFrameId = null;
        isPaused = true;
        playPauseBtn.textContent = '重播';
        updateStatusUI(true);
      } else {
        updateStatusUI(false);
        animFrameId = requestAnimationFrame(renderLoop);
      }
    }

    function downloadCanvasPNG() {
      try {
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
        link.download = `敦煌飞天水墨工笔版_${stamp}.png`;
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.warn('下载 PNG 失败：', err);
      }
    }

    function startPainting() {
      if (animFrameId !== null) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      if (seekRafId !== null) {
        cancelAnimationFrame(seekRafId);
        seekRafId = null;
      }

      isPaused = false;
      completedCount = 0;
      activeT = 0;
      checkpoints.clear();
      playPauseBtn.textContent = '暂停';

      wallCanvas = buildFreshChalkWall();
      if (!baseCanvas) {
        baseCanvas = document.createElement('canvas');
        baseCanvas.width = CONFIG.CANVAS_WIDTH;
        baseCanvas.height = CONFIG.CANVAS_HEIGHT;
        baseCtx = baseCanvas.getContext('2d');
      }
      baseCtx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      baseCtx.drawImage(wallCanvas, 0, 0);

      ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      ctx.drawImage(baseCanvas, 0, 0);

      buildTraditionalFeitianQueue();
      updateStatusUI(false);
      animFrameId = requestAnimationFrame(renderLoop);
    }

    // 交互绑定
    progressSlider.addEventListener('input', () => {
      pausePlayback();
      pendingSeek = Number(progressSlider.value);
      if (seekRafId === null) {
        seekRafId = requestAnimationFrame(() => {
          seekRafId = null;
          if (pendingSeek !== null) {
            const v = pendingSeek;
            pendingSeek = null;
            seekToStroke(v);
          }
        });
      }
    });

    layerChips.forEach((chip) => {
      chip.addEventListener('click', () => {
        const l = Number(chip.dataset.layer);
        pausePlayback();
        seekToStroke(layerEndIndices[l] || 0);
      });
    });

    playPauseBtn.addEventListener('click', () => {
      if (isPaused) resumePlayback();
      else pausePlayback();
    });

    stepBackBtn.addEventListener('click', () => {
      pausePlayback();
      seekToStroke(completedCount - CONFIG.STEP_DELTA);
    });

    stepForwardBtn.addEventListener('click', () => {
      pausePlayback();
      seekToStroke(completedCount + CONFIG.STEP_DELTA);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        pausePlayback();
        seekToStroke(completedCount - (e.shiftKey ? 10 : 1));
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        pausePlayback();
        seekToStroke(completedCount + (e.shiftKey ? 10 : 1));
      } else if (e.code === 'Space' && document.activeElement?.tagName !== 'BUTTON') {
        e.preventDefault();
        if (isPaused) resumePlayback();
        else pausePlayback();
      }
    });

    redrawBtn.addEventListener('click', () => {
      startPainting();
    });

    speedBtn.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % CONFIG.SPEED_LEVELS.length;
      const level = CONFIG.SPEED_LEVELS[speedIndex];
      speedBtn.textContent = level.label;
      speedBtn.classList.toggle('active', speedIndex > 0);
    });

    downloadBtn.addEventListener('click', () => {
      downloadCanvasPNG();
    });

    startPainting();
  </script>

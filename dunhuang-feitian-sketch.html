<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>敦煌散花飞天 · 纯代码写意版 (Canvas 2D)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #2c241d;
      background-image: radial-gradient(circle at 50% 42%, #3d3228 0%, #241d17 100%);
      color: #e8dcc6;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", Georgia, serif;
      padding: 20px 16px;
      user-select: none;
    }

    .mural-frame {
      background: #46382b;
      padding: 14px;
      border: 1px solid #6b5642;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(236, 218, 186, 0.14);
      max-width: 100%;
    }

    #muralCanvas {
      display: block;
      width: min(1160px, 93vw);
      height: auto;
      aspect-ratio: 16 / 10;
      background: #e6d5b8;
      border: 1px solid rgba(52, 39, 28, 0.55);
    }

    .toolbar {
      margin-top: 14px;
      width: min(1188px, 93vw);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 4px;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
      color: #d6c5a9;
      letter-spacing: 0.08em;
    }

    .status-layer {
      font-weight: 600;
      color: #f3e4c8;
    }

    .status-count {
      font-size: 13px;
      color: #bfa988;
      font-variant-numeric: tabular-nums;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      appearance: none;
      background: #4a3a2c;
      color: #f0e2c8;
      border: 1px solid #8a7055;
      padding: 7px 18px;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #5c4837;
      border-color: #bfa07c;
    }

    button:active {
      transform: translateY(1px);
    }

    button.active {
      background: #9f4c36;
      color: #fbf2e1;
      border-color: #c87a5e;
    }

    button.small-btn {
      padding: 6px 12px;
      font-size: 13px;
      letter-spacing: 0.06em;
    }

    button.download-btn {
      background: #355863;
      border-color: #5b8d9c;
      color: #eef5f7;
    }

    button.download-btn:hover {
      background: #436e7b;
      border-color: #7eb3c2;
    }

    .progress-panel {
      margin-top: 12px;
      width: min(1188px, 93vw);
      padding: 10px 12px;
      background: rgba(58, 46, 36, 0.72);
      border: 1px solid #6b5642;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #progressSlider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: linear-gradient(90deg, #9f4c36 0%, #c9a15a var(--pct, 0%), #352a20 var(--pct, 0%));
      border: 1px solid #755e47;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    #progressSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e5c687;
      border: 2px solid #4a3728;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    #progressSlider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    #progressSlider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e5c687;
      border: 2px solid #4a3728;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      cursor: pointer;
    }

    .progress-percent {
      min-width: 52px;
      text-align: right;
      font-size: 13px;
      color: #e4cfa9;
      font-variant-numeric: tabular-nums;
    }

    .layer-steps {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .layer-chip {
      padding: 4px 10px;
      font-size: 12px;
      letter-spacing: 0.06em;
      background: #3a2e23;
      color: #bfa988;
      border: 1px solid #64503d;
    }

    .layer-chip.done {
      color: #ebd8b8;
      border-color: #8a7055;
      background: #48392b;
    }

    .layer-chip.current {
      background: #8c4430;
      color: #fbf2e1;
      border-color: #c87a5e;
    }

    .hint-text {
      margin-left: auto;
      font-size: 11px;
      color: #9e8a6f;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="mural-frame">
    <canvas id="muralCanvas" width="1280" height="800"></canvas>
  </div>

  <div class="progress-panel">
    <div class="progress-row">
      <input id="progressSlider" type="range" min="0" max="0" value="0" step="1" aria-label="作画进度条" />
      <span id="progressPercent" class="progress-percent">0.0%</span>
    </div>
    <div class="layer-steps" id="layerSteps">
      <button class="layer-chip" type="button" data-layer="1">一层·起稿</button>
      <button class="layer-chip" type="button" data-layer="2">二层·平涂</button>
      <button class="layer-chip" type="button" data-layer="3">三层·凹凸</button>
      <button class="layer-chip" type="button" data-layer="4">四层·线描</button>
      <button class="layer-chip" type="button" data-layer="5">五层·描金</button>
      <button class="layer-chip" type="button" data-layer="6">六层·散花</button>
      <button class="layer-chip" type="button" data-layer="7">七层·包浆</button>
      <span class="hint-text">支持拖拽进度条 / ← → 键逐段微调（按住 Shift 步进更宽）</span>
    </div>
  </div>

  <div class="toolbar">
    <div class="status-group">
      <span id="layerStatus" class="status-layer">制泥壁白粉地仗…</span>
      <span id="strokeStatus" class="status-count">0 / 0 笔</span>
    </div>
    <div class="btn-group">
      <button id="playPauseBtn" class="small-btn" type="button">暂停</button>
      <button id="stepBackBtn" class="small-btn" type="button">退一步</button>
      <button id="stepForwardBtn" class="small-btn" type="button">进一步</button>
      <button id="redrawBtn" type="button">重新绘制</button>
      <button id="speedBtn" type="button">加速</button>
      <button id="downloadBtn" class="download-btn" type="button">下载 PNG</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // 顶部常量、敦煌传统矿物颜料、泥壁地仗与笔刷参数配置区（统一管理）
    // =========================================================================
    const CONFIG = {
      // 画布尺寸（16:10 敦煌石窟横幅壁画比例）
      CANVAS_WIDTH: 1280,
      CANVAS_HEIGHT: 800,

      // 总笔触硬上限（约 3 万笔精细呈现，严格不截断后层细节）
      MAX_STROKES: 30000,

      // 各层笔触安全配额上限（每层自然笔触数均低于上限，确保所有细节完整绘制）
      LAYER_CAPS: [0, 2600, 7800, 7200, 6800, 5000, 2600, 1800],

      // 敦煌泥壁白粉地仗参数（暖土米黄底色 + 矿物斑驳 + 细砂颗粒 + 麦草纤维 + 岁纹）
      WALL: {
        BASE_COLOR: '#e6d5b8',
        EDGE_VIGNETTE: 'rgba(116, 88, 60, 0.28)',
        NOISE_INTENSITY: 11,
        PATCH_COUNT: 140,
        STRAW_COUNT: 520,
        CRACK_COUNT: 42
      },

      // 敦煌传统矿物与植物颜料（低饱和古雅矿石色，严禁刺眼高饱和荧光色）
      PIGMENT: {
        TU_HONG:   { rgb: [162, 74, 52],   baseAlpha: 0.42 }, // 土红：起稿线、凹凸暗部晕染、壁面暖赭
        ZHU_SHA:   { rgb: [196, 78, 56],   baseAlpha: 0.56 }, // 朱砂：胸巾、裙身主色、莲瓣与花钿点唇
        SHI_LV:    { rgb: [74, 134, 108],  baseAlpha: 0.52 }, // 石绿：飘带、裙褶层次与头光主环
        ER_LV:     { rgb: [118, 168, 138], baseAlpha: 0.48 }, // 二绿：飘带翻折面、祥云淡绿与头光过渡
        SHI_QING:  { rgb: [54, 92, 128],   baseAlpha: 0.54 }, // 石青：下飘带、裙褶深谷与宝冠嵌珠
        SAN_QING:  { rgb: [96, 134, 162],  baseAlpha: 0.44 }, // 三青：头光外环、祥云淡青与散花点缀
        ZHE_SHI:   { rgb: [148, 92, 58],   baseAlpha: 0.40 }, // 赭石：肌肤边缘分染、祥云暖影与泥壁岁斑
        SKIN:      { rgb: [224, 194, 158], baseAlpha: 0.64 }, // 古雅肉色：面庞、肩臂、腰腹与双足铺底
        NI_JIN:    { rgb: [214, 174, 94],  baseAlpha: 0.72 }, // 泥金：宝冠、璎珞、臂钏、衣纹描金与团花
        QIAN_BAI:  { rgb: [238, 226, 200], baseAlpha: 0.68 }, // 铅白/蛤粉：西域凹凸提亮、祥云提白、连珠莲尖
        GU_MO:     { rgb: [38, 32, 28],    baseAlpha: 0.78 }, // 古墨：铁线描、兰叶描复勾定形
        JIAO_MO:   { rgb: [22, 18, 16],    baseAlpha: 0.88 }, // 焦墨：眸瞳、发髻深处与关键顿挫线
        WALL_DUST: { rgb: [224, 206, 176], baseAlpha: 0.24 }  // 壁画风化粉尘：第七层岁韵包浆与微剥落
      },

      // 毛笔笔刷默认参数
      BRUSH: {
        SOFTNESS: 0.56,          // 软边径向渐变实度
        BLEED_SCALE: 1.42,       // 地仗粉层微晕染倍数
        BLEED_ALPHA_RATIO: 0.24, // 晕染边缘透明度占比
        DRY_BRISTLES: 4,         // 枯笔/风化飞白笔毫数
        DRY_SKIP_BASE: 0.45,     // 飞白留白基础概率
        PRESSURE_JITTER: 0.12    // 运笔自然压力微颤
      },

      // 动画速度档位（1x / ×3 / ×8 / ×16 四档切换）
      SPEED_LEVELS: [
        { label: '加速',     dabsPerFrame: 35 },
        { label: '加速 ×3',  dabsPerFrame: 105 },
        { label: '加速 ×8',  dabsPerFrame: 280 },
        { label: '加速 ×16', dabsPerFrame: 560 }
      ],

      // 严格敦煌壁画七层作画阶段名称
      LAYER_NAMES: [
        '',
        '第一层：土红起稿 · 淡土红定形骨法',
        '第二层：平涂设色 · 石绿石青朱砂肉色铺底',
        '第三层：凹凸晕染 · 西域凹凸法与渐变退晕',
        '第四层：铁线兰叶描 · 古墨焦墨复勾神韵',
        '第五层：宝冠璎珞 · 泥金描边与唐草暗纹',
        '第六层：散花提白 · 宝相莲华与祥云提白',
        '第七层：壁画岁韵 · 矿物风化与千年包浆'
      ]
    };

    // =========================================================================
    // 全局状态与 DOM 引用
    // =========================================================================
    const canvas = document.getElementById('muralCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: false });
    const layerStatusEl = document.getElementById('layerStatus');
    const strokeStatusEl = document.getElementById('strokeStatus');
    const progressSlider = document.getElementById('progressSlider');
    const progressPercentEl = document.getElementById('progressPercent');
    const layerChips = Array.from(document.querySelectorAll('.layer-chip'));
    const playPauseBtn = document.getElementById('playPauseBtn');
    const stepBackBtn = document.getElementById('stepBackBtn');
    const stepForwardBtn = document.getElementById('stepForwardBtn');
    const redrawBtn = document.getElementById('redrawBtn');
    const speedBtn = document.getElementById('speedBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    const CHECKPOINT_INTERVAL = 2500;
    const STEP_DELTA = 150;

    let wallCanvas = null;
    let strokeQueue = [];
    let layerCounts = [0, 0, 0, 0, 0, 0, 0, 0];
    let layerEndIndices = [0, 0, 0, 0, 0, 0, 0, 0];
    let layerEndSet = new Set();
    let checkpoints = new Map();
    let currentIndex = 0;
    let speedIndex = 0;
    let animFrameId = null;
    let isPaused = false;
    let pendingSeek = null;
    let seekRafId = null;
    let rng = Math.random;

    // =========================================================================
    // 基础数学、随机与平滑插值工具
    // =========================================================================
    function createPRNG(seed) {
      let s = seed >>> 0;
      return function () {
        s += 0x6D2B79F5;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function randRange(min, max) {
      return min + (max - min) * rng();
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // 三次样条/Catmull-Rom 平滑曲线采样，保证飘带、裙褶与身躯弧线婉转流畅
    function sampleCatmullRom(ctrlPts, samplesPerSeg = 14) {
      if (ctrlPts.length < 2) return ctrlPts.slice();
      const pts = [ctrlPts[0], ...ctrlPts, ctrlPts[ctrlPts.length - 1]];
      const out = [];
      for (let i = 1; i < pts.length - 2; i++) {
        const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2];
        for (let s = 0; s < samplesPerSeg; s++) {
          const t = s / samplesPerSeg;
          const t2 = t * t;
          const t3 = t2 * t;
          const x = 0.5 * (
            (2 * p1.x) +
            (-p0.x + p2.x) * t +
            (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
            (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
          );
          const y = 0.5 * (
            (2 * p1.y) +
            (-p0.y + p2.y) * t +
            (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
            (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
          );
          out.push({ x, y });
        }
      }
      out.push({ ...ctrlPts[ctrlPts.length - 1] });
      return out;
    }

    // 沿中心曲线计算左右包络边缘与法向点
    function buildRibbonGeometry(centerPts, widthFn) {
      const leftEdge = [];
      const rightEdge = [];
      const normals = [];
      const n = centerPts.length;
      for (let i = 0; i < n; i++) {
        const prev = centerPts[Math.max(0, i - 1)];
        const next = centerPts[Math.min(n - 1, i + 1)];
        const dx = next.x - prev.x;
        const dy = next.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        const t = i / (n - 1);
        const halfW = widthFn(t) * 0.5;
        normals.push({ nx, ny, halfW, t });
        leftEdge.push({ x: centerPts[i].x + nx * halfW, y: centerPts[i].y + ny * halfW });
        rightEdge.push({ x: centerPts[i].x - nx * halfW, y: centerPts[i].y - ny * halfW });
      }
      return { centerPts, leftEdge, rightEdge, normals };
    }

    function sampleArcPoints(cx, cy, rx, ry, startAng, endAng, steps = 28, rot = 0) {
      const pts = [];
      const cosR = Math.cos(rot);
      const sinR = Math.sin(rot);
      for (let i = 0; i <= steps; i++) {
        const a = lerp(startAng, endAng, i / steps);
        const lx = Math.cos(a) * rx;
        const ly = Math.sin(a) * ry;
        pts.push({
          x: cx + lx * cosR - ly * sinR,
          y: cy + lx * sinR + ly * cosR
        });
      }
      return pts;
    }

    // =========================================================================
    // 1. 敦煌泥壁白粉地仗基底生成
    // =========================================================================
    function buildDunhuangWall() {
      const off = document.createElement('canvas');
      off.width = CONFIG.CANVAS_WIDTH;
      off.height = CONFIG.CANVAS_HEIGHT;
      const octx = off.getContext('2d');
      const w = off.width;
      const h = off.height;

      // 1) 暖土米黄白粉地仗底色
      octx.fillStyle = CONFIG.WALL.BASE_COLOR;
      octx.fillRect(0, 0, w, h);

      // 2) 石窟柔和光照与四壁昏暗晕边
      const light = octx.createRadialGradient(w * 0.45, h * 0.42, w * 0.08, w * 0.48, h * 0.48, w * 0.68);
      light.addColorStop(0, 'rgba(248, 238, 218, 0.34)');
      light.addColorStop(0.58, 'rgba(226, 206, 174, 0.08)');
      light.addColorStop(1, CONFIG.WALL.EDGE_VIGNETTE);
      octx.fillStyle = light;
      octx.fillRect(0, 0, w, h);

      // 3) 多层泥壁矿物暗斑与白粉潮斑
      for (let i = 0; i < CONFIG.WALL.PATCH_COUNT; i++) {
        const px = rng() * w;
        const py = rng() * h;
        const pr = randRange(18, 95);
        const g = octx.createRadialGradient(px, py, 0, px, py, pr);
        const warm = rng() > 0.42 ? '168, 134, 96' : '242, 232, 212';
        const alpha = randRange(0.025, 0.075);
        g.addColorStop(0, `rgba(${warm}, ${alpha.toFixed(4)})`);
        g.addColorStop(1, `rgba(${warm}, 0)`);
        octx.fillStyle = g;
        octx.beginPath();
        octx.arc(px, py, pr, 0, Math.PI * 2);
        octx.fill();
      }

      // 4) 像素级细砂颗粒噪点（模拟澄板土与白粉涂层质感）
      const imgData = octx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const amp = CONFIG.WALL.NOISE_INTENSITY;
      for (let i = 0; i < data.length; i += 4) {
        const delta = (rng() - 0.5) * 2 * amp;
        data[i]     = clamp(data[i] + delta, 0, 255);
        data[i + 1] = clamp(data[i + 1] + delta * 0.94, 0, 255);
        data[i + 2] = clamp(data[i + 2] + delta * 0.82, 0, 255);
      }
      octx.putImageData(imgData, 0, 0);

      // 5) 麦草泥短纤维痕（敦煌地仗典型肌理）
      octx.save();
      octx.lineCap = 'round';
      for (let i = 0; i < CONFIG.WALL.STRAW_COUNT; i++) {
        const sx = rng() * w;
        const sy = rng() * h;
        const len = randRange(7, 26);
        const ang = randRange(-Math.PI, Math.PI);
        const bend = randRange(-4, 4);
        const alpha = randRange(0.03, 0.085);
        octx.strokeStyle = rng() > 0.35
          ? `rgba(138, 108, 76, ${alpha.toFixed(4)})`
          : `rgba(246, 238, 222, ${(alpha * 0.9).toFixed(4)})`;
        octx.lineWidth = randRange(0.45, 1.15);
        octx.beginPath();
        octx.moveTo(sx, sy);
        octx.quadraticCurveTo(
          sx + Math.cos(ang) * len * 0.5 + bend,
          sy + Math.sin(ang) * len * 0.5 - bend,
          sx + Math.cos(ang) * len,
          sy + Math.sin(ang) * len
        );
        octx.stroke();
      }

      // 6) 微细岁纹冰裂（极浅的干裂纹理，增添千年古壁氛围）
      for (let c = 0; c < CONFIG.WALL.CRACK_COUNT; c++) {
        let cx = rng() * w;
        let cy = rng() * h;
        let ang = randRange(-Math.PI, Math.PI);
        const segs = Math.floor(randRange(4, 11));
        octx.strokeStyle = `rgba(98, 76, 56, ${randRange(0.035, 0.08).toFixed(4)})`;
        octx.lineWidth = randRange(0.4, 0.85);
        octx.beginPath();
        octx.moveTo(cx, cy);
        for (let s = 0; s < segs; s++) {
          ang += randRange(-0.55, 0.55);
          const step = randRange(8, 22);
          cx += Math.cos(ang) * step;
          cy += Math.sin(ang) * step;
          octx.lineTo(cx, cy);
        }
        octx.stroke();
      }
      octx.restore();

      return off;
    }

    // =========================================================================
    // 2. 毛笔与矿物颜料笔刷渲染引擎
    // =========================================================================
    function drawSoftRadialDab(targetCtx, x, y, radius, rgb, alpha, angle, aspect, softness, compositeOp) {
      if (radius <= 0.25 || alpha <= 0.002) return;
      targetCtx.save();
      if (compositeOp && compositeOp !== 'source-over') {
        targetCtx.globalCompositeOperation = compositeOp;
      }
      targetCtx.translate(x, y);
      if (angle) targetCtx.rotate(angle);
      if (aspect && aspect !== 1) targetCtx.scale(aspect, 1);

      const grad = targetCtx.createRadialGradient(0, 0, 0, 0, 0, radius);
      const [r, g, b] = rgb;
      const midStop = clamp(softness, 0.14, 0.85);

      grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha.toFixed(4)})`);
      grad.addColorStop(midStop, `rgba(${r}, ${g}, ${b}, ${(alpha * 0.62).toFixed(4)})`);
      grad.addColorStop(lerp(midStop, 1, 0.58), `rgba(${r}, ${g}, ${b}, ${(alpha * 0.18).toFixed(4)})`);
      grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

      targetCtx.fillStyle = grad;
      targetCtx.beginPath();
      targetCtx.arc(0, 0, radius, 0, Math.PI * 2);
      targetCtx.fill();
      targetCtx.restore();
    }

    function executeStrokeAction(action) {
      const pig = CONFIG.PIGMENT[action.ink] || CONFIG.PIGMENT.TU_HONG;
      const pressure = action.pressure ?? 1;
      const alpha = clamp(pig.baseAlpha * (action.alphaScale ?? 1) * pressure, 0.004, 0.96);
      const radius = Math.max(0.55, action.r * (0.72 + 0.28 * pressure));
      const angle = action.angle ?? 0;
      const aspect = action.aspect ?? 1;
      const bleed = action.bleed ?? 0;
      const dryness = action.dryness ?? 0;
      const softness = action.softness ?? CONFIG.BRUSH.SOFTNESS;
      const compositeOp = action.composite || 'source-over';

      // 地仗白粉层微晕染
      if (bleed > 0.02) {
        const bleedR = radius * (1 + (CONFIG.BRUSH.BLEED_SCALE - 1) * bleed);
        const bleedAlpha = alpha * CONFIG.BRUSH.BLEED_ALPHA_RATIO * bleed;
        drawSoftRadialDab(
          ctx,
          action.x + (action.bx ?? 0),
          action.y + (action.by ?? 0),
          bleedR,
          pig.rgb,
          bleedAlpha,
          angle,
          aspect * 1.05,
          0.32,
          compositeOp
        );
      }

      // 枯笔飞白 / 岁韵微剥落
      if (dryness > 0.15) {
        const bristles = CONFIG.BRUSH.DRY_BRISTLES;
        const perpX = -Math.sin(angle);
        const perpY = Math.cos(angle);
        const seedHash = Math.abs(Math.sin(action.x * 12.9898 + action.y * 78.233) * 43758.5453);

        for (let i = 0; i < bristles; i++) {
          const h = (seedHash * (i + 1.41)) % 1;
          if (h < dryness * (CONFIG.BRUSH.DRY_SKIP_BASE + 0.32)) continue;

          const offsetRatio = (i / (bristles - 1) - 0.5) * 1.4;
          const ox = perpX * radius * offsetRatio;
          const oy = perpY * radius * offsetRatio;
          const subR = Math.max(0.6, radius * (0.34 + 0.16 * (1 - Math.abs(offsetRatio))));
          const subAlpha = alpha * (0.60 + 0.40 * (1 - dryness * 0.4));

          drawSoftRadialDab(
            ctx,
            action.x + ox,
            action.y + oy,
            subR,
            pig.rgb,
            subAlpha,
            angle,
            Math.max(1.2, aspect * 1.25),
            0.50,
            compositeOp
          );
        }
        return;
      }

      drawSoftRadialDab(ctx, action.x, action.y, radius, pig.rgb, alpha, angle, aspect, softness, compositeOp);
    }

    // =========================================================================
    // 队列构造辅助函数（带总上限与每层配额保护，确保七层精细笔触不互抢配额）
    // =========================================================================
    function pushAction(action) {
      if (strokeQueue.length >= CONFIG.MAX_STROKES) return false;
      const layer = action.layer;
      if (layerCounts[layer] >= CONFIG.LAYER_CAPS[layer]) return false;
      layerCounts[layer]++;
      strokeQueue.push(action);
      return true;
    }

    /**
     * 沿路径生成细腻毛笔笔触（支持铁线描均匀线质、兰叶描轻重顿挫）
     */
    function enqueueBrushPath(points, opts) {
      if (!points || points.length < 2) return;
      const {
        layer,
        ink = 'GU_MO',
        radiusStart = 2.0,
        radiusEnd = 2.0,
        alphaScale = 1,
        spacing = 0.55,
        minStep = null,
        bleed = 0.12,
        dryness = 0,
        aspect = 1.25,
        softness = CONFIG.BRUSH.SOFTNESS,
        breakProb = 0,
        jitter = 0.35,
        taperEnds = true,
        orchidStyle = false, // 兰叶描：中段略丰厚、两端灵动收尖
        composite = null
      } = opts;

      const segLens = [];
      const cumLens = [0];
      let totalLen = 0;
      for (let i = 1; i < points.length; i++) {
        const len = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
        segLens.push(len);
        totalLen += len;
        cumLens.push(totalLen);
      }
      if (totalLen < 0.5) return;

      const effectiveMinStep = minStep !== null ? minStep : (layer === 2 ? 5.85 : 0.9);
      let skipCounter = 0;
      let segIdx = 0;
      let dist = 0;

      while (true) {
        const d = Math.min(dist, totalLen);
        while (segIdx < segLens.length - 1 && cumLens[segIdx + 1] < d) {
          segIdx++;
        }
        const p0 = points[segIdx];
        const p1 = points[segIdx + 1];
        const segLen = segLens[segIdx];
        const localT = segLen > 1e-4 ? clamp((d - cumLens[segIdx]) / segLen, 0, 1) : 0;
        const globalT = clamp(d / totalLen, 0, 1);
        const angle = segLen > 1e-4 ? Math.atan2(p1.y - p0.y, p1.x - p0.x) : 0;

        let skipped = false;
        if (breakProb > 0) {
          if (skipCounter > 0) {
            skipCounter--;
            skipped = true;
          } else if (globalT > 0.12 && globalT < 0.88 && rng() < breakProb) {
            skipCounter = Math.floor(randRange(1, 2.8));
            skipped = true;
          }
        }

        const baseR = lerp(radiusStart, radiusEnd, globalT);

        if (!skipped) {
          let env = 1;
          if (orchidStyle) {
            // 兰叶描典型顿挫韵律：起笔微顿，中腹丰腴，收锋锐利飘逸
            const wave = Math.sin(globalT * Math.PI);
            env = 0.42 + 0.82 * Math.pow(wave, 0.72) + 0.16 * Math.sin(globalT * Math.PI * 3);
          } else if (taperEnds) {
            env = 0.36 + 0.64 * Math.pow(Math.sin(globalT * Math.PI), 0.5);
          }

          const pressure = clamp(
            env * (1 + (rng() - 0.5) * 2 * CONFIG.BRUSH.PRESSURE_JITTER),
            0.25,
            1.35
          );
          const r = orchidStyle ? baseR * (0.68 + 0.48 * Math.sin(globalT * Math.PI)) : baseR;

          const ok = pushAction({
            layer,
            ink,
            x: lerp(p0.x, p1.x, localT) + (rng() - 0.5) * jitter,
            y: lerp(p0.y, p1.y, localT) + (rng() - 0.5) * jitter,
            r,
            angle,
            aspect,
            pressure,
            alphaScale,
            bleed,
            dryness,
            softness,
            composite,
            bx: bleed > 0 ? (rng() - 0.5) * r * 0.35 : 0,
            by: bleed > 0 ? (rng() - 0.5) * r * 0.35 : 0
          });
          if (!ok) return;
        }

        if (d >= totalLen) break;
        const step = Math.max(effectiveMinStep, baseR * spacing);
        dist = Math.min(totalLen, d + step);
      }
    }

    /**
     * 沿多边形内部扫描或丝带条带纵向密排平涂/退晕笔触（避免整块硬填充，保持手工涂染肌理）
     */
    function enqueueRibbonWash(geom, opts) {
      const {
        layer,
        ink,
        lanes = 4,
        uRange = [-0.85, 0.85],
        radius = 6,
        alphaScale = 0.75,
        spacing = 0.65,
        minStep = null,
        bleed = 0.35,
        softness = 0.42,
        composite = null
      } = opts;

      for (let l = 0; l < lanes; l++) {
        const u = lanes === 1 ? (uRange[0] + uRange[1]) * 0.5 : lerp(uRange[0], uRange[1], l / (lanes - 1));
        const lanePts = geom.centerPts.map((p, idx) => {
          const n = geom.normals[idx];
          return {
            x: p.x + n.nx * n.halfW * u,
            y: p.y + n.ny * n.halfW * u
          };
        });
        enqueueBrushPath(lanePts, {
          layer,
          ink,
          radiusStart: radius,
          radiusEnd: radius * 0.78,
          alphaScale,
          spacing,
          minStep,
          bleed,
          aspect: 1.4,
          softness,
          jitter: 0.9,
          taperEnds: true,
          composite
        });
      }
    }

    /**
     * 填充多边形区域（通过沿主轴平滑插值流线逐笔涂染，保持国画工笔平涂与退晕笔意）
     */
    function enqueuePolygonWash(topBoundary, bottomBoundary, opts) {
      const {
        layer,
        ink,
        rows = 6,
        tStart = 0,
        tEnd = 1,
        vRange = [0.06, 0.94],
        radius = 7,
        alphaScale = 0.8,
        spacing = 0.68,
        minStep = null,
        bleed = 0.35,
        softness = 0.40,
        composite = null
      } = opts;

      const steps = Math.max(topBoundary.length, bottomBoundary.length, 24);
      for (let r = 0; r < rows; r++) {
        const v = rows === 1 ? 0.5 : lerp(vRange[0], vRange[1], r / (rows - 1));
        const pts = [];
        for (let s = 0; s <= steps; s++) {
          const t = lerp(tStart, tEnd, s / steps);
          const idxA = clamp(Math.floor(t * (topBoundary.length - 1)), 0, topBoundary.length - 1);
          const idxB = clamp(Math.floor(t * (bottomBoundary.length - 1)), 0, bottomBoundary.length - 1);
          const pa = topBoundary[idxA];
          const pb = bottomBoundary[idxB];
          pts.push({
            x: lerp(pa.x, pb.x, v),
            y: lerp(pa.y, pb.y, v)
          });
        }
        enqueueBrushPath(pts, {
          layer,
          ink,
          radiusStart: radius,
          radiusEnd: radius * 0.9,
          alphaScale,
          spacing,
          minStep,
          bleed,
          aspect: 1.35,
          softness,
          jitter: 0.9,
          taperEnds: true,
          composite
        });
      }
    }

    /**
     * 填充椭圆区域（同心螺旋笔触平涂与凹凸晕染）
     */
    function enqueueEllipseFill(cx, cy, rx, ry, rot, opts) {
      const {
        layer,
        ink,
        rings = 4,
        rFracStart = 0.15,
        rFracEnd = 0.92,
        radius = 5.5,
        alphaScale = 0.85,
        spacing = 0.65,
        minStep = null,
        bleed = 0.25,
        softness = 0.45,
        composite = null
      } = opts;

      for (let i = 0; i < rings; i++) {
        const frac = rings === 1 ? rFracEnd : lerp(rFracStart, rFracEnd, i / (rings - 1));
        const arc = sampleArcPoints(cx, cy, rx * frac, ry * frac, 0, Math.PI * 2, Math.max(18, Math.round(28 * frac)), rot);
        enqueueBrushPath(arc, {
          layer,
          ink,
          radiusStart: radius,
          radiusEnd: radius,
          alphaScale,
          spacing,
          minStep,
          bleed,
          aspect: 1.2,
          softness,
          jitter: 0.6,
          taperEnds: false,
          composite
        });
      }
    }

    // =========================================================================
    // 3. 盛唐敦煌散花飞天几何结构与七层绘制队列构建
    // =========================================================================
    function buildFeitianQueue() {
      strokeQueue = [];

      // 高髻与云鬓

      // 颈肩与三道弯躯干轮廓
      const neckTopL = { x: 432, y: 321 }, neckTopR = { x: 452, y: 317 };
      const neckBotL = { x: 448, y: 350 }, neckBotR = { x: 478, y: 342 };

      const torsoUpperEdge = sampleCatmullRom([

      const rightArmCenter = sampleCatmullRom([

      // 凌空翘起双足（自长裙上方翩然探出，清晰秀美）

      // 裤脚/裙裾脚踝褶袖（交代双足穿出位置）

      const lowerCuff = sampleArcPoints(835, 379, 6, 13, -Math.PI * 0.48, Math.PI * 0.48, 12, -0.55);

      // 吴带当风：上长飘带（宽舒环抱头光左侧并向右上凌空回旋卷尾）
      const upperRibbonCenter = sampleCatmullRom([

        const spiral = makeSpiral(spiralCfg.cx, spiralCfg.cy, spiralCfg.r, spiralCfg.ang, 1.3, spiralCfg.dir, 22);

      const cloudBands = [

        ),

    // =========================================================================
    // 4. 动作队列逐笔渲染循环、快照缓存与进度条跳转控制
    // =========================================================================
    function computeLayerBoundaries() {
      let acc = 0;
      layerEndIndices = [0];
      layerEndSet = new Set();
      for (let l = 1; l <= 7; l++) {
        acc += layerCounts[l];
        layerEndIndices.push(acc);
        if (acc > 0) layerEndSet.add(acc);
      }
    }

    function shouldCacheAt(idx) {
      return idx > 0 && (idx % CHECKPOINT_INTERVAL === 0 || layerEndSet.has(idx));
    }

    function saveCheckpoint(idx) {
      if (idx <= 0 || checkpoints.has(idx)) return;
      const snap = document.createElement('canvas');
      snap.width = CONFIG.CANVAS_WIDTH;
      snap.height = CONFIG.CANVAS_HEIGHT;
      const sctx = snap.getContext('2d');
      sctx.drawImage(canvas, 0, 0);
      checkpoints.set(idx, snap);
    }

    function getActiveLayerAt(idx) {
      if (idx <= 0) return 1;
      const clamped = Math.min(idx - 1, Math.max(0, strokeQueue.length - 1));
      return strokeQueue[clamped] ? strokeQueue[clamped].layer : 1;
    }

    function downloadCanvasPNG() {
      try {
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'dunhuang-feitian-sketch.png';
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.warn('下载 PNG 失败：', err);
      }
    }

    function updateStatusUI(layerNum, done = false) {
      const total = strokeQueue.length;
      if (currentIndex === 0) {
        layerStatusEl.textContent = '泥壁白粉地仗就绪（等待起笔）';
      } else if (done) {
        layerStatusEl.textContent = '敦煌散花飞天绘制完成';
      } else {
        layerStatusEl.textContent = CONFIG.LAYER_NAMES[layerNum] || '施彩运笔中…';
      }
      strokeStatusEl.textContent = `${currentIndex} / ${total} 笔`;

      // 同步进度条与百分比
      progressSlider.max = String(total);
      progressSlider.value = String(currentIndex);
      const pct = total > 0 ? (currentIndex / total) * 100 : 0;
      progressSlider.style.setProperty('--pct', `${pct.toFixed(2)}%`);
      progressPercentEl.textContent = `${pct.toFixed(1)}%`;

      // 同步七层快捷按钮高亮状态
      layerChips.forEach((chip) => {
        const l = Number(chip.dataset.layer);
        const prevEnd = layerEndIndices[l - 1] || 0;
        const thisEnd = layerEndIndices[l] || 0;
        const isDone = total > 0 && currentIndex >= thisEnd && thisEnd > prevEnd;
        const isCurrent = !done && currentIndex > prevEnd && currentIndex <= thisEnd;
        chip.classList.toggle('done', isDone && !isCurrent);
        chip.classList.toggle('current', isCurrent);
      });
    }

    function advanceTo(targetIdx) {
      while (currentIndex < targetIdx && currentIndex < strokeQueue.length) {
        const action = strokeQueue[currentIndex++];
        executeStrokeAction(action);
        if (shouldCacheAt(currentIndex)) {
          saveCheckpoint(currentIndex);
        }
      }
    }

    function seekToStroke(targetIdx) {
      const total = strokeQueue.length;
      const clamped = clamp(Math.round(targetIdx), 0, total);
      if (clamped === currentIndex) {
        updateStatusUI(getActiveLayerAt(currentIndex), currentIndex >= total && total > 0);
        return;
      }

      if (clamped > currentIndex && clamped - currentIndex <= CHECKPOINT_INTERVAL) {
        advanceTo(clamped);
      } else {
        // 从 <= clamped 的最近离屏快照还原，避免重绘全部 3 万笔造成卡顿
        let bestIdx = 0;
        for (const key of checkpoints.keys()) {
          if (key <= clamped && key > bestIdx) {
            bestIdx = key;
          }
        }
        ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
        if (bestIdx === 0) {
          ctx.drawImage(wallCanvas, 0, 0);
        } else {
          ctx.drawImage(checkpoints.get(bestIdx), 0, 0);
        }
        currentIndex = bestIdx;
        advanceTo(clamped);
      }

      updateStatusUI(getActiveLayerAt(currentIndex), currentIndex >= total && total > 0);
    }

    function pausePlayback() {
      if (animFrameId !== null) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      isPaused = true;
      playPauseBtn.textContent = currentIndex >= strokeQueue.length ? '重播' : '继续';
    }

    function resumePlayback() {
      if (currentIndex >= strokeQueue.length) {
        seekToStroke(0);
      }
      isPaused = false;
      playPauseBtn.textContent = '暂停';
      if (animFrameId === null) {
        animFrameId = requestAnimationFrame(renderLoop);
      }
    }

    function renderLoop() {
      if (isPaused) {
        animFrameId = null;
        return;
      }
      const batch = CONFIG.SPEED_LEVELS[speedIndex].dabsPerFrame;
      let lastLayer = getActiveLayerAt(currentIndex);

      for (let i = 0; i < batch; i++) {
        if (currentIndex >= strokeQueue.length) break;
        const action = strokeQueue[currentIndex++];
        lastLayer = action.layer;
        executeStrokeAction(action);
        if (shouldCacheAt(currentIndex)) {
          saveCheckpoint(currentIndex);
        }
      }

      if (currentIndex < strokeQueue.length) {
        updateStatusUI(lastLayer, false);
        animFrameId = requestAnimationFrame(renderLoop);
      } else {
        animFrameId = null;
        isPaused = true;
        playPauseBtn.textContent = '重播';
        updateStatusUI(7, true);
      }
    }

    // =========================================================================
    // 5. 初始化与页面控制
    // =========================================================================
    function startPainting() {
      if (animFrameId !== null) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      if (seekRafId !== null) {
        cancelAnimationFrame(seekRafId);
        seekRafId = null;
      }

      rng = createPRNG((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
      isPaused = false;
      currentIndex = 0;
      checkpoints.clear();
      playPauseBtn.textContent = '暂停';

      // 铺设敦煌泥壁白粉地仗
      wallCanvas = buildDunhuangWall();
      ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      ctx.drawImage(wallCanvas, 0, 0);

      // 严格按七层敦煌壁画法度生成动作队列并记录分层索引边界
      buildFeitianQueue();
      computeLayerBoundaries();
      updateStatusUI(1, false);

      animFrameId = requestAnimationFrame(renderLoop);
    }

    progressSlider.addEventListener('input', () => {
      pausePlayback();
      pendingSeek = Number(progressSlider.value);
      if (seekRafId === null) {
        seekRafId = requestAnimationFrame(() => {
          seekRafId = null;
          if (pendingSeek !== null) {
            const val = pendingSeek;
            pendingSeek = null;
            seekToStroke(val);
          }
        });
      }
    });

    layerChips.forEach((chip) => {
      chip.addEventListener('click', () => {
        const layerNum = Number(chip.dataset.layer);
        const target = layerEndIndices[layerNum] || 0;
        pausePlayback();
        seekToStroke(target);
      });
    });

    playPauseBtn.addEventListener('click', () => {
      if (isPaused) {
        resumePlayback();
      } else {
        pausePlayback();
      }
    });

    stepBackBtn.addEventListener('click', () => {
      pausePlayback();
      seekToStroke(currentIndex - STEP_DELTA);
    });

    stepForwardBtn.addEventListener('click', () => {
      pausePlayback();
      seekToStroke(currentIndex + STEP_DELTA);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        pausePlayback();
        seekToStroke(currentIndex - (e.shiftKey ? 500 : 50));
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        pausePlayback();
        seekToStroke(currentIndex + (e.shiftKey ? 500 : 50));
      } else if (e.code === 'Space' && document.activeElement?.tagName !== 'BUTTON') {
        e.preventDefault();
        if (isPaused) resumePlayback();
        else pausePlayback();
      }
    });

    redrawBtn.addEventListener('click', () => {
      startPainting();
    });

    speedBtn.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % CONFIG.SPEED_LEVELS.length;
      const level = CONFIG.SPEED_LEVELS[speedIndex];
      speedBtn.textContent = level.label;
      speedBtn.classList.toggle('active', speedIndex > 0);
    });

    downloadBtn.addEventListener('click', () => {
      downloadCanvasPNG();
    });

    // 页面加载后自动铺壁起稿绘制
    startPainting();
  </script>
</body>
</html>

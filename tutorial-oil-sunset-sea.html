<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基础油画·海景日落</title>
</head>
<body>
<script src="./tutorial-engine.js"></script>
<script>
const LAYERS = [
  { id: 1, name: '一 · 暖赭打底与海空构图' },
  { id: 2, name: '二 · 暮霞云层逆光体积感' },
  { id: 3, name: '三 · 深海远岬与波涛明暗' },
  { id: 4, name: '四 · 碎金落日水波与海鸥' }
];

window.Code2PaintTutorial.mount({
  title: '基础油画·海景日落',
  subtitle: '印象派海景四步法（3D大气云海 + 5000笔方向堆彩）：暖色构图 → 逆光立体云霞 → 菲涅耳深海波浪 → 金光波路与飞鸥',
  category: '印象派油画',
  mode: 'oil',
  theme: 'gallery-dark',
  backdropColor: '#261a14',
  width: 1200,
  height: 820,
  seed: 202610,
  fileName: '基础油画海景日落',
  layers: LAYERS,
  buildStrokes(api) {
    const M = window.Code2PaintOilMaster;
    const W = 1200, H = 820, H_Y = 445;
    const scene = M.createScene(W, H, 202610);

    // 1. Atmospheric sunset sky with volumetric self-shadowed backlit dusk clouds & glowing sun disc
    scene.shadeSkyAndClouds({
      horizonY: H_Y,
      skyTop: [34, 46, 88],
      skyMid: [158, 76, 94],
      skyHorizon: [252, 206, 108],
      sunX: 625,
      sunY: 406,
      sunR: 38,
      sunCol: [255, 250, 224],
      glowR: 380,
      glowCol: [255, 198, 96],
      glowStrength: 0.78,
      cloudCover: 0.56,
      cloudScale: 0.0056,
      cloudLitCol: [252, 196, 108],
      cloudDarkCol: [66, 52, 86],
      cloudBot: H_Y * 0.92,
      cloudAlpha: 0.88
    });

    // 2. Distant twilight purple-violet headland along left horizon
    scene.shadeMountainRange({
      baseY: H_Y + 4,
      peaks: [[0, H_Y - 38], [165, H_Y - 58], [320, H_Y - 22], [445, H_Y + 4], [1200, H_Y + 4]],
      sunDirX: 0.65,
      sunDirY: -0.35,
      rockLit: [112, 68, 74],
      rockDark: [44, 38, 62],
      snowLine: 1.5,
      mistCol: [198, 128, 92],
      mistStrength: 0.42,
      ridgeAmp: 22,
      ridgeFreq: 0.012
    });

    // 3. 3D Fresnel ocean with billowing perspective swells & dazzling broken golden sun glitter path
    scene.shadeOcean({
      yTop: H_Y,
      yBot: H,
      seaTop: [72, 68, 94],
      seaMid: [28, 52, 84],
      seaBot: [14, 28, 52],
      sunX: 625,
      sunY: 406,
      glitterCol: [255, 236, 148],
      glitterSpread: 225,
      glitterStrength: 0.96,
      waveScale: 0.024,
      skyMix: 0.34
    });

    // 4. Crisp silhouette soaring seabirds against glowing dusk sky
    scene.draw2D((ctx) => {
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#2a1d24';
      [[345, 196, 1.0], [422, 224, 0.85], [292, 242, 0.72]].forEach(([gx, gy, sc]) => {
        ctx.lineWidth = 4.2 * sc;
        ctx.beginPath();
        ctx.moveTo(gx - 22 * sc, gy + 5 * sc);
        ctx.quadraticCurveTo(gx - 10 * sc, gy - 9 * sc, gx, gy + 2 * sc);
        ctx.quadraticCurveTo(gx + 10 * sc, gy - 10 * sc, gx + 22 * sc, gy + 4 * sc);
        ctx.stroke();
      });
    });

    M.synthesize(api, scene, {
      style: 'impressionist',
      totalStrokes: 5000,
      seed: 202610,
      layers: LAYERS,
      roi: [
        { cx: 625, cy: 420, rx: 140, ry: 90, boost: 3.4 },
        { cx: 625, cy: 615, rx: 195, ry: 165, boost: 3.0 },
        { cx: 350, cy: 215, rx: 120, ry: 55, boost: 2.8 }
      ]
    });
  }
});
</script>
</body>
</html>

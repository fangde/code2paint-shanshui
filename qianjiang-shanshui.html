<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国传统浅绛山水 · Canvas 2D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #e6dfd0;
      color: #2d2b27;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", Georgia, serif;
      padding: 20px 16px;
      user-select: none;
    }

    .scroll-frame {
      background: #efe8d7;
      padding: 14px;
      border: 1px solid #cdc3ad;
      box-shadow: 0 12px 38px rgba(32, 29, 24, 0.14), inset 0 0 0 1px rgba(255, 252, 245, 0.65);
      max-width: 100%;
    }

    #inkCanvas {
      display: block;
      width: min(1120px, 92vw);
      height: auto;
      aspect-ratio: 3 / 2;
      background: #f3ecda;
      border: 1px solid rgba(92, 84, 70, 0.24);
    }

    .toolbar {
      margin-top: 14px;
      width: min(1148px, 92vw);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 4px;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
      color: #4b4842;
      letter-spacing: 0.08em;
    }

    .status-layer {
      font-weight: 600;
      color: #252421;
    }

    .status-count {
      font-size: 12px;
      color: #6d6961;
      font-variant-numeric: tabular-nums;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      appearance: none;
      background: #f6f0e3;
      color: #272522;
      border: 1px solid #9f9684;
      padding: 7px 18px;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #ebe2ce;
      border-color: #5a544a;
    }

    button:active {
      transform: translateY(1px);
    }

    button.active {
      background: #303234;
      color: #f4eee0;
      border-color: #303234;
    }

    a.home-link {
      display: inline-block;
      background: #f6f0e3;
      color: #272522;
      border: 1px solid #9f9684;
      padding: 7px 14px;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    a.home-link:hover {
      background: #ebe2ce;
      border-color: #5a544a;
    }
  </style>
</head>
<body>
  <div class="scroll-frame">
    <canvas id="inkCanvas" width="1200" height="800"></canvas>
  </div>

  <div class="toolbar">
    <div class="status-group">
      <span id="layerStatus" class="status-layer">铺展宣纸…</span>
      <span id="strokeStatus" class="status-count">0 / 0 笔</span>
    </div>
    <div class="btn-group">
      <button id="redrawBtn" type="button">重新绘制</button>
      <button id="speedBtn" type="button">加速</button>
      <a class="home-link" href="./index.html">← 回画廊首页</a>
    </div>
  </div>

  <script>
    // =========================================================================
    // 顶部常量、墨色、浅绛淡彩与笔刷参数配置区（统一管理，方便调整）
    // =========================================================================
    const CONFIG = {
      // 画布尺寸（3:2 经典国画横幅比例）
      CANVAS_WIDTH: 1200,
      CANVAS_HEIGHT: 800,

      // 总笔触硬上限（严格控制在 14000 笔以内，确保流畅不卡顿）
      MAX_STROKES: 13800,

      // 宣纸基底参数（淡米黄底色 + 随机颗粒噪点 + 细微纤维丝）
      PAPER: {
        BASE_COLOR: '#f3ecda',                       // 淡米黄生宣底色
        EDGE_VIGNETTE: 'rgba(180, 165, 136, 0.17)',  // 纸缘温润微晕
        NOISE_INTENSITY: 7,                          // 宣纸细微颗粒噪点强度
        FIBER_COUNT: 700,                            // 宣纸随机纤维数量
        FIBER_ALPHA_MIN: 0.025,
        FIBER_ALPHA_MAX: 0.065
      },

      // 墨分五色（墨骨主体：焦、浓、重、淡、清）
      INK: {
        JIAO:  { rgb: [18, 19, 20],   baseAlpha: 0.90 }, // 焦墨：点苔、枯笔提神
        NONG:  { rgb: [34, 36, 38],   baseAlpha: 0.72 }, // 浓墨：近景山石、树干
        ZHONG: { rgb: [58, 61, 64],   baseAlpha: 0.44 }, // 中墨：披麻皴山石纹理
        DAN:   { rgb: [92, 96, 100],  baseAlpha: 0.24 }, // 淡墨：勾勒山体轮廓坡岸
        QING:  { rgb: [126, 130, 134], baseAlpha: 0.10 } // 极淡墨：远山朦胧晕染
      },

      // 浅绛淡彩色系（低饱和、轻薄通透，配合 multiply 正片叠底绝不盖住墨骨）
      PIGMENT: {
        ZHE_SHI:       { rgb: [176, 128, 92],  baseAlpha: 0.105 }, // 赭石：暖土淡赭，罩染山石向阳面与坡土
        ZHE_SHI_LIGHT: { rgb: [188, 146, 112], baseAlpha: 0.075 }, // 淡赭：轻薄过渡，用于树干与远坡阳面
        HUA_QING:      { rgb: [86, 112, 130],  baseAlpha: 0.095 }, // 花青：清雅石青靛，罩染背阴山谷与远山
        HUA_QING_MIST: { rgb: [108, 130, 144], baseAlpha: 0.060 }  // 淡花青：空灵水气，极轻罩染远峰与近岸水影
      },

      // 毛笔笔刷动力学参数
      BRUSH: {
        SOFTNESS: 0.55,          // 径向渐变中心实度（越小边缘越柔）
        BLEED_SCALE: 1.58,       // 生宣洇染外晕扩散倍数
        BLEED_ALPHA_RATIO: 0.30, // 洇染外晕透明度占比
        DRY_BRISTLES: 5,         // 枯笔飞白分叉毫数
        DRY_SKIP_BASE: 0.42,     // 飞白留白基础概率
        PRESSURE_JITTER: 0.14    // 行笔压力自然微颤
      },

      // 动画速度档位（每帧执行笔触数）
      SPEED_LEVELS: [
        { label: '加速',    dabsPerFrame: 16 },
        { label: '加速 ×3', dabsPerFrame: 48 },
        { label: '加速 ×8', dabsPerFrame: 128 }
      ],

      // 六层国画作画阶段名称
      LAYER_NAMES: [
        '',
        '第一层：极淡墨 · 远山晕染',
        '第二层：中淡墨 · 勾勒山体轮廓坡岸',
        '第三层：中墨 · 披麻皴山石纹理',
        '第四层：浓墨 · 近景山石与杂树主干',
        '第五层：焦墨 · 点苔、小树与枯笔细节',
        '第六层：淡彩罩染 · 赭石向阳、花青染阴'
      ]
    };

    // 合并墨色与淡彩查找表，供笔刷引擎统一索引
    const PALETTE = Object.assign({}, CONFIG.INK, CONFIG.PIGMENT);

    // =========================================================================
    // 全局状态与 DOM 元素
    // =========================================================================
    const canvas = document.getElementById('inkCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: false });
    const layerStatusEl = document.getElementById('layerStatus');
    const strokeStatusEl = document.getElementById('strokeStatus');
    const redrawBtn = document.getElementById('redrawBtn');
    const speedBtn = document.getElementById('speedBtn');

    let paperCanvas = null;      // 离屏宣纸缓存
    let strokeQueue = [];        // 严格按六层顺序排列的笔触动作队列
    let currentIndex = 0;        // 当前绘制进度
    let speedIndex = 0;          // 当前加速档位
    let animFrameId = null;      // requestAnimationFrame ID
    let hasDownloaded = false;   // 自动下载防重复标志
    let rng = Math.random;       // 当前画作伪随机数生成器

    // =========================================================================
    // 数学、随机与分形噪声工具
    // =========================================================================
    function createPRNG(seed) {
      let s = seed >>> 0;
      return function () {
        s += 0x6D2B79F5;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function randRange(min, max) {
      return min + (max - min) * rng();
    }

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // 1D 平滑分形噪声（用于自然山势与石廓起伏）
    function createNoise1D(tableSize = 256) {
      const table = new Float32Array(tableSize);
      for (let i = 0; i < tableSize; i++) {
        table[i] = rng();
      }
      function sample(x) {
        const xi = Math.floor(x);
        const xf = x - xi;
        const u = xf * xf * (3 - 2 * xf);
        const i0 = ((xi % tableSize) + tableSize) % tableSize;
        const i1 = (i0 + 1) % tableSize;
        return lerp(table[i0], table[i1], u);
      }
      return function fbm(x, octaves = 4) {
        let value = 0;
        let amp = 0.5;
        let freq = 1;
        let norm = 0;
        for (let o = 0; o < octaves; o++) {
          value += sample(x * freq) * amp;
          norm += amp;
          amp *= 0.5;
          freq *= 2.03;
        }
        return value / norm;
      };
    }

    // =========================================================================
    // 1. 宣纸基底生成（淡米黄底色 + 细微随机噪点 + 宣纸纤维肌理）
    // =========================================================================
    function buildXuanPaper() {
      const off = document.createElement('canvas');
      off.width = CONFIG.CANVAS_WIDTH;
      off.height = CONFIG.CANVAS_HEIGHT;
      const octx = off.getContext('2d');
      const w = off.width;
      const h = off.height;

      // 淡米黄底色
      octx.fillStyle = CONFIG.PAPER.BASE_COLOR;
      octx.fillRect(0, 0, w, h);

      // 纸面温润光感与边缘微晕
      const vignette = octx.createRadialGradient(w * 0.46, h * 0.48, w * 0.16, w * 0.5, h * 0.5, w * 0.72);
      vignette.addColorStop(0, 'rgba(255, 252, 244, 0.20)');
      vignette.addColorStop(1, CONFIG.PAPER.EDGE_VIGNETTE);
      octx.fillStyle = vignette;
      octx.fillRect(0, 0, w, h);

      // 像素级随机噪点（模拟生宣纸面细微颗粒）
      const imgData = octx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const amp = CONFIG.PAPER.NOISE_INTENSITY;
      for (let i = 0; i < data.length; i += 4) {
        const delta = (rng() - 0.5) * 2 * amp;
        data[i]     = clamp(data[i] + delta, 0, 255);
        data[i + 1] = clamp(data[i + 1] + delta * 0.96, 0, 255);
        data[i + 2] = clamp(data[i + 2] + delta * 0.88, 0, 255);
      }
      octx.putImageData(imgData, 0, 0);

      // 细微宣纸纤维丝肌理
      octx.save();
      octx.lineCap = 'round';
      for (let i = 0; i < CONFIG.PAPER.FIBER_COUNT; i++) {
        const fx = rng() * w;
        const fy = rng() * h;
        const len = randRange(8, 35);
        const ang = randRange(-Math.PI, Math.PI);
        const bend = randRange(-6, 6);
        const alpha = randRange(CONFIG.PAPER.FIBER_ALPHA_MIN, CONFIG.PAPER.FIBER_ALPHA_MAX);
        const tone = rng() > 0.45 ? '154, 142, 120' : '255, 252, 244';

        octx.strokeStyle = `rgba(${tone}, ${alpha.toFixed(4)})`;
        octx.lineWidth = randRange(0.4, 1.15);
        octx.beginPath();
        octx.moveTo(fx, fy);
        octx.quadraticCurveTo(
          fx + Math.cos(ang) * len * 0.5 + bend,
          fy + Math.sin(ang) * len * 0.5 - bend,
          fx + Math.cos(ang) * len,
          fy + Math.sin(ang) * len
        );
        octx.stroke();
      }
      octx.restore();

      return off;
    }

    // =========================================================================
    // 2. 毛笔笔刷引擎（软边径向渐变 + 墨分五色 + 生宣洇染 + 枯笔飞白 + 透明罩染）
    // =========================================================================
    function drawSoftRadialDab(targetCtx, x, y, radius, rgb, alpha, angle, aspect, softness, compositeOp) {
      if (radius <= 0.3 || alpha <= 0.002) return;
      targetCtx.save();
      if (compositeOp && compositeOp !== 'source-over') {
        targetCtx.globalCompositeOperation = compositeOp;
      }
      targetCtx.translate(x, y);
      if (angle) targetCtx.rotate(angle);
      if (aspect && aspect !== 1) targetCtx.scale(aspect, 1);

      const grad = targetCtx.createRadialGradient(0, 0, 0, 0, 0, radius);
      const [r, g, b] = rgb;
      const midStop = clamp(softness, 0.14, 0.82);

      grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha.toFixed(4)})`);
      grad.addColorStop(midStop, `rgba(${r}, ${g}, ${b}, ${(alpha * 0.60).toFixed(4)})`);
      grad.addColorStop(lerp(midStop, 1, 0.55), `rgba(${r}, ${g}, ${b}, ${(alpha * 0.18).toFixed(4)})`);
      grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

      targetCtx.fillStyle = grad;
      targetCtx.beginPath();
      targetCtx.arc(0, 0, radius, 0, Math.PI * 2);
      targetCtx.fill();
      targetCtx.restore();
    }

    /**
     * 执行单笔动作
     * 第六层淡彩默认使用 multiply（正片叠底）通透罩染，绝不遮盖底层墨骨
     */
    function executeStrokeAction(action) {
      const colorDef = PALETTE[action.ink] || CONFIG.INK.ZHONG;
      const pressure = action.pressure ?? 1;
      const alpha = clamp(colorDef.baseAlpha * (action.alphaScale ?? 1) * pressure, 0.004, 0.96);
      const radius = Math.max(0.6, action.r * (0.7 + 0.3 * pressure));
      const angle = action.angle ?? 0;
      const aspect = action.aspect ?? 1;
      const bleed = action.bleed ?? 0;
      const dryness = action.dryness ?? 0;
      const softness = action.softness ?? CONFIG.BRUSH.SOFTNESS;
      const compositeOp = action.composite || (action.layer === 6 ? 'multiply' : 'source-over');

      // 生宣洇染：宽柔水晕先行渗开
      if (bleed > 0.02) {
        const bleedR = radius * (1 + (CONFIG.BRUSH.BLEED_SCALE - 1) * bleed);
        const bleedAlpha = alpha * CONFIG.BRUSH.BLEED_ALPHA_RATIO * bleed;
        drawSoftRadialDab(
          ctx,
          action.x + (action.bx ?? 0),
          action.y + (action.by ?? 0),
          bleedR,
          colorDef.rgb,
          bleedAlpha,
          angle,
          aspect * 1.06,
          0.30,
          compositeOp
        );
      }

      // 枯笔飞白：笔毫分叉并按干涩程度随机留白
      if (dryness > 0.15) {
        const bristles = CONFIG.BRUSH.DRY_BRISTLES;
        const perpX = -Math.sin(angle);
        const perpY = Math.cos(angle);
        const seedHash = Math.abs(Math.sin(action.x * 12.9898 + action.y * 78.233) * 43758.5453);

        for (let i = 0; i < bristles; i++) {
          const h = (seedHash * (i + 1.37)) % 1;
          if (h < dryness * (CONFIG.BRUSH.DRY_SKIP_BASE + 0.35)) continue;

          const offsetRatio = (i / (bristles - 1) - 0.5) * 1.45;
          const ox = perpX * radius * offsetRatio;
          const oy = perpY * radius * offsetRatio;
          const subR = Math.max(0.7, radius * (0.30 + 0.16 * (1 - Math.abs(offsetRatio))));
          const subAlpha = alpha * (0.55 + 0.45 * (1 - dryness * 0.45));

          drawSoftRadialDab(
            ctx,
            action.x + ox,
            action.y + oy,
            subR,
            colorDef.rgb,
            subAlpha,
            angle,
            Math.max(1.25, aspect * 1.35),
            0.48,
            compositeOp
          );
        }
        return;
      }

      // 常规湿润软边笔触 / 淡彩透明罩染
      drawSoftRadialDab(
        ctx,
        action.x,
        action.y,
        radius,
        colorDef.rgb,
        alpha,
        angle,
        aspect,
        softness,
        compositeOp
      );
    }

    // =========================================================================
    // 队列压入与路径行笔采样工具
    // =========================================================================
    function pushAction(action) {
      if (strokeQueue.length >= CONFIG.MAX_STROKES) return false;
      strokeQueue.push(action);
      return true;
    }

    function enqueueBrushPath(points, opts) {
      if (!points || points.length < 2) return;
      const {
        layer,
        ink = 'ZHONG',
        radiusStart = 6,
        radiusEnd = 4,
        alphaScale = 1,
        spacing = 0.44,
        bleed = 0.15,
        dryness = 0,
        aspect = 1.25,
        softness = CONFIG.BRUSH.SOFTNESS,
        breakProb = 0,
        jitter = 0.8,
        taperEnds = true,
        composite = null
      } = opts;

      const segLens = [];
      let totalLen = 0;
      for (let i = 1; i < points.length; i++) {
        const len = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
        segLens.push(len);
        totalLen += len;
      }
      if (totalLen < 1) return;

      let distAccum = 0;
      let skipCounter = 0;

      for (let i = 1; i < points.length; i++) {
        const p0 = points[i - 1];
        const p1 = points[i];
        const segLen = segLens[i - 1];
        if (segLen < 0.1) continue;

        const angle = Math.atan2(p1.y - p0.y, p1.x - p0.x);
        const avgR = lerp(radiusStart, radiusEnd, (distAccum + segLen * 0.5) / totalLen);
        const step = Math.max(1.8, avgR * spacing);
        const steps = Math.max(1, Math.ceil(segLen / step));

        for (let s = 0; s <= steps; s++) {
          const localT = s / steps;
          const globalT = clamp((distAccum + segLen * localT) / totalLen, 0, 1);

          // 断续笔触：行笔途中偶发提笔断开
          if (breakProb > 0) {
            if (skipCounter > 0) {
              skipCounter--;
              continue;
            }
            if (globalT > 0.12 && globalT < 0.88 && rng() < breakProb) {
              skipCounter = Math.floor(randRange(1, 3.6));
              continue;
            }
          }

          let env = 1;
          if (taperEnds) {
            env = 0.28 + 0.72 * Math.pow(Math.sin(globalT * Math.PI), 0.55);
          }

          const pressure = clamp(
            env * (1 + (rng() - 0.5) * 2 * CONFIG.BRUSH.PRESSURE_JITTER),
            0.2,
            1.25
          );

          const inkDepletion = 1 - globalT * 0.20;
          const localDry = clamp(dryness + globalT * dryness * 0.35, 0, 0.92);
          const r = lerp(radiusStart, radiusEnd, globalT);

          const ok = pushAction({
            layer,
            ink,
            x: lerp(p0.x, p1.x, localT) + (rng() - 0.5) * jitter,
            y: lerp(p0.y, p1.y, localT) + (rng() - 0.5) * jitter,
            r,
            angle,
            aspect,
            pressure,
            alphaScale: alphaScale * inkDepletion,
            bleed,
            dryness: localDry,
            softness,
            composite,
            bx: bleed > 0 ? (rng() - 0.5) * r * 0.42 : 0,
            by: bleed > 0 ? (rng() - 0.5) * r * 0.42 : 0
          });
          if (!ok) return;
        }
        distAccum += segLen;
      }
    }

    // =========================================================================
    // 3. 严格六层传统浅绛山水构图与动作队列生成
    //    光源设定：柔和天光自左上斜照，故山石顶部/左侧偏向阳（薄罩赭石），
    //    右侧山谷、石底背阴、远山及近岸水影偏阴冷（薄罩花青），左下角大片留白。
    // =========================================================================
    function buildPaintingQueue() {
      strokeQueue = [];
      const W = CONFIG.CANVAS_WIDTH;
      const H = CONFIG.CANVAS_HEIGHT;
      const noise = createNoise1D(256);

      // 缓存各层山体、山坡、石块与树木几何骨架，供后续墨骨与第六层淡彩精准罩染
      const distantPeaks = [];
      const midSlopes = [];
      const foregroundRocks = [];
      const treeTrunks = [];
      const treeTips = [];

      // -----------------------------------------------------------------------
      // 第一层：极淡墨（清墨），晕染远山，朦胧虚化
      // -----------------------------------------------------------------------
      const distantSpecs = [
        {
          xStart: W * 0.13, xEnd: W * 0.65,
          baseY: H * 0.43, peakHeight: H * 0.165,
          peakCenter: 0.43, noiseOffset: 13.7,
          ink: 'QING', alpha: 0.62, washDepth: H * 0.13
        },
        {
          xStart: W * 0.40, xEnd: W * 0.95,
          baseY: H * 0.45, peakHeight: H * 0.195,
          peakCenter: 0.56, noiseOffset: 41.2,
          ink: 'QING', alpha: 0.84, washDepth: H * 0.14
        },
        {
          xStart: W * 0.68, xEnd: W * 1.02,
          baseY: H * 0.39, peakHeight: H * 0.125,
          peakCenter: 0.50, noiseOffset: 79.6,
          ink: 'QING', alpha: 0.50, washDepth: H * 0.10
        }
      ];

      distantSpecs.forEach((spec) => {
        const samples = 52;
        const ridge = [];
        for (let i = 0; i <= samples; i++) {
          const t = i / samples;
          const x = lerp(spec.xStart, spec.xEnd, t);
          const bell = Math.pow(Math.sin(t * Math.PI), 1.35);
          const skew = Math.exp(-Math.pow((t - spec.peakCenter) * 2.5, 2));
          const n = noise(t * 4.1 + spec.noiseOffset, 4);
          const elev = spec.peakHeight * (0.45 * bell + 0.55 * skew * bell) * (0.65 + 0.65 * n);
          ridge.push({ x, y: spec.baseY - elev, t, bell });
        }
        distantPeaks.push({ ridge, spec });

        // 由山脊向下层层清墨晕染，山脚淡入云岚留白
        const washRows = 5;
        for (let row = 0; row < washRows; row++) {
          const rowRatio = row / (washRows - 1);
          const rowPts = [];
          for (let i = 0; i < ridge.length; i += 2) {
            const p = ridge[i];
            const drop = rowRatio * spec.washDepth * (0.45 + 0.65 * p.bell);
            rowPts.push({
              x: p.x + (rng() - 0.5) * 6,
              y: p.y + drop + (rng() - 0.5) * 4
            });
          }
          enqueueBrushPath(rowPts, {
            layer: 1,
            ink: spec.ink,
            radiusStart: lerp(14, 34, rowRatio),
            radiusEnd: lerp(12, 30, rowRatio),
            alphaScale: spec.alpha * (1 - rowRatio * 0.72),
            spacing: 0.60,
            bleed: 0.92,
            dryness: 0,
            aspect: 1.55,
            softness: 0.24,
            jitter: 5.5,
            taperEnds: true
          });
        }
      });

      // -----------------------------------------------------------------------
      // 第二层：中淡墨（淡墨），勾勒中景平缓山坡、远岸汀洲与近景坡岸
      // -----------------------------------------------------------------------
      const slopeSpecs = [
        {
          xStart: W * 0.35, xEnd: W * 0.99,
          yStart: H * 0.615, yEnd: H * 0.445,
          arch: H * 0.088, noiseOffset: 108.4,
          depth: H * 0.145, ink: 'DAN', isMainMid: true
        },
        {
          xStart: W * 0.52, xEnd: W * 1.01,
          yStart: H * 0.545, yEnd: H * 0.408,
          arch: H * 0.062, noiseOffset: 147.9,
          depth: H * 0.095, ink: 'DAN', isMainMid: false
        },
        {
          // 远岸平缓沙洲（点缀中左水际，不侵入左下大片留白）
          xStart: W * 0.15, xEnd: W * 0.36,
          yStart: H * 0.545, yEnd: H * 0.560,
          arch: H * 0.015, noiseOffset: 201.3,
          depth: H * 0.025, ink: 'DAN', isSandbar: true
        }
      ];

      slopeSpecs.forEach((sp) => {
        const samples = sp.isSandbar ? 22 : 44;
        const ridge = [];
        for (let i = 0; i <= samples; i++) {
          const t = i / samples;
          const x = lerp(sp.xStart, sp.xEnd, t);
          const baseLine = lerp(sp.yStart, sp.yEnd, t);
          const curve = Math.sin(t * Math.PI);
          const n = noise(t * 3.5 + sp.noiseOffset, 4);
          const y = baseLine - sp.arch * curve * (0.55 + 0.7 * n);
          ridge.push({ x, y, t });
        }
        midSlopes.push({ ridge, spec: sp });

        // 勾勒山坡轮廓
        enqueueBrushPath(ridge, {
          layer: 2,
          ink: sp.ink,
          radiusStart: sp.isSandbar ? 2.4 : 3.2,
          radiusEnd: sp.isSandbar ? 2.0 : 4.8,
          alphaScale: sp.isSandbar ? 0.65 : 0.95,
          spacing: 0.48,
          bleed: 0.35,
          dryness: sp.isSandbar ? 0.16 : 0.08,
          aspect: 1.35,
          breakProb: 0.04,
          jitter: 1.1
        });

        // 侧锋轻染坡面底韵
        const washLayers = sp.isSandbar ? 1 : 3;
        for (let wRow = 0; wRow < washLayers; wRow++) {
          const ratio = (wRow + 0.5) / washLayers;
          const washPts = ridge
            .filter((_, idx) => idx % 2 === 0)
            .map((p) => ({
              x: p.x + ratio * 10,
              y: p.y + ratio * sp.depth * (0.4 + 0.6 * Math.sin(p.t * Math.PI))
            }));
          enqueueBrushPath(washPts, {
            layer: 2,
            ink: 'QING',
            radiusStart: sp.isSandbar ? 6 : lerp(12, 22, ratio),
            radiusEnd: sp.isSandbar ? 5 : lerp(16, 26, ratio),
            alphaScale: sp.isSandbar ? 0.55 : (0.76 - ratio * 0.34),
            spacing: 0.64,
            bleed: 0.78,
            aspect: 1.75,
            softness: 0.28,
            jitter: 3.5
          });
        }
      });

      // 近景右下角坡岸轮廓（严格止于 0.52W 以右，守护左下大片空白）
      const fgBankRidge = [];
      for (let i = 0; i <= 32; i++) {
        const t = i / 32;
        const x = lerp(W * 0.53, W * 0.99, t);
        const y = lerp(H * 0.855, H * 0.685, Math.pow(t, 0.85))
                - Math.sin(t * Math.PI) * H * 0.045 * (0.6 + 0.6 * noise(t * 4.4 + 245, 3));
        fgBankRidge.push({ x, y, t });
      }
      enqueueBrushPath(fgBankRidge, {
        layer: 2,
        ink: 'DAN',
        radiusStart: 3.2,
        radiusEnd: 5.2,
        alphaScale: 1.0,
        spacing: 0.46,
        bleed: 0.32,
        aspect: 1.4,
        breakProb: 0.03,
        jitter: 1.2
      });

      // -----------------------------------------------------------------------
      // 第三层：中墨，披麻皴表现山石纹理
      // -----------------------------------------------------------------------
      midSlopes.forEach(({ ridge, spec }) => {
        if (spec.isSandbar) return;
        const cunCount = spec.isMainMid ? 50 : 26;
        for (let c = 0; c < cunCount; c++) {
          const t = randRange(0.06, 0.95);
          const idx = Math.min(ridge.length - 2, Math.floor(t * (ridge.length - 1)));
          const p = ridge[idx];
          const pNext = ridge[idx + 1];
          const slopeAngle = Math.atan2(pNext.y - p.y, pNext.x - p.x);

          const flowAngle = slopeAngle + randRange(0.32, 0.68) * (rng() > 0.2 ? 1 : -0.6);
          const startDrop = randRange(2, spec.depth * 0.42);
          const strokeLen = randRange(36, spec.isMainMid ? 112 : 74) * (0.55 + 0.55 * Math.sin(t * Math.PI));

          const pts = [];
          const segs = 6;
          const sx = p.x + randRange(-8, 8);
          const sy = p.y + startDrop;
          const curveBias = randRange(-0.18, 0.18);

          for (let s = 0; s <= segs; s++) {
            const st = s / segs;
            const curAng = flowAngle + curveBias * st + (noise(c * 2.1 + st * 2.5, 2) - 0.5) * 0.28;
            const dist = st * strokeLen;
            pts.push({
              x: sx - Math.cos(curAng) * dist * 0.85,
              y: sy + Math.abs(Math.sin(curAng)) * dist * 0.72 + st * 14
            });
          }

          const isDry = rng() > 0.62;
          enqueueBrushPath(pts, {
            layer: 3,
            ink: rng() > 0.28 ? 'ZHONG' : 'DAN',
            radiusStart: randRange(1.8, 3.6),
            radiusEnd: randRange(1.0, 2.2),
            alphaScale: randRange(0.46, 0.88),
            spacing: 0.70,
            bleed: isDry ? 0.08 : 0.26,
            dryness: isDry ? randRange(0.28, 0.54) : 0,
            aspect: 1.65,
            breakProb: 0.06,
            jitter: 1.0
          });
        }
      });

      // 近景右下坡岸披麻皴山骨
      for (let c = 0; c < 28; c++) {
        const t = randRange(0.08, 0.94);
        const idx = Math.min(fgBankRidge.length - 1, Math.floor(t * (fgBankRidge.length - 1)));
        const p = fgBankRidge[idx];
        const sx = p.x + randRange(-12, 12);
        const sy = p.y + randRange(4, 38);
        const len = randRange(34, 82);
        const pts = [];
        for (let s = 0; s <= 5; s++) {
          const st = s / 5;
          pts.push({
            x: sx - st * len * randRange(0.55, 0.85),
            y: sy + st * len * randRange(0.32, 0.56) + Math.sin(st * Math.PI) * randRange(-5, 6)
          });
        }
        enqueueBrushPath(pts, {
          layer: 3,
          ink: 'ZHONG',
          radiusStart: randRange(2.2, 4.2),
          radiusEnd: randRange(1.2, 2.5),
          alphaScale: randRange(0.58, 0.90),
          spacing: 0.68,
          bleed: 0.20,
          dryness: rng() > 0.55 ? randRange(0.25, 0.52) : 0,
          aspect: 1.6,
          breakProb: 0.05,
          jitter: 1.2
        });
      }

      // -----------------------------------------------------------------------
      // 第四层：浓墨，近景石头、树木主干
      // -----------------------------------------------------------------------
      const rockDefinitions = [
        { cx: W * 0.63, cy: H * 0.82, rx: 66, ry: 34, tilt: -0.14 },
        { cx: W * 0.74, cy: H * 0.78, rx: 92, ry: 48, tilt: -0.08 },
        { cx: W * 0.86, cy: H * 0.74, rx: 88, ry: 54, tilt: -0.12 },
        { cx: W * 0.57, cy: H * 0.855, rx: 42, ry: 20, tilt: 0.06 },
        { cx: W * 0.80, cy: H * 0.855, rx: 74, ry: 34, tilt: 0.05 },
        { cx: W * 0.93, cy: H * 0.82, rx: 64, ry: 42, tilt: -0.05 }
      ];

      rockDefinitions.forEach((rk, rIdx) => {
        const topContour = [];
        const bottomContour = [];
        const steps = 16;
        for (let i = 0; i <= steps; i++) {
          const u = i / steps;
          const ang = lerp(Math.PI * 1.08, -Math.PI * 0.06, u);
          const n = 0.78 + 0.36 * noise(u * 3.8 + rIdx * 17.3, 3);
          const lx = Math.cos(ang) * rk.rx * n;
          const ly = Math.sin(ang) * rk.ry * n;
          const rx = lx * Math.cos(rk.tilt) - ly * Math.sin(rk.tilt);
          const ry = lx * Math.sin(rk.tilt) + ly * Math.cos(rk.tilt);
          topContour.push({ x: rk.cx + rx, y: rk.cy + ry });
        }
        for (let i = 0; i <= 10; i++) {
          const u = i / 10;
          const ang = lerp(0.05, Math.PI * 0.92, u);
          const n = 0.82 + 0.28 * noise(u * 3.1 + rIdx * 29.1, 2);
          bottomContour.push({
            x: rk.cx + Math.cos(ang) * rk.rx * 0.92 * n,
            y: rk.cy + Math.sin(ang) * rk.ry * 0.62 * n
          });
        }

        foregroundRocks.push({ rk, topContour, bottomContour });

        // 浓墨勾石外轮廓
        enqueueBrushPath(topContour, {
          layer: 4,
          ink: 'NONG',
          radiusStart: 3.4,
          radiusEnd: 4.6,
          alphaScale: 0.95,
          spacing: 0.44,
          bleed: 0.22,
          dryness: 0.14,
          aspect: 1.35,
          breakProb: 0.04,
          jitter: 1.2
        });

        // 石脚背阴轮廓
        enqueueBrushPath(bottomContour, {
          layer: 4,
          ink: 'NONG',
          radiusStart: 4.5,
          radiusEnd: 3.0,
          alphaScale: 0.78,
          spacing: 0.52,
          bleed: 0.34,
          aspect: 1.5,
          jitter: 1.6
        });

        // 石块背阴侧锋皴擦（保留石顶向阳面供第六层赭石罩染）
        for (let s = 0; s < 8; s++) {
          const idx = Math.floor(randRange(topContour.length * 0.38, topContour.length - 1));
          const startPt = topContour[idx];
          const len = randRange(rk.ry * 0.45, rk.ry * 1.15);
          const pts = [
            { x: startPt.x - randRange(2, 8), y: startPt.y + randRange(4, 12) },
            { x: startPt.x - len * 0.35, y: startPt.y + len * 0.55 },
            { x: startPt.x - len * 0.65, y: startPt.y + len * 0.92 }
          ];
          enqueueBrushPath(pts, {
            layer: 4,
            ink: s % 2 === 0 ? 'NONG' : 'ZHONG',
            radiusStart: randRange(3.2, 5.6),
            radiusEnd: randRange(1.6, 3.0),
            alphaScale: randRange(0.42, 0.74),
            spacing: 0.60,
            bleed: 0.24,
            dryness: s % 3 === 0 ? 0.36 : 0.08,
            aspect: 1.6,
            jitter: 1.5
          });
        }
      });

      // 近景杂树主干与枝桠（浓墨）
      function buildTreeBranch(x, y, angle, length, width, depth, maxDepth, leanBias) {
        const segs = Math.max(4, Math.floor(length / 11));
        const pts = [{ x, y }];
        let cx = x;
        let cy = y;
        let curAng = angle;

        for (let i = 1; i <= segs; i++) {
          curAng += (rng() - 0.5) * 0.24 + leanBias * 0.035;
          const stepLen = length / segs;
          cx += Math.cos(curAng) * stepLen;
          cy += Math.sin(curAng) * stepLen;
          pts.push({ x: cx, y: cy });
        }

        const isTrunk = depth === 0;
        if (isTrunk) {
          treeTrunks.push({ pts, width });
        }

        enqueueBrushPath(pts, {
          layer: 4,
          ink: 'NONG',
          radiusStart: width,
          radiusEnd: Math.max(1.1, width * 0.62),
          alphaScale: isTrunk ? 0.98 : 0.88,
          spacing: 0.44,
          bleed: isTrunk ? 0.16 : 0.10,
          dryness: isTrunk ? 0.22 : 0.14,
          aspect: 1.32,
          breakProb: depth > 1 ? 0.04 : 0.01,
          jitter: isTrunk ? 0.9 : 0.6,
          taperEnds: !isTrunk
        });

        if (depth >= maxDepth) {
          treeTips.push({ x: cx, y: cy, scale: width, angle: curAng });
          return;
        }

        const branchCount = depth === 0 ? 3 : 2;
        for (let b = 0; b < branchCount; b++) {
          const attachRatio = depth === 0
            ? lerp(0.48, 0.96, b / (branchCount - 1))
            : lerp(0.58, 1.0, b / Math.max(1, branchCount - 1));
          const attachIdx = Math.min(pts.length - 1, Math.floor(attachRatio * (pts.length - 1)));
          const origin = pts[attachIdx];

          const side = b % 2 === 0 ? -1 : 1;
          const spread = depth === 0 ? randRange(0.32, 0.66) : randRange(0.28, 0.58);
          const childAng = curAng + side * spread + leanBias * 0.12;
          const childLen = length * randRange(0.54, 0.72);
          const childWidth = Math.max(1.1, width * randRange(0.55, 0.68));

          buildTreeBranch(origin.x, origin.y, childAng, childLen, childWidth, depth + 1, maxDepth, leanBias);
        }

        treeTips.push({ x: cx, y: cy, scale: width * 0.9, angle: curAng });
      }

      const foregroundTrees = [
        { x: W * 0.745, y: H * 0.755, angle: -Math.PI / 2 - 0.18, len: 132, width: 6.4, maxDepth: 2, lean: -0.22 },
        { x: W * 0.795, y: H * 0.768, angle: -Math.PI / 2 + 0.08, len: 98,  width: 4.8, maxDepth: 2, lean: 0.10 },
        { x: W * 0.655, y: H * 0.795, angle: -Math.PI / 2 - 0.36, len: 74,  width: 3.6, maxDepth: 2, lean: -0.30 },
        { x: W * 0.885, y: H * 0.725, angle: -Math.PI / 2 + 0.14, len: 108, width: 5.0, maxDepth: 2, lean: 0.12 }
      ];

      foregroundTrees.forEach((tr) => {
        buildTreeBranch(tr.x, tr.y, tr.angle, tr.len, tr.width, 0, tr.maxDepth, tr.lean);
      });

      // -----------------------------------------------------------------------
      // 第五层：焦墨，点苔、小树、近处细节与少量飞白枯笔
      // -----------------------------------------------------------------------
      // 5.1 杂树焦墨点叶
      treeTips.forEach((tip) => {
        const clusterCount = Math.floor(randRange(9, 16));
        for (let i = 0; i < clusterCount; i++) {
          const dist = randRange(2, 34);
          const ang = randRange(-Math.PI, Math.PI);
          const isJiao = rng() > 0.36;
          pushAction({
            layer: 5,
            ink: isJiao ? 'JIAO' : 'NONG',
            x: tip.x + Math.cos(ang) * dist * 1.25,
            y: tip.y + Math.sin(ang) * dist * 0.72,
            r: randRange(2.4, 5.2),
            angle: randRange(-0.55, 0.55),
            aspect: randRange(1.5, 2.4),
            pressure: randRange(0.65, 1.12),
            alphaScale: isJiao ? randRange(0.72, 0.98) : randRange(0.55, 0.82),
            bleed: rng() > 0.65 ? 0.22 : 0.06,
            dryness: rng() > 0.78 ? 0.38 : 0,
            softness: 0.52
          });
        }
      });

      // 5.2 中景平缓山坡上的远眺小树
      const mainMidSlope = midSlopes.find((m) => m.spec.isMainMid);
      if (mainMidSlope) {
        [0.24, 0.27, 0.62, 0.66, 0.70].forEach((tPos) => {
          const idx = Math.floor(tPos * (mainMidSlope.ridge.length - 1));
          const base = mainMidSlope.ridge[idx];
          const h = randRange(14, 24);
          const tilt = randRange(-0.18, 0.18);

          enqueueBrushPath(
            [
              { x: base.x, y: base.y + 3 },
              { x: base.x + Math.sin(tilt) * h, y: base.y - h }
            ],
            {
              layer: 5,
              ink: 'NONG',
              radiusStart: 1.5,
              radiusEnd: 0.9,
              alphaScale: 0.88,
              spacing: 0.6,
              bleed: 0.08,
              aspect: 1.2
            }
          );

          for (let k = 0; k < 6; k++) {
            pushAction({
              layer: 5,
              ink: k % 2 === 0 ? 'JIAO' : 'NONG',
              x: base.x + Math.sin(tilt) * h + randRange(-8, 8),
              y: base.y - h + randRange(-5, 6),
              r: randRange(1.8, 3.2),
              angle: randRange(-0.35, 0.35),
              aspect: 1.75,
              pressure: randRange(0.7, 1.05),
              alphaScale: 0.85,
              bleed: 0.1,
              dryness: 0
            });
          }
        });
      }

      // 5.3 焦墨点苔（聚于山脊转折与石缝处）
      const mossAnchors = [];
      if (mainMidSlope) {
        [0.18, 0.34, 0.48, 0.76, 0.88].forEach((tPos) => {
          const p = mainMidSlope.ridge[Math.floor(tPos * (mainMidSlope.ridge.length - 1))];
          mossAnchors.push({ x: p.x, y: p.y + 4, spread: 24, count: 7, size: [1.8, 3.2] });
        });
      }
      foregroundRocks.forEach(({ topContour }) => {
        const p1 = topContour[Math.floor(topContour.length * 0.25)];
        const p2 = topContour[Math.floor(topContour.length * 0.72)];
        mossAnchors.push({ x: p1.x, y: p1.y + 3, spread: 18, count: 6, size: [2.2, 4.0] });
        mossAnchors.push({ x: p2.x, y: p2.y + 4, spread: 20, count: 5, size: [2.0, 3.6] });
      });

      mossAnchors.forEach((anchor) => {
        for (let i = 0; i < anchor.count; i++) {
          pushAction({
            layer: 5,
            ink: 'JIAO',
            x: anchor.x + (rng() - 0.5) * anchor.spread,
            y: anchor.y + (rng() - 0.5) * anchor.spread * 0.55,
            r: randRange(anchor.size[0], anchor.size[1]),
            angle: randRange(-0.4, 0.4),
            aspect: randRange(1.4, 2.2),
            pressure: randRange(0.8, 1.15),
            alphaScale: randRange(0.78, 1.0),
            bleed: 0.08,
            dryness: rng() > 0.8 ? 0.32 : 0,
            softness: 0.58
          });
        }
      });

      // 5.4 近景石脚水草芦苇
      [
        { x: W * 0.56, y: H * 0.865, count: 7 },
        { x: W * 0.62, y: H * 0.848, count: 5 },
        { x: W * 0.72, y: H * 0.835, count: 6 }
      ].forEach((rc) => {
        for (let i = 0; i < rc.count; i++) {
          const rx = rc.x + randRange(-14, 14);
          const ry = rc.y + randRange(-4, 6);
          const h = randRange(18, 38);
          const bend = randRange(-16, 12);
          enqueueBrushPath(
            [
              { x: rx, y: ry },
              { x: rx + bend * 0.45, y: ry - h * 0.55 },
              { x: rx + bend, y: ry - h }
            ],
            {
              layer: 5,
              ink: 'JIAO',
              radiusStart: 1.5,
              radiusEnd: 0.6,
              alphaScale: 0.92,
              spacing: 0.55,
              bleed: 0.04,
              dryness: 0.18,
              aspect: 1.4
            }
          );
        }
      });

      // 5.5 少量焦墨飞白枯笔提神
      foregroundRocks.slice(0, 3).forEach(({ topContour }) => {
        const sub = topContour.slice(2, Math.min(topContour.length, 12));
        enqueueBrushPath(sub, {
          layer: 5,
          ink: 'JIAO',
          radiusStart: 3.4,
          radiusEnd: 2.2,
          alphaScale: 0.85,
          spacing: 0.55,
          bleed: 0,
          dryness: 0.72,
          aspect: 1.55,
          breakProb: 0.14,
          jitter: 1.6
        });
      });

      const mainTree = foregroundTrees[0];
      enqueueBrushPath(
        [
          { x: mainTree.x - 2, y: mainTree.y - 8 },
          { x: mainTree.x - 14, y: mainTree.y - 58 },
          { x: mainTree.x - 26, y: mainTree.y - 102 }
        ],
        {
          layer: 5,
          ink: 'JIAO',
          radiusStart: 4.0,
          radiusEnd: 2.0,
          alphaScale: 0.90,
          spacing: 0.58,
          bleed: 0,
          dryness: 0.76,
          aspect: 1.5,
          breakProb: 0.12,
          jitter: 1.2
        }
      );

      // -----------------------------------------------------------------------
      // 第六层：淡彩罩染（浅绛设色核心）
      // 原则：multiply 透明罩染，以墨骨为主、淡彩为辅，轻薄通透、严禁浓艳
      //   - 远山、山石背阴、近岸水际：薄罩花青（HUA_QING / HUA_QING_MIST）
      //   - 山石向阳面、平缓阳坡、老树干：薄罩赭石（ZHE_SHI / ZHE_SHI_LIGHT）
      // -----------------------------------------------------------------------

      // 6.1 远景淡墨群山薄罩花青（冷调空灵，山顶略清润，山脚淡入云雾）
      distantPeaks.forEach(({ ridge, spec }, dIdx) => {
        for (let row = 0; row < 2; row++) {
          const dropScale = row === 0 ? 0.16 : 0.42;
          const pts = [];
          for (let i = 0; i < ridge.length; i += 3) {
            const p = ridge[i];
            pts.push({
              x: p.x + (rng() - 0.5) * 6,
              y: p.y + spec.washDepth * dropScale * (0.5 + 0.5 * p.bell)
            });
          }
          enqueueBrushPath(pts, {
            layer: 6,
            ink: dIdx === 1 ? 'HUA_QING' : 'HUA_QING_MIST',
            radiusStart: lerp(22, 34, row),
            radiusEnd: lerp(20, 32, row),
            alphaScale: row === 0 ? 0.82 : 0.48,
            spacing: 0.68,
            bleed: 0.85,
            aspect: 1.7,
            softness: 0.24,
            jitter: 5,
            composite: 'multiply'
          });
        }
      });

      // 6.2 中景平缓山坡设色：向阳上部薄罩赭石，背阴凹谷与坡脚薄罩花青
      midSlopes.forEach(({ ridge, spec }) => {
        if (spec.isSandbar) {
          // 远岸沙洲极轻抹一笔淡赭
          const pts = ridge.filter((_, i) => i % 2 === 0).map((p) => ({ x: p.x, y: p.y + 4 }));
          enqueueBrushPath(pts, {
            layer: 6,
            ink: 'ZHE_SHI_LIGHT',
            radiusStart: 9,
            radiusEnd: 7,
            alphaScale: 0.72,
            spacing: 0.72,
            bleed: 0.75,
            aspect: 1.9,
            softness: 0.26,
            composite: 'multiply'
          });
          return;
        }

        // 山坡向阳面（脊线偏左上与中上段）薄罩赭石
        const sunlitPts = ridge
          .filter((_, idx) => idx % 2 === 0)
          .map((p) => ({
            x: p.x - 4,
            y: p.y + spec.depth * 0.22 * (0.4 + 0.6 * Math.sin(p.t * Math.PI))
          }));
        enqueueBrushPath(sunlitPts, {
          layer: 6,
          ink: spec.isMainMid ? 'ZHE_SHI' : 'ZHE_SHI_LIGHT',
          radiusStart: 18,
          radiusEnd: 24,
          alphaScale: spec.isMainMid ? 0.82 : 0.65,
          spacing: 0.68,
          bleed: 0.82,
          aspect: 1.75,
          softness: 0.25,
          jitter: 4,
          composite: 'multiply'
        });

        // 山坡背阴下段与山脚薄罩花青，形成温润冷暖过渡
        const shadedPts = ridge
          .filter((p, idx) => idx % 2 === 0 && p.t > 0.22)
          .map((p) => ({
            x: p.x + 12,
            y: p.y + spec.depth * 0.62 * (0.45 + 0.55 * Math.sin(p.t * Math.PI))
          }));
        enqueueBrushPath(shadedPts, {
          layer: 6,
          ink: 'HUA_QING',
          radiusStart: 20,
          radiusEnd: 26,
          alphaScale: spec.isMainMid ? 0.66 : 0.52,
          spacing: 0.72,
          bleed: 0.85,
          aspect: 1.8,
          softness: 0.24,
          jitter: 4,
          composite: 'multiply'
        });
      });

      // 6.3 近景山石：向阳顶面与左侧薄罩赭石，背阴石底与右侧薄罩花青
      foregroundRocks.forEach(({ rk, topContour }) => {
        // 石头向阳面（上方偏左）薄罩赭石
        const sunPts = topContour.slice(1, Math.floor(topContour.length * 0.68)).map((p) => ({
          x: lerp(p.x, rk.cx - rk.rx * 0.14, 0.32),
          y: lerp(p.y, rk.cy - rk.ry * 0.12, 0.35)
        }));
        enqueueBrushPath(sunPts, {
          layer: 6,
          ink: 'ZHE_SHI',
          radiusStart: Math.min(24, rk.ry * 0.58),
          radiusEnd: Math.min(20, rk.ry * 0.48),
          alphaScale: 0.92,
          spacing: 0.62,
          bleed: 0.75,
          aspect: 1.55,
          softness: 0.28,
          jitter: 3,
          composite: 'multiply'
        });

        // 石头背阴面（下方偏右）薄罩花青
        const shadowPts = topContour.slice(Math.floor(topContour.length * 0.52)).map((p) => ({
          x: lerp(p.x, rk.cx + rk.rx * 0.18, 0.35),
          y: lerp(p.y, rk.cy + rk.ry * 0.36, 0.55)
        }));
        enqueueBrushPath(shadowPts, {
          layer: 6,
          ink: 'HUA_QING',
          radiusStart: Math.min(22, rk.ry * 0.52),
          radiusEnd: Math.min(24, rk.ry * 0.56),
          alphaScale: 0.74,
          spacing: 0.65,
          bleed: 0.78,
          aspect: 1.6,
          softness: 0.26,
          jitter: 3,
          composite: 'multiply'
        });
      });

      // 6.4 树干微罩淡赭，树冠叶簇轻点淡花青与淡赭（浅绛秋意清雅）
      treeTrunks.forEach(({ pts, width }) => {
        enqueueBrushPath(pts, {
          layer: 6,
          ink: 'ZHE_SHI_LIGHT',
          radiusStart: width * 1.15,
          radiusEnd: width * 0.85,
          alphaScale: 0.85,
          spacing: 0.68,
          bleed: 0.45,
          aspect: 1.3,
          softness: 0.35,
          composite: 'multiply'
        });
      });

      treeTips.forEach((tip, idx) => {
        // 树叶间错落极轻的淡花青与淡赭，通透而不抢焦墨点叶
        const tint = idx % 3 === 0 ? 'ZHE_SHI_LIGHT' : 'HUA_QING_MIST';
        pushAction({
          layer: 6,
          ink: tint,
          x: tip.x + randRange(-8, 8),
          y: tip.y + randRange(-5, 6),
          r: randRange(16, 26),
          angle: randRange(-0.25, 0.25),
          aspect: 1.45,
          pressure: 0.85,
          alphaScale: 0.88,
          bleed: 0.72,
          softness: 0.25,
          composite: 'multiply'
        });
      });

      // 6.5 水面近岸处极薄花青晕染（贴近中景与近景水际线，绝不填满左下大片空白）
      const waterMistPaths = [
        // 远岸沙洲下方一缕极淡花青水气
        [
          { x: W * 0.17, y: H * 0.578 },
          { x: W * 0.27, y: H * 0.585 },
          { x: W * 0.36, y: H * 0.580 }
        ],
        // 中景山坡入水处一缕淡花青水影
        [
          { x: W * 0.38, y: H * 0.655 },
          { x: W * 0.49, y: H * 0.665 },
          { x: W * 0.60, y: H * 0.658 }
        ],
        // 近景右下石脚水际轻染淡花青
        [
          { x: W * 0.50, y: H * 0.885 },
          { x: W * 0.62, y: H * 0.900 },
          { x: W * 0.74, y: H * 0.905 }
        ]
      ];

      waterMistPaths.forEach((wPts) => {
        enqueueBrushPath(wPts, {
          layer: 6,
          ink: 'HUA_QING_MIST',
          radiusStart: 16,
          radiusEnd: 18,
          alphaScale: 0.68,
          spacing: 0.72,
          bleed: 0.90,
          aspect: 2.3,
          softness: 0.22,
          jitter: 3,
          composite: 'multiply'
        });
      });
    }

    // =========================================================================
    // 4. 动作队列逐笔渲染循环与完成自动下载 PNG
    // =========================================================================
    function triggerAutoDownload() {
      if (hasDownloaded) return;
      hasDownloaded = true;
      try {
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
        link.download = `浅绛山水_${stamp}.png`;
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.warn('自动下载 PNG 失败：', err);
      }
    }

    function updateStatusUI(layerNum, done = false) {
      if (done) {
        layerStatusEl.textContent = '浅绛山水绘制完成（已自动保存 PNG）';
      } else {
        layerStatusEl.textContent = CONFIG.LAYER_NAMES[layerNum] || '运笔设色中…';
      }
      strokeStatusEl.textContent = `${currentIndex} / ${strokeQueue.length} 笔`;
    }

    function renderLoop() {
      const batch = CONFIG.SPEED_LEVELS[speedIndex].dabsPerFrame;
      let lastLayer = 1;

      for (let i = 0; i < batch; i++) {
        if (currentIndex >= strokeQueue.length) break;
        const action = strokeQueue[currentIndex++];
        lastLayer = action.layer;
        executeStrokeAction(action);
      }

      if (currentIndex < strokeQueue.length) {
        updateStatusUI(lastLayer, false);
        animFrameId = requestAnimationFrame(renderLoop);
      } else {
        animFrameId = null;
        updateStatusUI(6, true);
        requestAnimationFrame(() => triggerAutoDownload());
      }
    }

    // =========================================================================
    // 5. 初始化与页面按钮交互控制
    // =========================================================================
    function startPainting() {
      if (animFrameId !== null) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }

      rng = createPRNG((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
      hasDownloaded = false;
      currentIndex = 0;

      // 重绘宣纸基底
      paperCanvas = buildXuanPaper();
      ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      ctx.drawImage(paperCanvas, 0, 0);

      // 严格按六层顺序构建绘制队列
      buildPaintingQueue();
      updateStatusUI(1, false);

      // 启动逐笔作画动画
      animFrameId = requestAnimationFrame(renderLoop);
    }

    redrawBtn.addEventListener('click', () => {
      startPainting();
    });

    speedBtn.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % CONFIG.SPEED_LEVELS.length;
      const level = CONFIG.SPEED_LEVELS[speedIndex];
      speedBtn.textContent = level.label;
      speedBtn.classList.toggle('active', speedIndex > 0);
    });

    // 页面加载完成后自动起笔作画
    startPainting();
  </script>
</body>
